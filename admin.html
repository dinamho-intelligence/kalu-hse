<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KALU · Administración</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#0f1218;--amber:#F28C00;--amber2:#FF9F1C;--bg:#eef0f4;--panel:#fff;--line:#e2e5ec;--line2:#d7dbe4;--tx:#1c2230;--mut:#6b7385;--pri:#2e75b6;--ok:#2fa36b;--no:#d9534f;--cyan:#0aa2c0}
  html,body{height:100%}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:11px 20px;flex-shrink:0}
  header .txt b{display:block;font-size:16px;font-weight:800;letter-spacing:.4px;line-height:1}
  header .sp{flex:1}
  .btn{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:all .15s}
  .btn-amber{background:linear-gradient(180deg,var(--amber2),var(--amber));color:#1a1200}
  .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff}
  .btn-ghost:hover{border-color:var(--amber);color:var(--amber)}
  .btn-sm{font-size:12px;padding:6px 11px;border-radius:8px}
  .btn-b{background:#fff;border:1.5px solid var(--line2);color:var(--tx)} .btn-b:hover{border-color:var(--amber);color:var(--amber)}
  .btn-cy{background:#e8f6fa;border:1.5px solid #b7e2ec;color:#0a7a94} .btn-cy:hover{background:#dff1f6}
  .btn-danger{background:#fff;border:1.5px solid #f0c9c6;color:var(--no)} .btn-danger:hover{background:#fdeeed}
  .tabs{display:flex;gap:2px;background:var(--ink);padding:0 20px;flex-shrink:0;flex-wrap:wrap}
  .tab{background:transparent;border:none;color:#9aa3b2;font-family:inherit;font-size:13px;font-weight:700;padding:11px 16px;cursor:pointer;border-bottom:3px solid transparent}
  .tab.active{color:#fff;border-bottom-color:var(--amber)}
  .body{flex:1;overflow-y:auto;padding:20px}
  .wrap{max-width:960px;margin:0 auto}
  h2.sec{font-size:14px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:0 0 14px}
  .row{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .row.off{opacity:.55}
  .row .nm{font-size:15px;font-weight:700}
  .row .meta{font-size:12.5px;color:var(--mut)}
  .grow{flex:1;min-width:0}
  .bdg{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px}
  .bdg.a{background:#e4f4ec;color:#1c6b47}.bdg.i{background:#fdeeed;color:#b23b34}.bdg.r{background:#eef0f4;color:#3a4658}.bdg.s{background:#fff3e0;color:#8a5a12}.bdg.m{background:#e8f1fb;color:#245a91}
  .modchips{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
  .mchk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;background:#f7f8fb;border:1.5px solid var(--line2);border-radius:20px;padding:5px 11px;cursor:pointer;user-select:none}
  .mchk.on{background:#fff3e0;border-color:var(--amber);color:#8a5a12}
  .card{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
  .fld label{display:block;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
  .fld input,.fld select{width:100%;font-family:inherit;font-size:14px;border:1.5px solid var(--line2);border-radius:9px;padding:9px 12px;outline:none;background:#fff}
  .fld input:focus,.fld select:focus{border-color:var(--amber)}
  .empty{color:var(--mut);font-size:13px;text-align:center;padding:26px;border:2px dashed var(--line2);border-radius:12px}
  .note{font-size:12.5px;color:var(--mut);background:#f7f8fb;border:1px solid var(--line);border-radius:10px;padding:11px 13px;line-height:1.5}
  .note b{color:var(--tx)}
  .aud{font-size:12.5px;border-bottom:1px dashed var(--line);padding:8px 0;display:flex;gap:10px}
  .aud .t{color:var(--mut);white-space:nowrap}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .toolbar .fld{margin:0}
  /* gate */
  #gate{position:fixed;inset:0;z-index:300;background:radial-gradient(1000px 520px at 50% -12%,#141a24,#0b0e13);display:flex;align-items:center;justify-content:center;padding:20px}
  #gate .gbox{width:100%;max-width:380px;text-align:center}
  #gate h1{font-size:24px;font-weight:900;color:#fff;margin-bottom:4px}
  #gate .gsub{color:#9aa3b2;font-size:13px;margin-bottom:22px}
  #gate .gfld{text-align:left;margin-bottom:12px}
  #gate .gfld label{display:block;font-size:11px;font-weight:700;color:#9aa3b2;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
  #gate input{width:100%;background:#141a24;border:1.5px solid #2a3340;border-radius:10px;color:#fff;font-size:15px;padding:11px 14px;font-family:inherit;outline:none}
  #gate input:focus{border-color:var(--amber)}
  #gate .gerr{color:#e0574a;font-size:13px;margin-bottom:10px;display:none}
  .spin{color:var(--mut);text-align:center;padding:30px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#0f1218;color:#fff;font-size:13px;font-weight:700;padding:11px 18px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:all .2s;z-index:500}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)} .toast.err{background:#c0392b}
  /* modal */
  .ov{position:fixed;inset:0;z-index:400;background:rgba(9,12,17,.55);display:none;align-items:center;justify-content:center;padding:20px}
  .ov.show{display:flex}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
  .modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#fff;z-index:1}
  .modal .mh b{font-size:16px;font-weight:800}
  .modal .mh .sub{font-size:12px;color:var(--mut)}
  .modal .mb{padding:16px 20px}
  .modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
  .modblk{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
  .modblk .top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .modblk .top .ic{font-size:18px}
  .modblk .top b{font-size:14px}
  .modblk select{margin-left:auto;width:auto;min-width:150px}
  .perms{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .pchk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;background:#f7f8fb;border:1.5px solid var(--line2);border-radius:8px;padding:5px 10px;cursor:pointer;user-select:none}
  .pchk.on{background:#e4f4ec;border-color:#8fd3b0;color:#1c6b47}
  .pchk.dis{opacity:.4;pointer-events:none}
  .x{margin-left:auto;cursor:pointer;color:var(--mut);font-size:20px;line-height:1;background:none;border:none}
</style>
</head>
<body>

<div id="gate">
  <div class="gbox">
    <svg width="42" height="46" viewBox="0 0 46 50" style="margin-bottom:12px"><polygon points="23,2 44,13.5 44,36.5 23,48 2,36.5 2,13.5" fill="#1a140a" stroke="#F28C00" stroke-width="2.5"/><text x="23" y="31" text-anchor="middle" fill="#F28C00" font-size="15" font-weight="900" font-family="Inter">DI</text></svg>
    <h1>KALU · Administración</h1>
    <div class="gsub">Panel de super-admin / admin de empresa</div>
    <div class="gfld"><label>Email</label><input id="g_email" type="email" placeholder="tu@empresa.com" /></div>
    <div class="gfld"><label>Contraseña</label><input id="g_pass" type="password" onkeydown="if(event.key==='Enter')doLoginGate()" /></div>
    <div class="gerr" id="g_err"></div>
    <button class="btn btn-amber" id="g_btn" style="width:100%;justify-content:center" onclick="doLoginGate()">Ingresar →</button>
    <div style="margin-top:16px"><a href="ingreso.html" style="color:#8a93a3;font-size:12px;text-decoration:none">← Volver al portal</a></div>
  </div>
</div>

<header>
  <svg width="30" height="33" viewBox="0 0 46 50"><polygon points="23,2 44,13.5 44,36.5 23,48 2,36.5 2,13.5" fill="#1a140a" stroke="#F28C00" stroke-width="3"/><text x="23" y="31" text-anchor="middle" fill="#F28C00" font-size="15" font-weight="900" font-family="Inter">DI</text></svg>
  <div class="txt"><b>KALU · Administración</b></div>
  <div class="sp"></div>
  <span id="meChip" style="font-size:12px;color:#cfd4dd;font-weight:600"></span>
  <button class="btn btn-ghost" onclick="salir()">⎋ Salir</button>
</header>

<div class="tabs" id="tabs"></div>
<div class="body"><div class="wrap" id="view"><div class="spin">Cargando…</div></div></div>

<!-- Modal de accesos -->
<div class="ov" id="ov">
  <div class="modal">
    <div class="mh"><span style="font-size:20px">🎛️</span><div><b id="ov_t">Accesos</b><div class="sub" id="ov_s"></div></div><button class="x" onclick="cerrarAccesos()">×</button></div>
    <div class="mb" id="ov_b"></div>
    <div class="mf"><button class="btn btn-b" onclick="cerrarAccesos()">Cancelar</button><button class="btn btn-amber" id="ov_save" onclick="guardarAccesos()">Guardar accesos</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $ = s => document.querySelector(s);
/* CASA = plataforma unificada */
const SB_URL  = "https://nignqeipzlemwfrwmpip.supabase.co";
const SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pZ25xZWlwemxlbXdmcndtcGlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5OTgyNTgsImV4cCI6MjEwMDU3NDI1OH0.bPpfNiOeDfsrYHECSULa9Cwfxa1_QxaWVLKBhTOPwOs";
/* Webhook de n8n para acciones con permisos de admin (invitar, resetear, crear super).
   Cuando lo tengamos, se completa acá y los botones quedan vivos. */
const N8N_HOOK = "https://dnmintell.app.n8n.cloud/webhook/kalu-admin";
let SB_TOKEN=null, ME=null, TAB="", CTX_EMP=null, EMPRESAS=[];

/* Catálogo de módulos → roles → permisos por defecto (editables) */
const MODULOS=[
  {key:"hse", nombre:"HSE", ic:"🛡️",
   perms:["validacion","ats","tarjetas","investigaciones","expedientes","aprobar_ats","aprobar_tarjetas","consola"],
   roles:{
     operador:["tarjetas","ats","investigaciones"],
     investigador:["investigaciones"],
     coordinador:["consola","expedientes","tarjetas","investigaciones"],
     supervisor:["aprobar_ats","aprobar_tarjetas"]
  }},
  {key:"ra", nombre:"Realidad Asistida", ic:"🥽",
   perms:["captura","consola","asiste"],
   roles:{
     operador:["captura"],
     coordinador:["consola","asiste"]
  }},
  {key:"qaqc", nombre:"QA/QC", ic:"📐",
   perms:["captura","editor_informes","consola"],
   roles:{
     asegurador:["captura","editor_informes"],
     coordinador:["consola"]
  }},
  {key:"ndt", nombre:"NDT", ic:"🔬", perms:[], roles:{}}
];
const PERM_LABEL={
  validacion:"Validación", ats:"ATS", tarjetas:"Tarjetas",
  investigaciones:"Investigaciones", expedientes:"Expedientes",
  aprobar_ats:"Aprobar ATS", aprobar_tarjetas:"Aprobar tarjetas",
  captura:"Captura", consola:"Consola", asiste:"Asistencia en vivo",
  editor_informes:"Editor de informes"
};
function modDef(k){ return MODULOS.find(function(m){return m.key===k;}); }

async function sbFetch(path, opts){
  opts=opts||{}; opts.headers=Object.assign({apikey:SB_ANON,"Content-Type":"application/json"}, opts.headers||{});
  if(SB_TOKEN) opts.headers["Authorization"]="Bearer "+SB_TOKEN;
  const res=await fetch(SB_URL+path,opts);
  const txt=await res.text(); let d=null; try{d=txt?JSON.parse(txt):null;}catch(e){d=txt;}
  if(!res.ok) throw new Error((d&&(d.message||d.error_description||d.msg))||("HTTP "+res.status));
  return d;
}
function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fFecha(s){ try{ const d=new Date(s); return d.toLocaleDateString()+" "+d.toLocaleTimeString().slice(0,5); }catch(e){ return ""; } }
let toastT=null;
function toast(m,err){ let t=$(".toast"); if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t);} t.textContent=m; t.className="toast show"+(err?" err":""); if(toastT)clearTimeout(toastT); toastT=setTimeout(function(){t.className="toast";},3000); }
async function logAud(accion,entidad,entidad_id,detalle){ try{ await sbFetch("/rest/v1/auditoria",{method:"POST",body:JSON.stringify({empresa_id:CTX_EMP||ME.empresa_id,actor_id:ME.id,actor_nombre:ME.nombre||ME.email,accion:accion,entidad:entidad,entidad_id:String(entidad_id||""),detalle:detalle||null})}); }catch(e){} }

/* ---------- Auth ---------- */
async function sbLoginPass(email,password){
  const d=await sbFetch("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:email,password:password})});
  SB_TOKEN=d.access_token;
}
async function cargarMe(){
  const u=await sbFetch("/auth/v1/user",{});
  const p=await sbFetch("/rest/v1/perfiles?id=eq."+u.id+"&select=id,empresa_id,nombre,email,rol,es_super,estado,acceso_consola");
  if(!p||!p.length) throw new Error("Tu usuario no tiene perfil.");
  ME=p[0]; ME.email=ME.email||u.email;
  if(!ME.es_super && ME.rol!=="admin") throw new Error("Necesitás ser admin o super-admin para entrar acá.");
  CTX_EMP=ME.empresa_id;
  $("#meChip").textContent="👤 "+(ME.nombre||ME.email)+(ME.es_super?" · super-admin":" · admin");
  $("#gate").style.display="none";
  if(ME.es_super){ try{ EMPRESAS=await sbFetch("/rest/v1/empresas?select=id,razon_social,modulos,activa&order=razon_social.asc"); }catch(e){ EMPRESAS=[]; } if(EMPRESAS.length) CTX_EMP=EMPRESAS[0].id; }
  construirTabs();
}
async function doLoginGate(){
  const email=$("#g_email").value.trim(), pass=$("#g_pass").value, err=$("#g_err"), btn=$("#g_btn");
  if(!email||!pass){ err.textContent="Completá email y contraseña."; err.style.display="block"; return; }
  btn.disabled=true; btn.textContent="Ingresando…"; err.style.display="none";
  try{ await sbLoginPass(email,pass); try{ sessionStorage.setItem("kalu_ses",JSON.stringify({token:SB_TOKEN,ts:Date.now()})); }catch(e){} await cargarMe(); }
  catch(e){ err.textContent=(e&&e.message)||"Error"; err.style.display="block"; }
  finally{ btn.disabled=false; btn.textContent="Ingresar →"; }
}
function salir(){ if(!confirm("¿Cerrar sesión?"))return; try{ sessionStorage.removeItem("kalu_ses"); }catch(e){} SB_TOKEN=null; window.location.href="ingreso.html"; }

/* ---------- Tabs ---------- */
function construirTabs(){
  const tabs=[];
  if(ME.es_super) tabs.push(["empresas","🏢 Empresas y módulos"]);
  tabs.push(["usuarios","👥 Usuarios y accesos"]);
  tabs.push(["padron","🪪 Padrón (cédulas)"]);
  tabs.push(["auditoria","📜 Auditoría"]);
  $("#tabs").innerHTML=tabs.map(function(t){return '<button class="tab" id="tab_'+t[0]+'" onclick="irTab(\''+t[0]+'\')">'+t[1]+'</button>';}).join("");
  irTab(tabs[0][0]);
}
function irTab(t){ TAB=t; document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("active",b.id==="tab_"+t);});
  if(t==="empresas") viewEmpresas(); else if(t==="usuarios") viewUsuarios(); else if(t==="padron") viewPadron(); else viewAuditoria(); }

function selectorEmpresa(){
  if(!ME.es_super) return "";
  const opts=EMPRESAS.map(function(e){return '<option value="'+e.id+'"'+(e.id===CTX_EMP?" selected":"")+'>'+esc(e.razon_social)+'</option>';}).join("");
  return '<div class="fld" style="margin:0"><label>Empresa</label><select onchange="CTX_EMP=this.value;irTab(TAB)">'+opts+'</select></div>';
}
function empModulos(id){ const e=EMPRESAS.find(function(x){return x.id===id;}); const m=e&&Array.isArray(e.modulos)?e.modulos:null; return m; }

/* ---------- EMPRESAS + MÓDULOS (solo super) ---------- */
async function viewEmpresas(){
  $("#view").innerHTML='<div class="spin">Cargando empresas…</div>';
  try{ EMPRESAS=await sbFetch("/rest/v1/empresas?select=id,razon_social,modulos,activa&order=razon_social.asc"); }
  catch(e){ $("#view").innerHTML='<div class="empty" style="color:var(--no)">'+esc(e.message)+'</div>'; return; }
  let h='<h2 class="sec">Empresas y módulos contratados</h2>';
  h+='<div class="card"><h2 class="sec" style="margin-bottom:10px">Nueva empresa</h2><div class="fgrid"><div class="fld"><label>Razón social</label><input id="ne_rs" placeholder="Nombre de la empresa"/></div><div class="fld"><label>NIT (opcional)</label><input id="ne_nit" placeholder="NIT"/></div></div><button class="btn btn-amber btn-sm" onclick="crearEmpresa()">+ Crear empresa</button><div class="note" style="margin-top:10px">Al crearla podés invitar a su admin por correo (webhook n8n).</div></div>';
  h+='<div class="note" style="margin-bottom:14px">Marcá qué módulos tiene cada empresa. El portal le muestra a su gente solo los módulos habilitados <b>y</b> donde tengan rol.</div>';
  if(!EMPRESAS.length){ h+='<div class="empty">No hay empresas cargadas.</div>'; }
  else h+=EMPRESAS.map(function(e){
    const mods=Array.isArray(e.modulos)?e.modulos:[];
    const chips=MODULOS.map(function(m){ const on=mods.indexOf(m.key)>=0; return '<span class="mchk '+(on?"on":"")+'" onclick="toggleModulo(\''+e.id+'\',\''+m.key+'\','+(on?"false":"true")+')">'+m.ic+' '+m.nombre+(on?' ✓':'')+'</span>'; }).join("");
    return '<div class="row '+(e.activa===false?"off":"")+'" style="flex-direction:column;align-items:stretch"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="nm">'+esc(e.razon_social)+'</span>'+(e.activa===false?'<span class="bdg i">inactiva</span>':'<span class="bdg a">activa</span>')+'<div class="grow"></div><button class="btn btn-cy btn-sm" onclick="invitarAdmin(\''+e.id+'\',\''+esc(e.razon_social)+'\')">✉ Invitar admin</button><button class="btn btn-b btn-sm" onclick="toggleEmpresaActiva(\''+e.id+'\','+(e.activa===false?"true":"false")+')">'+(e.activa===false?"Reactivar":"Desactivar")+'</button></div><div class="modchips">'+chips+'</div></div>';
  }).join("");
  $("#view").innerHTML=h;
}
async function crearEmpresa(){
  const rs=$("#ne_rs").value.trim(), nit=$("#ne_nit").value.trim();
  if(!rs){ toast("Poné la razón social.",true); return; }
  try{ await sbFetch("/rest/v1/empresas",{method:"POST",body:JSON.stringify({razon_social:rs,nit:nit||null,modulos:[],activa:true})}); logAud("crear_empresa","empresa",rs,null); toast("Empresa creada"); viewEmpresas(); }
  catch(e){ toast("Error: "+e.message,true); }
}
async function toggleModulo(empId,key,activar){
  try{
    const cur=(await sbFetch("/rest/v1/empresas?id=eq."+empId+"&select=modulos"))[0].modulos||[];
    let mods=Array.isArray(cur)?cur.slice():[];
    if(activar){ if(mods.indexOf(key)<0) mods.push(key); } else { mods=mods.filter(function(k){return k!==key;}); }
    await sbFetch("/rest/v1/empresas?id=eq."+empId,{method:"PATCH",body:JSON.stringify({modulos:mods})});
    logAud("set_modulos","empresa",empId,{modulos:mods}); toast("Módulos actualizados"); viewEmpresas();
  }catch(e){ toast("Error: "+e.message,true); }
}
async function toggleEmpresaActiva(id,activar){
  try{ await sbFetch("/rest/v1/empresas?id=eq."+id,{method:"PATCH",body:JSON.stringify({activa:activar})}); logAud(activar?"reactivar_empresa":"desactivar_empresa","empresa",id,null); viewEmpresas(); }
  catch(e){ toast("Error: "+e.message,true); }
}

/* ---------- USUARIOS (perfiles registrados + accesos) ---------- */
var _USERS=[], _BYUSER={};
var BUSCADOR_CSS='width:100%;max-width:460px;margin:0 0 12px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:#161A22;color:#EDEFF2;font-size:14px;outline:none';
function usuarioRow(u){
  const yo=(u.id===ME.id), activo=(u.estado==="activo");
  const mias=(_BYUSER[u.id]||[]);

/* ---------- CSV ---------- */
const PLANTILLA_COLS=["nombre","cedula","correo","celular","cargo","hse_rol","ra_rol","qaqc_rol"];
const PLANTILLA_EJ=["Juan Perez","12345678","juan@empresa.com","3001234567","Inspector","operador","","asegurador"];
/* alias de encabezados: para que reconozca la columna aunque la renombren */
const COL_ALIAS={
  "nombre":"nombre","nombres":"nombre","nombre completo":"nombre","nombre y apellido":"nombre",
  "cedula":"cedula","cédula":"cedula","cc":"cedula","cc/ce/pas":"cedula","cc/ce/pas.":"cedula","documento":"cedula","doc":"cedula","identificacion":"cedula","identificación":"cedula","nro documento":"cedula",
  "correo":"correo","correo electronico":"correo","correo electrónico":"correo","email":"correo","e-mail":"correo","mail":"correo",
  "celular":"celular","telefono":"celular","teléfono":"celular","tel":"celular","movil":"celular","móvil":"celular","whatsapp":"celular",
  "cargo":"cargo","puesto":"cargo","rol":"cargo",
  "hse_rol":"hse_rol","hse":"hse_rol","rol_hse":"hse_rol",
  "ra_rol":"ra_rol","ra":"ra_rol","rol_ra":"ra_rol",
  "qaqc_rol":"qaqc_rol","qaqc":"qaqc_rol","qa/qc":"qaqc_rol","rol_qaqc":"qaqc_rol"
};
function canon(h){ h=String(h==null?"":h).trim().toLowerCase(); return COL_ALIAS[h]||h; }
function descargarPlantilla(){
  const csv=PLANTILLA_COLS.join(",")+"\n"+PLANTILLA_EJ.join(",")+"\n";
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="plantilla_padron_kalu.csv"; a.click();
}
function descargarPlantillaXlsx(){
  if(typeof XLSX==="undefined"){ toast("Cargando Excel… probá de nuevo en un segundo.",true); return; }
  const ws=XLSX.utils.aoa_to_sheet([PLANTILLA_COLS,PLANTILLA_EJ]);
  ws["!cols"]=PLANTILLA_COLS.map(function(){return {wch:16};});
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Padron");
  XLSX.writeFile(wb,"plantilla_padron_kalu.xlsx");
}
function parseCSV(txt){
  const lines=txt.replace(/\r/g,"").split("\n").filter(function(l){return l.trim().length;});
  if(!lines.length) return [];
  const head=lines[0].split(",").map(canon);
  return lines.slice(1).map(function(l){ const c=l.split(","); const o={}; head.forEach(function(h,i){o[h]=(c[i]||"").trim();}); return o; });
}
function previstosDesde(row){
  const out=[];
  [["hse","hse_rol"],["ra","ra_rol"],["qaqc","qaqc_rol"]].forEach(function(m){
    const rol=(row[m[1]]||"").trim(); if(!rol) return;
    const d=modDef(m[0]); const perms=(d&&d.roles[rol])?d.roles[rol].slice():[];
    out.push({modulo:m[0],rol:rol,permisos:perms});
  });
  return out;
}
function rowsDeExcel(buf){
  const wb=XLSX.read(buf,{type:"array"});
  const ws=wb.Sheets[wb.SheetNames[0]]; if(!ws) return [];
  const arr=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
  if(!arr.length) return [];
  const head=arr[0].map(canon);
  return arr.slice(1).map(function(r){ const o={}; head.forEach(function(h,i){o[h]=String(r[i]==null?"":r[i]).trim();}); return o; })
            .filter(function(o){return o.cedula||o.nombre;});
}
async function cargarArchivo(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  const name=(f.name||"").toLowerCase(); inp.value="";
  let rows=[];
  try{
    if(name.endsWith(".xlsx")||name.endsWith(".xls")){
      if(typeof XLSX==="undefined"){ toast("Cargando Excel… probá de nuevo en un segundo.",true); return; }
      rows=rowsDeExcel(await f.arrayBuffer());
    } else {
      rows=parseCSV(await f.text());
    }
  }catch(e){ toast("No se pudo leer el archivo: "+e.message,true); return; }
  if(!rows.length){ toast("El archivo está vacío o no tiene filas válidas.",true); return; }
  let ok=0, err=0;
  for(const r of rows){
    if(!r.cedula||!r.nombre){ err++; continue; }
    const body={empresa_id:CTX_EMP,nombre:r.nombre,cedula:r.cedula,correo:r.correo||null,celular:r.celular||null,cargo:r.cargo||null,vigente:true,accesos_previstos:previstosDesde(r)};
    try{ await sbFetch("/rest/v1/personas",{method:"POST",headers:{Prefer:"resolution=merge-duplicates"},body:JSON.stringify(body)}); ok++; }catch(e){ err++; }
  }
  logAud("carga_csv","persona",CTX_EMP,{ok:ok,err:err});
  toast("Cargadas "+ok+(err?" · "+err+" con error/omitidas":"")); viewPadron();
}

/* ---------- MODAL ACCESOS (usuarios y padrón) ---------- */
let OV={};
async function abrirAccesos(tipo,id,nombre){
  let mods=empModulos(CTX_EMP);
  if(mods===null){ try{ mods=(await sbFetch("/rest/v1/empresas?id=eq."+CTX_EMP+"&select=modulos"))[0].modulos||[]; }catch(e){ mods=[]; } }
  let current=[];
  try{
    if(tipo==="user") current=await sbFetch("/rest/v1/accesos?usuario_id=eq."+id+"&select=modulo,rol,permisos");
    else { const p=await sbFetch("/rest/v1/personas?id=eq."+id+"&select=accesos_previstos"); current=(p[0]&&Array.isArray(p[0].accesos_previstos))?p[0].accesos_previstos:[]; }
  }catch(e){ current=[]; }
  OV={tipo:tipo,id:id,mods:mods};
  const curMap={}; current.forEach(function(a){ curMap[a.modulo]=a; });
  $("#ov_t").textContent="Accesos"; $("#ov_s").textContent=nombre;
  if(!mods.length){ $("#ov_b").innerHTML='<div class="empty">Esta empresa no tiene módulos habilitados. Prendé módulos en la pestaña Empresas primero.</div>'; }
  else $("#ov_b").innerHTML=mods.map(function(k){
    const d=modDef(k); if(!d) return "";
    const roles=Object.keys(d.roles);
    const cur=curMap[k];
    const opts='<option value="">— sin acceso —</option>'+roles.map(function(r){return '<option value="'+r+'"'+(cur&&cur.rol===r?" selected":"")+'>'+r+'</option>';}).join("");
    return '<div class="modblk" data-mod="'+k+'"><div class="top"><span class="ic">'+d.ic+'</span><b>'+esc(d.nombre)+'</b><select onchange="rolCambio(\''+k+'\',this.value)">'+opts+'</select></div><div class="perms" id="perms_'+k+'"></div></div>';
  }).join("");
  mods.forEach(function(k){ const cur=curMap[k]; if(cur&&cur.rol) pintarPerms(k,cur.rol,Array.isArray(cur.permisos)?cur.permisos:null); });
  $("#ov").classList.add("show");
}
function pintarPerms(k,rol,sel){
  const d=modDef(k); const box=$("#perms_"+k); if(!box||!d) return;
  if(!rol){ box.innerHTML=""; return; }
  const all=(d.perms&&d.perms.length)?d.perms:(d.roles[rol]||[]);  // TODOS los permisos del módulo
  const def=d.roles[rol]||[]; const chosen=sel||def.slice();        // pre-tildados según el rol (o lo guardado)
  box.innerHTML=all.map(function(p){ const on=chosen.indexOf(p)>=0; return '<span class="pchk '+(on?"on":"")+'" data-p="'+p+'" onclick="this.classList.toggle(\'on\')">'+(PERM_LABEL[p]||p)+'</span>'; }).join("")||'<span class="meta">Sin permisos configurables.</span>';
}
function rolCambio(k,rol){ pintarPerms(k,rol,null); }
function cerrarAccesos(){ $("#ov").classList.remove("show"); OV={}; }
function leerModal(){
  const out=[];
  OV.mods.forEach(function(k){
    const blk=document.querySelector('.modblk[data-mod="'+k+'"]'); if(!blk) return;
    const rol=blk.querySelector("select").value; if(!rol) return;
    const perms=[]; blk.querySelectorAll(".pchk.on").forEach(function(el){ perms.push(el.getAttribute("data-p")); });
    out.push({modulo:k,rol:rol,permisos:perms});
  });
  return out;
}
async function guardarAccesos(){
  const arr=leerModal(); const btn=$("#ov_save"); btn.disabled=true; btn.textContent="Guardando…";
  try{
    if(OV.tipo==="padron"){
      await sbFetch("/rest/v1/personas?id=eq."+OV.id,{method:"PATCH",body:JSON.stringify({accesos_previstos:arr})});
      logAud("set_accesos_previstos","persona",OV.id,{n:arr.length});
    } else {
      await sbFetch("/rest/v1/accesos?usuario_id=eq."+OV.id,{method:"DELETE"});
      if(arr.length){
        const rows=arr.map(function(a){return {usuario_id:OV.id,empresa_id:CTX_EMP,modulo:a.modulo,rol:a.rol,permisos:a.permisos,estado:"activo"};});
        await sbFetch("/rest/v1/accesos",{method:"POST",body:JSON.stringify(rows)});
      }
      logAud("set_accesos","perfil",OV.id,{n:arr.length});
    }
    toast("Accesos guardados"); cerrarAccesos();
    if(TAB==="usuarios") viewUsuarios(); else viewPadron();
  }catch(e){ toast("Error: "+e.message,true); }
  finally{ btn.disabled=false; btn.textContent="Guardar accesos"; }
}

/* ---------- Acciones vía n8n (permisos de admin) ---------- */
async function n8n(accion,payload){
  if(!N8N_HOOK){ toast("Falta configurar el webhook de n8n.",true); return null; }
  try{
    const r=await fetch(N8N_HOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({accion:accion,token:SB_TOKEN,empresa_id:CTX_EMP},payload))});
    let d=null; try{ d=await r.json(); }catch(e){}
    if(!r.ok||(d&&d.ok===false)) throw new Error((d&&d.message)||("HTTP "+r.status));
    return d||{ok:true};
  }catch(e){ toast("Error: "+e.message,true); return null; }
}

}
async function invitarPersona(id,correo){
  if(!confirm("¿Enviar invitación por correo a "+correo+"?\nVa a poder poner su contraseña y entra con sus accesos ya cargados."))return;
  const d=await n8n("invitar_persona",{persona_id:id}); if(d) toast(d.message||("Invitación enviada a "+correo));
}

/* ---------- AUDITORÍA ---------- */
async function viewAuditoria(){
  $("#view").innerHTML='<div class="spin">Cargando…</div>';
  let a=[];
  try{ a=await sbFetch("/rest/v1/auditoria?empresa_id=eq."+CTX_EMP+"&select=actor_nombre,accion,entidad,detalle,creado&order=creado.desc&limit=120"); }
  catch(e){ $("#view").innerHTML='<div class="empty" style="color:var(--no)">'+esc(e.message)+'</div>'; return; }
  let h='<div class="toolbar">'+selectorEmpresa()+'</div><h2 class="sec">Auditoría · últimas acciones</h2>';
  if(!a.length){ h+='<div class="empty">Sin actividad registrada todavía.</div>'; }
  else h+='<div class="card">'+a.map(function(x){ return '<div class="aud"><span class="t">'+esc(fFecha(x.creado))+'</span><span class="grow"><b>'+esc(x.actor_nombre||"—")+'</b> · '+esc(x.accion)+' <span style="color:var(--mut)">('+esc(x.entidad||"")+')</span></span></div>'; }).join("")+'</div>';
  $("#view").innerHTML=h;
}
