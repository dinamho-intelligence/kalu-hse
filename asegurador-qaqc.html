<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALU · Edición de informes</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0b0d0a;--panel:#15181a;--panel2:#1b1f22;--border:#2a2f2c;--text:#f5f5f4;
    --muted:#a8a29e;--orange:#f5a623;--green:#34d399;--red:#f87171;--cyan:#4fc3f7;--violet:#a78bfa;--gray:#8a8f88}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:30px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
  .brand svg{width:28px;height:31px}
  .sub{color:var(--muted);font-size:14px;margin:4px 0 20px}
  label.f{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px;font-weight:600}
  input[type=email],input[type=password],input.obs{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px;font-size:15px}
  .btn{border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;background:var(--orange);color:#141414}
  .btn.full{width:100%;margin-top:18px}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 14px;font-size:13px}
  .err{color:var(--red);font-size:13px;margin-top:12px;min-height:16px}
  #app{display:none}
  header{position:sticky;top:0;z-index:10;background:rgba(11,13,10,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
    padding:11px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .who{color:var(--muted);font-size:13px;border-left:1px solid var(--border);padding-left:10px}
  .wrap{max-width:840px;margin:0 auto;padding:18px}
  h1{font-size:20px;font-weight:800;margin-bottom:14px}
  .back{color:var(--muted);font-size:14px;background:none;border:0;cursor:pointer;margin-bottom:10px;padding:6px 0}
  .otg{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin:16px 0 8px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:14px}
  .card:active{border-color:var(--orange)}
  .card .t{font-weight:700;font-size:16px} .card .m{color:var(--muted);font-size:12.5px;margin-top:2px}
  .prog{margin-left:auto;text-align:right;flex-shrink:0}
  .prog .n{font-weight:800;font-size:15px} .prog .l{color:var(--muted);font-size:11px}
  .bar{height:6px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:10px}
  .bar > i{display:block;height:100%;background:var(--green);transition:width .3s}
  .hhead{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
  .hhead .t{font-weight:800;font-size:18px} .hhead .m{color:var(--muted);font-size:13px;margin-top:2px}
  /* actividad */
  .act{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
  .act.done{border-color:rgba(52,211,153,.35)} .act.dev{border-color:rgba(248,113,113,.45)} .act.apr{box-shadow:inset 3px 0 0 var(--green)}
  .act .top{display:flex;gap:10px}
  .act .num{flex:0 0 auto;width:26px;height:26px;border-radius:7px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
  .act .ti{font-weight:600;font-size:14.5px} .act .norma{color:var(--gray);font-size:11.5px;font-family:ui-monospace,monospace;margin-top:2px}
  .kalu{margin-top:7px;font-size:12.5px;border-radius:8px;padding:7px 10px;background:var(--panel2);border:1px solid var(--border);color:var(--muted)}
  .kalu.cumple{color:var(--green);border-color:rgba(52,211,153,.35)} .kalu.desv{color:var(--red);border-color:rgba(248,113,113,.4)}
  .kalu b{font-weight:700}
  .states{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0 0 36px}
  .st{font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer;user-select:none}
  .st.c.on{background:var(--green);color:#0c1a12;border-color:var(--green)}
  .st.d.on{background:var(--red);color:#1a0c0c;border-color:var(--red)}
  .st.n.on{background:var(--gray);color:#111;border-color:var(--gray)}
  .row2{margin:10px 0 0 36px}
  .evid{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 0 36px}
  .te{width:52px;height:52px;border-radius:8px;overflow:hidden;border:1px solid var(--border);cursor:pointer}
  .te img{width:100%;height:100%;object-fit:cover}
  .foto{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:10px;border:1px dashed var(--border);background:transparent;color:var(--muted);cursor:pointer}
  .foto input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .aprob{display:flex;align-items:center;gap:8px;margin:12px 0 0 36px;font-size:13.5px;font-weight:700;cursor:pointer;user-select:none;color:var(--muted)}
  .aprob input{width:18px;height:18px;accent-color:var(--green);cursor:pointer}
  .aprob.on{color:var(--green)}
  .rb{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:20px;border:1px solid var(--border);margin-left:6px;vertical-align:middle}
  .rb-c{color:var(--green);border-color:rgba(52,211,153,.4)} .rb-d{color:var(--red);border-color:rgba(248,113,113,.4)}
  .rb-n{color:var(--gray)} .rb-p{color:var(--muted)}
  .revobs{margin:10px 0 0 36px;font-size:14px;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
  .nodata{color:var(--muted);font-style:italic;font-size:12.5px}
  .card.desasig{opacity:.45;filter:grayscale(.3)}
  .desbadge{margin-left:auto;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--red);border:1px solid rgba(248,113,113,.4);border-radius:20px;padding:3px 10px;align-self:center}
  .modalk{position:fixed;inset:0;background:rgba(0,0,0,.74);display:none;align-items:center;justify-content:center;z-index:90;padding:22px}
  .modalk.on{display:flex}
  .mkcard{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:24px}
  .mkkalu{font-size:15px;line-height:1.55;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;color:var(--text)}
  .efbadge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:20px;border:1px solid var(--border);margin-left:6px;vertical-align:middle}
  .efbadge.ef-no{color:var(--muted)} .efbadge.ef-cur{color:var(--cyan);border-color:rgba(79,195,247,.4)}
  .efbadge.ef-pau{color:var(--amber);border-color:rgba(245,166,35,.4)} .efbadge.ef-cer{color:var(--green);border-color:rgba(52,211,153,.4)}
  .flow{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0 0 36px}
  .fb{font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer}
  .fb.go{background:var(--green);color:#0c1a12;border-color:var(--green)} .fb.end{background:var(--red);color:#1a0c0c;border-color:var(--red)}
  .obsrow{display:flex;gap:8px;align-items:center}
  .mic{flex:0 0 auto;width:42px;height:42px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);font-size:18px;cursor:pointer}
  .mic.on{background:var(--red);border-color:var(--red);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .empty{color:var(--muted);text-align:center;padding:50px 0}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px 16px;font-size:13px;z-index:60;opacity:0;transition:opacity .3s}
  .toast.on{opacity:1}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:70;padding:20px;cursor:zoom-out}
  .lb.on{display:flex} .lb img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="center">
  <div class="login">
    <div class="brand">
      <svg viewBox="0 0 34 38"><polygon points="17,1.5 32.5,10.25 32.5,27.75 17,36.5 1.5,27.75 1.5,10.25" fill="none" stroke="#f5a623" stroke-width="2"/><text x="17" y="22.5" text-anchor="middle" fill="#f5a623" font-size="11" font-weight="700">DI</text></svg>
      KALU · Edición de informes
    </div>
    <div class="sub">Ingresá para revisar lo capturado y armar informes.</div>
    <label class="f">Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="asegurador@totalqcsas.com">
    <label class="f">Contraseña</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')entrar()">
    <button class="btn full" onclick="entrar()">Ingresar</button>
    <div class="err" id="err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="brand" style="font-size:15px"><svg viewBox="0 0 34 38" style="width:24px;height:26px"><polygon points="17,1.5 32.5,10.25 32.5,27.75 17,36.5 1.5,27.75 1.5,10.25" fill="none" stroke="#f5a623" stroke-width="2"/></svg>Edición de informes <span class="who" id="who"></span></div>
    <button class="btn ghost" onclick="salir()">Salir</button>
  </header>
  <div class="wrap">
    <div id="v-trabajos">
      <h1>Mis trabajos</h1>
      <div id="lista-trabajos"><div class="empty">Cargando…</div></div>
    </div>
    <div id="v-check" style="display:none">
      <button class="back" onclick="volver()">← Mis trabajos</button>
      <div class="hhead">
        <div class="t" id="h-nombre"></div>
        <div class="m" id="h-meta"></div>
        <div class="bar"><i id="h-bar" style="width:0%"></i></div>
        <div class="m" id="h-prog" style="margin-top:8px"></div>
        <button class="btn" id="btn-kalu" style="margin-top:12px;width:100%" onclick="analizarKalu()">🤖 Analizar con KALU</button>
      </div>
      <div id="lista-check"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="lb" id="lb" onclick="this.classList.remove('on')"><img id="lbimg"></div>
<div class="modalk" id="mkmot"><div class="mkcard">
  <div class="mkkalu" id="mkmot-txt"></div>
  <button class="btn" style="width:100%" onclick="$('mkmot').classList.remove('on')">Cerrar</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://tytjurhxdwwytagcjxji.supabase.co';
const SB_KEY='sb_publishable_vMJSHRPHEI-LU7A5GG6EUg_8Q69q5x0';
const sb=supabase.createClient(SB_URL,SB_KEY);
// URL PRODUCTIVA del webhook n8n (workflow ACTIVO). Ojo: /webhook/ no /webhook-test/
const KALU_WEBHOOK='https://dnmintell.app.n8n.cloud/webhook/kalu-qaqc-analizar';
const $=(id)=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);}
function esc(s){return (s==null?'':String(s)).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193);}return (h>>>0).toString(16);}
function uuid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);}

let me={id:null,empresa_id:null,nombre:''};
let catalogo=[], herramientas=[], res={}, evid={}, herrActual=null;
let recog=null, recAct=null;

async function entrar(){
  $('err').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});
  if(error){$('err').textContent='Credenciales inválidas o usuario sin perfil.';return;}
  iniciar();
}
async function salir(){await sb.auth.signOut();location.reload();}

async function iniciar(){
  const {data:{user}}=await sb.auth.getUser();
  const {data:perfil}=await sb.from('perfil').select('nombre, empresa_id').eq('id',user.id).maybeSingle();
  if(!perfil){$('err').textContent='Tu usuario no tiene perfil.';return;}
  me={id:user.id,empresa_id:perfil.empresa_id,nombre:perfil.nombre||'Asegurador'};
  $('who').textContent=me.nombre;
  $('login').style.display='none';$('app').style.display='block';
  await cargarDatos(); mostrarTrabajos();
}

async function cargarDatos(){
  const [cat,herr,resu]=await Promise.all([
    sb.from('catalogo_actividad').select('id, herramienta_tipo, orden, actividad, norma_ref').order('orden'),
    sb.from('herramienta').select('id, nombre, tipo, rol, orden_id, asegurador_id, desasignado_de, desasignado_motivo, orden_de_trabajo(codigo,pozo,cliente)'),
    sb.from('resultado_actividad').select('herramienta_id, actividad_id, resultado, observacion, kalu_veredicto, kalu_detalle, aprobado, estado_flujo')
  ]);
  catalogo=cat.data||[]; herramientas=herr.data||[]; res={};
  (resu.data||[]).forEach(r=>{res[r.herramienta_id+'_'+r.actividad_id]={resultado:r.resultado,observacion:r.observacion,kalu_veredicto:r.kalu_veredicto,kalu_detalle:r.kalu_detalle,aprobado:r.aprobado,estado_flujo:r.estado_flujo||'no_iniciada'};});
}

function actsDe(t){return catalogo.filter(a=>a.herramienta_tipo===t).sort((a,b)=>a.orden-b.orden);}
function progreso(h){
  const acts=actsDe(h.tipo); const total=acts.length||1;
  const aprob=acts.filter(a=>{const r=res[h.id+'_'+a.id];return r&&r.aprobado;}).length;
  return {aprob,total:acts.length,pct:Math.round(aprob/total*100)};
}

function mostrarTrabajos(){
  $('v-check').style.display='none';$('v-trabajos').style.display='block';
  const cont=$('lista-trabajos');
  if(!herramientas.length){cont.innerHTML='<div class="empty">No tenés trabajos asignados todavía.</div>';return;}
  const g={}; herramientas.forEach(h=>{const k=h.orden_id;(g[k]=g[k]||{ot:h.orden_de_trabajo,list:[]}).list.push(h);});
  cont.innerHTML=Object.values(g).map(gr=>`
    <div class="otg">${esc(gr.ot&&gr.ot.codigo)||'OT'} · ${esc(gr.ot&&gr.ot.pozo)} ${gr.ot&&gr.ot.cliente?'· '+esc(gr.ot.cliente):''}</div>
    ${gr.list.map(h=>{
      const des = h.desasignado_de===me.id && h.asegurador_id!==me.id;
      if(des) return `
      <div class="card desasig" onclick="verMotivo(${h.id})">
        <div><div class="t">${esc(h.nombre)}</div><div class="m">${esc(h.tipo)} · ${esc(h.rol)}</div></div>
        <span class="desbadge">desasignada</span>
      </div>`;
      const p=progreso(h);return `
      <div class="card" onclick="abrir(${h.id})">
        <div><div class="t">${esc(h.nombre)}</div><div class="m">${esc(h.tipo)} · ${esc(h.rol)}</div></div>
        <div class="prog"><div class="n">${p.aprob}/${p.total}</div><div class="l">aprobadas</div></div>
      </div>`;}).join('')}`).join('');
}

async function abrir(hid){
  herrActual=hid;
  const h=herramientas.find(x=>x.id===hid);
  $('h-nombre').textContent=h.nombre;
  $('h-meta').textContent=(h.tipo)+' · '+(h.rol)+' · '+((h.orden_de_trabajo&&h.orden_de_trabajo.codigo)||'');
  // evidencia: capturas de esta herramienta, con URL firmada, agrupadas por actividad
  evid={};
  const {data:caps}=await sb.from('captura').select('id, actividad_id, storage_path').eq('herramienta_id',hid).not('actividad_id','is',null);
  const paths=(caps||[]).filter(c=>c.storage_path).map(c=>c.storage_path);
  let map={};
  if(paths.length){const {data:signed}=await sb.storage.from('capturas').createSignedUrls(paths,3600);(signed||[]).forEach(s=>{if(s.path)map[s.path]=s.signedUrl;});}
  (caps||[]).forEach(c=>{(evid[c.actividad_id]=evid[c.actividad_id]||[]).push({id:c.id,url:map[c.storage_path]});});
  $('v-trabajos').style.display='none';$('v-check').style.display='block';window.scrollTo(0,0);
  renderCheck();
}
function volver(){mostrarTrabajos();}

function renderCheck(){
  const h=herramientas.find(x=>x.id===herrActual);
  const acts=actsDe(h.tipo); const p=progreso(h);
  $('h-bar').style.width=p.pct+'%';
  $('h-prog').textContent=`${p.aprob} de ${p.total} aprobadas para informe (${p.pct}%)`;
  $('lista-check').innerHTML=acts.map(a=>{
    const r=res[herrActual+'_'+a.id]||{};
    const val=r.resultado||'pendiente';
    const cls=(r.aprobado?'apr ':'')+(val==='desviacion'?'dev':(val==='conforme'||val==='na'?'done':''));
    const rbMap={conforme:['Conforme','rb-c'],desviacion:['Desviación','rb-d'],na:['N-A','rb-n'],pendiente:['sin capturar','rb-p']};
    const rb=rbMap[val]||rbMap.pendiente;
    let kaluCls='',kaluTxt='<b>🤖 KALU:</b> sin analizar aún';
    if(r.kalu_veredicto==='cumple'){kaluCls='cumple';kaluTxt='<b>🤖 KALU:</b> ✓ Cumple los criterios';}
    else if(r.kalu_veredicto==='desviacion'){kaluCls='desv';kaluTxt='<b>🤖 KALU:</b> ⚠ '+esc(r.kalu_detalle||'Desviación detectada');}
    const thumbs=(evid[a.id]||[]).map(e=>`<div class="te"><img src="${e.url||''}" onclick="verFoto('${e.url||''}')"></div>`).join('')||'<span class="nodata">sin evidencia</span>';
    return `
    <div class="act ${cls}">
      <div class="top">
        <div class="num">${a.orden}</div>
        <div style="flex:1">
          <div class="ti">${esc(a.actividad)} <span class="rb ${rb[1]}">${rb[0]}</span></div>
          ${a.norma_ref?`<div class="norma">${esc(a.norma_ref)}</div>`:''}
          <div class="kalu ${kaluCls}">${kaluTxt}</div>
        </div>
      </div>
      <div class="revobs">${r.observacion?esc(r.observacion):'<span class="nodata">sin comentario</span>'}</div>
      <div class="evid">${thumbs}</div>
      <label class="aprob ${r.aprobado?'on':''}"><input type="checkbox" ${r.aprobado?'checked':''} onchange="toggleAprob(${a.id},this.checked)"> Aprobar para informe</label>
    </div>`;
  }).join('');
}

async function upsertRes(actId){
  const key=herrActual+'_'+actId; const r=res[key]||{};
  const row={empresa_id:me.empresa_id,herramienta_id:herrActual,actividad_id:actId,
    resultado:r.resultado||'pendiente',observacion:r.observacion||null,
    kalu_veredicto:r.kalu_veredicto||null,kalu_detalle:r.kalu_detalle||null,
    aprobado:!!r.aprobado,estado_flujo:r.estado_flujo||'no_iniciada',
    asegurador_id:me.id,updated_at:new Date().toISOString()};
  const {error}=await sb.from('resultado_actividad').upsert(row,{onConflict:'herramienta_id,actividad_id'});
  if(error){toast('No se pudo guardar');console.error(error);}
}
async function setRes(actId,val){const k=herrActual+'_'+actId;res[k]=res[k]||{};res[k].resultado=val;await upsertRes(actId);renderCheck();}
async function setObs(actId,val){const k=herrActual+'_'+actId;res[k]=res[k]||{};res[k].observacion=val;if(!res[k].resultado)res[k].resultado='pendiente';await upsertRes(actId);toast('Comentario guardado');}
async function toggleAprob(actId,val){const k=herrActual+'_'+actId;res[k]=res[k]||{};res[k].aprobado=val;if(!res[k].resultado)res[k].resultado='pendiente';await upsertRes(actId);renderCheck();toast(val?'Aprobada para informe ✓':'Quitada del informe');}
async function attachFoto(actId,files){
  const f=files&&files[0];if(!f)return;
  const h=herramientas.find(x=>x.id===herrActual);
  const path=me.empresa_id+'/'+h.orden_id+'/'+uuid()+'.jpg';
  toast('Subiendo foto…');
  const up=await sb.storage.from('capturas').upload(path,f,{upsert:false});
  if(up.error){toast('Error subiendo foto');console.error(up.error);return;}
  const {data:ins,error}=await sb.from('captura').insert({empresa_id:me.empresa_id,orden_id:h.orden_id,herramienta_id:herrActual,actividad_id:actId,tipo:'foto',storage_path:path,hash:fnv(path),estado:'clasificada',cedula_tecnico:me.nombre}).select('id').single();
  if(error){toast('Foto subida, error al registrar');console.error(error);return;}
  const {data:signed}=await sb.storage.from('capturas').createSignedUrl(path,3600);
  (evid[actId]=evid[actId]||[]).push({id:ins&&ins.id,url:signed&&signed.signedUrl});
  renderCheck();toast('Evidencia adjuntada ✓');
}
function verFoto(u){if(!u)return;$('lbimg').src=u;$('lb').classList.add('on');}
function verMotivo(hid){
  const h=herramientas.find(x=>x.id===hid); if(!h)return;
  $('mkmot-txt').innerHTML='<b>Herramienta desasignada</b><br><br>'+esc(h.desasignado_motivo||'Sin motivo registrado.');
  $('mkmot').classList.add('on');
}

// ---- flujo de la actividad: botones según estado ----
function flowBtns(actId,ef){
  const b=(txt,ev,cls)=>`<button class="fb ${cls||''}" onclick="evento(${actId},'${ev}')">${txt}</button>`;
  if(ef==='no_iniciada') return b('▶ Iniciar','inicio','go');
  if(ef==='en_curso')    return b('⏸ Pausar','pausa')+b('■ Cerrar','cierre','end');
  if(ef==='pausada')     return b('▶ Reanudar','reinicio','go')+b('■ Cerrar','cierre','end');
  return b('↻ Reabrir','reinicio');   // cerrada
}
async function evento(actId,ev){
  const map={inicio:'en_curso',reinicio:'en_curso',pausa:'pausada',cierre:'cerrada'};
  const k=herrActual+'_'+actId; res[k]=res[k]||{}; res[k].estado_flujo=map[ev];
  if(!res[k].resultado) res[k].resultado='pendiente';
  await sb.from('actividad_evento').insert({empresa_id:me.empresa_id,herramienta_id:herrActual,actividad_id:actId,asegurador_id:me.id,evento:ev});
  await upsertRes(actId);
  renderCheck();
  const t={inicio:'Actividad iniciada',reinicio:'Actividad reanudada',pausa:'En pausa',cierre:'Cerrada — analizando con KALU…'};
  toast(t[ev]);
  if(ev==='cierre') analizarKalu();
}

// ---- dictado por voz (es-CO) ----
function dictar(actId){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Tu navegador no soporta dictado');return;}
  if(recog){recog.stop();return;}   // segundo toque = parar
  recog=new SR(); recog.lang='es-CO'; recog.continuous=true; recog.interimResults=false; recAct=actId;
  const k=herrActual+'_'+actId;
  recog.onresult=(e)=>{
    let t='';for(let i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript;}
    res[k]=res[k]||{}; res[k].observacion=((res[k].observacion||'')+' '+t).trim();
    const inp=$('obs-'+actId); if(inp) inp.value=res[k].observacion;
  };
  recog.onend=()=>{const a=recAct;recog=null;recAct=null;if(res[k].observacion){upsertRes(a);}renderCheck();};
  recog.start(); renderCheck(); toast('🎤 Dictando… tocá el micrófono para parar');
}

async function analizarKalu(){
  if(!herrActual)return;
  const btn=$('btn-kalu');
  if(btn){btn.disabled=true;btn.textContent='🤖 Analizando…';}
  try{
    const resp=await fetch(KALU_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({herramienta_id:herrActual})});
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    await cargarDatos();
    renderCheck();
    toast('KALU analizó ✓');
  }catch(e){
    console.error(e);
    toast('No se pudo analizar. ¿Workflow activo? ¿CORS?');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='🤖 Analizar con KALU';}
  }
}

sb.auth.getSession().then(({data})=>{if(data.session)iniciar();});
