<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALU QA/QC · Editor de informes</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0b0e13;--panel:#12161c;--panel2:#1b222c;--border:#242b35;--text:#e8edf2;
    --muted:#8a909c;--orange:#F28C00;--green:#2fa36b;--red:#ff5a4d;--cyan:#00d4ff;--gray:#8a8f88}
  body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:30px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
  .brand svg{width:28px;height:31px}
  .sub{color:var(--muted);font-size:14px;margin:4px 0 20px}
  label.f{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px;font-weight:600}
  input[type=email],input[type=password],input.obs{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px;font-size:15px;font-family:inherit}
  .btn{border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;background:var(--orange);color:#1a1200}
  .btn.full{width:100%;margin-top:18px}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 14px;font-size:13px}
  .err{color:var(--red);font-size:13px;margin-top:12px;min-height:16px}
  #app{display:none}
  header{position:sticky;top:0;z-index:10;background:rgba(11,14,19,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
    padding:11px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .who{color:var(--muted);font-size:13px;border-left:1px solid var(--border);padding-left:10px}
  .wrap{max-width:840px;margin:0 auto;padding:18px}
  h1{font-size:20px;font-weight:800;margin-bottom:6px}
  .lead{color:var(--muted);font-size:13px;margin-bottom:14px}
  .back{color:var(--muted);font-size:14px;background:none;border:0;cursor:pointer;margin-bottom:10px;padding:6px 0}
  .otg{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin:16px 0 8px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:14px}
  .card:active{border-color:var(--orange)}
  .card .t{font-weight:700;font-size:16px} .card .m{color:var(--muted);font-size:12.5px;margin-top:2px}
  .prog{margin-left:auto;text-align:right;flex-shrink:0}
  .prog .n{font-weight:800;font-size:15px} .prog .l{color:var(--muted);font-size:11px}
  .bar{height:6px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:10px}
  .bar > i{display:block;height:100%;background:var(--green);transition:width .3s}
  .hhead{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
  .hhead .t{font-weight:800;font-size:18px} .hhead .m{color:var(--muted);font-size:13px;margin-top:2px}
  .act{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
  .act.inc{box-shadow:inset 3px 0 0 var(--green)}
  .act .top{display:flex;gap:10px}
  .act .num{flex:0 0 auto;width:26px;height:26px;border-radius:7px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
  .act .ti{font-weight:600;font-size:14.5px} .act .norma{color:var(--gray);font-size:11.5px;font-family:ui-monospace,monospace;margin-top:2px}
  .capt{margin:9px 0 0 36px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
  .capt .cl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:5px}
  .capt .pv{font-size:12.5px;color:#cbd3dc;margin:3px 0}.capt .pv b{color:var(--text)}
  .states{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0 0 36px}
  .st{font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer;user-select:none}
  .st.c.on{background:var(--green);color:#04150d;border-color:var(--green)}
  .st.d.on{background:var(--red);color:#1a0505;border-color:var(--red)}
  .st.n.on{background:var(--gray);color:#111;border-color:var(--gray)}
  .row2{margin:10px 0 0 36px}
  .obsrow{display:flex;align-items:center;gap:8px;margin:8px 0 0 36px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
  .obsrow input{width:16px;height:16px;accent-color:var(--cyan)}
  .obsrow.on{color:var(--cyan)}
  .evid{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 0 36px}
  .te{position:relative;width:56px;height:56px;border-radius:8px;overflow:hidden;border:1px solid var(--border);cursor:pointer}
  .te img{width:100%;height:100%;object-fit:cover;opacity:.45;transition:opacity .2s}
  .te.in img{opacity:1}
  .te .pf{position:absolute;top:2px;right:2px;width:19px;height:19px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.55);color:#fff;font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .te.in .pf{background:var(--green);border-color:var(--green);color:#04150d}
  .evhint{font-size:11px;color:var(--muted);margin:6px 0 0 36px}
  .foto{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:10px;border:1px dashed var(--border);background:transparent;color:var(--muted);cursor:pointer}
  .foto input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .inc-l{display:flex;align-items:center;gap:8px;margin:12px 0 0 36px;font-size:13.5px;font-weight:700;cursor:pointer;user-select:none;color:var(--muted)}
  .inc-l input{width:18px;height:18px;accent-color:var(--green);cursor:pointer}
  .inc-l.on{color:var(--green)}
  .empty{color:var(--muted);text-align:center;padding:50px 0}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px 16px;font-size:13px;z-index:60;opacity:0;transition:opacity .3s}
  .toast.on{opacity:1}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:70;padding:20px;cursor:zoom-out}
  .lb.on{display:flex} .lb img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>
<body>
<!-- LOGIN -->
<div id="login" class="center">
  <div class="login">
    <div class="brand">
      <svg viewBox="0 0 34 38"><polygon points="17,1.5 32.5,10.25 32.5,27.75 17,36.5 1.5,27.75 1.5,10.25" fill="none" stroke="#F28C00" stroke-width="2"/><text x="17" y="22.5" text-anchor="middle" fill="#F28C00" font-size="11" font-weight="700">DI</text></svg>
      KALU QA/QC · Editor de informes
    </div>
    <div class="sub">Ingresá para revisar tus trabajos y armar el informe.</div>
    <label class="f">Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="tu correo">
    <label class="f">Contraseña</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')entrar()">
    <button class="btn full" onclick="entrar()">Ingresar</button>
    <div class="err" id="err"></div>
  </div>
</div>
<!-- APP -->
<div id="app">
  <header>
    <div class="brand" style="font-size:15px"><svg viewBox="0 0 34 38" style="width:24px;height:26px"><polygon points="17,1.5 32.5,10.25 32.5,27.75 17,36.5 1.5,27.75 1.5,10.25" fill="none" stroke="#F28C00" stroke-width="2"/></svg>Editor de informes <span class="who" id="who"></span></div>
    <button class="btn ghost" onclick="salir()">Salir</button>
  </header>
  <div class="wrap">
    <div id="v-trabajos">
      <h1>Mis trabajos</h1>
      <div class="lead">Revisá cada inspección tuya, ajustá lo que haga falta y elegí qué entra en el informe.</div>
      <div id="lista-trabajos"><div class="empty">Cargando…</div></div>
    </div>
    <div id="v-check" style="display:none">
      <button class="back" onclick="volver()">← Mis trabajos</button>
      <div class="hhead">
        <div class="t" id="h-nombre"></div>
        <div class="m" id="h-meta"></div>
        <div class="bar"><i id="h-bar" style="width:0%"></i></div>
        <div class="m" id="h-prog" style="margin-top:8px"></div>
      </div>
      <div id="lista-check"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="lb" id="lb" onclick="this.classList.remove('on')"><img id="lbimg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== CONFIG · plataforma unificada · QA/QC (tablas qaqc_*) ======
const SB_URL='https://nignqeipzlemwfrwmpip.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5pZ25xZWlwemxlbXdmcndtcGlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5OTgyNTgsImV4cCI6MjEwMDU3NDI1OH0.bPpfNiOeDfsrYHECSULa9Cwfxa1_QxaWVLKBhTOPwOs';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=(id)=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);}
function esc(s){return (s==null?'':String(s)).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193);}return (h>>>0).toString(16);}
function uuid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);}
let me={id:null,empresa_id:null,nombre:''};
let catalogo=[], pasosCat=[], unidades=[], res={}, evid={}, uniActual=null;
async function entrar(){
  $('err').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});
  if(error){$('err').textContent='Credenciales inválidas o usuario sin perfil.';return;}
  iniciar();
}
async function salir(){await sb.auth.signOut();location.reload();}
async function iniciar(){
  const {data:{user}}=await sb.auth.getUser();
  const {data:perfil}=await sb.from('perfiles').select('nombre, empresa_id').eq('id',user.id).maybeSingle();
  if(!perfil){$('err').textContent='Tu usuario no tiene perfil.';return;}
  me={id:user.id,empresa_id:perfil.empresa_id,nombre:perfil.nombre||'Asegurador'};
  $('who').textContent=me.nombre;
  $('login').style.display='none';$('app').style.display='block';
  await cargarDatos(); mostrarTrabajos();
}
async function cargarDatos(){
  const [cat,pas,uni,resu]=await Promise.all([
    sb.from('qaqc_actividad').select('id, tipo_id, orden, nombre, referencia').order('orden'),
    sb.from('qaqc_paso').select('id, actividad_id, orden, nombre, tipo_dato').order('orden'),
    // SOLO mis asignaciones
    sb.from('qaqc_unidad').select('id, nombre, serial, tipo_id, orden_id, qaqc_tipo(nombre), qaqc_orden(codigo,sitio,cliente)').eq('asignado_a',me.id).not('orden_id','is',null),
    sb.from('qaqc_resultado').select('unidad_id, actividad_id, resultado, observacion, pasos, obs_informe, aprobado')
  ]);
  catalogo=cat.data||[]; pasosCat=pas.data||[]; unidades=uni.data||[]; res={};
  (resu.data||[]).forEach(r=>{res[r.unidad_id+'_'+r.actividad_id]={resultado:r.resultado,observacion:r.observacion,pasos:r.pasos||{},obs_informe:(r.obs_informe!==false),aprobado:r.aprobado};});
}
function actsDe(tipoId){return catalogo.filter(a=>a.tipo_id===tipoId).sort((a,b)=>a.orden-b.orden);}
function pasosDe(actId){return pasosCat.filter(p=>p.actividad_id===actId).sort((a,b)=>a.orden-b.orden);}
function tipoNombre(u){return (u.qaqc_tipo&&u.qaqc_tipo.nombre)||'';}
function progreso(u){
  const acts=actsDe(u.tipo_id); const total=acts.length||1;
  const inc=acts.filter(a=>{const r=res[u.id+'_'+a.id];return r&&r.aprobado;}).length;
  return {inc,total:acts.length,pct:Math.round(inc/total*100)};
}
function mostrarTrabajos(){
  $('v-check').style.display='none';$('v-trabajos').style.display='block';
  const cont=$('lista-trabajos');
  if(!unidades.length){cont.innerHTML='<div class="empty">No tenés inspecciones asignadas todavía.</div>';return;}
  const g={}; unidades.forEach(u=>{const k=u.orden_id;(g[k]=g[k]||{ot:u.qaqc_orden,list:[]}).list.push(u);});
  cont.innerHTML=Object.values(g).map(gr=>`
    <div class="otg">${esc(gr.ot&&gr.ot.codigo)||'OT'} · ${esc(gr.ot&&gr.ot.sitio)} ${gr.ot&&gr.ot.cliente?'· '+esc(gr.ot.cliente):''}</div>
    ${gr.list.map(u=>{const p=progreso(u);return `
      <div class="card" onclick="abrir(${u.id})">
        <div><div class="t">${esc(u.nombre)}</div><div class="m">${esc(tipoNombre(u))}${u.serial?' · '+esc(u.serial):''}</div></div>
        <div class="prog"><div class="n">${p.inc}/${p.total}</div><div class="l">en informe</div></div>
      </div>`;}).join('')}`).join('');
}
async function abrir(uid){
  uniActual=uid;
  const u=unidades.find(x=>x.id===uid);
  $('h-nombre').textContent=u.nombre;
  $('h-meta').textContent=tipoNombre(u)+(u.serial?' · '+u.serial:'')+' · '+((u.qaqc_orden&&u.qaqc_orden.codigo)||'');
  // evidencia: capturas de esta unidad, con URL firmada y el flag en_informe, agrupadas por actividad
  evid={};
  const {data:caps}=await sb.from('qaqc_captura').select('id, actividad_id, storage_path, en_informe').eq('unidad_id',uid).not('actividad_id','is',null);
  const paths=(caps||[]).filter(c=>c.storage_path).map(c=>c.storage_path);
  let map={};
  if(paths.length){const {data:signed}=await sb.storage.from('capturas').createSignedUrls(paths,3600);(signed||[]).forEach(s=>{if(s.path)map[s.path]=s.signedUrl;});}
  (caps||[]).forEach(c=>{(evid[c.actividad_id]=evid[c.actividad_id]||[]).push({id:c.id,url:map[c.storage_path],en_informe:(c.en_informe!==false)});});
  $('v-trabajos').style.display='none';$('v-check').style.display='block';window.scrollTo(0,0);
  renderCheck();
}
function volver(){mostrarTrabajos();}
function renderCheck(){
  const u=unidades.find(x=>x.id===uniActual);
  const acts=actsDe(u.tipo_id); const p=progreso(u);
  $('h-bar').style.width=p.pct+'%';
  $('h-prog').textContent=`${p.inc} de ${p.total} actividades en el informe (${p.pct}%)`;
  $('lista-check').innerHTML=acts.map(a=>{
    const r=res[uniActual+'_'+a.id]||{};
    const val=r.resultado||'pendiente';
    // lo que se capturó (pasos) — solo lectura, para verificar
    const defs=pasosDe(a.id);
    const capt=defs.length?`<div class="capt"><div class="cl">Lo que capturaste</div>${defs.map(d=>{
        const v=(r.pasos&&r.pasos[d.id]&&r.pasos[d.id].valor); return `<div class="pv">${d.orden}. ${esc(d.nombre)}: <b>${v?esc(v):'—'}</b></div>`;
      }).join('')}</div>`:'';
    const thumbs=(evid[a.id]||[]).map(e=>`<div class="te ${e.en_informe?'in':''}"><img src="${e.url||''}" onclick="verFoto('${e.url||''}')"><button class="pf" title="¿Va al informe?" onclick="togglePhoto(${e.id},${a.id})">${e.en_informe?'✓':''}</button></div>`).join('');
    return `
    <div class="act ${r.aprobado?'inc':''}">
      <div class="top">
        <div class="num">${a.orden}</div>
        <div style="flex:1">
          <div class="ti">${esc(a.nombre)}</div>
          ${a.referencia?`<div class="norma">${esc(a.referencia)}</div>`:''}
        </div>
      </div>
      ${capt}
      <div class="states">
        <span class="st c ${val==='conforme'?'on':''}" onclick="setRes(${a.id},'conforme')">Conforme</span>
        <span class="st d ${val==='desviacion'?'on':''}" onclick="setRes(${a.id},'desviacion')">Desviación</span>
        <span class="st n ${val==='na'?'on':''}" onclick="setRes(${a.id},'na')">N-A</span>
      </div>
      <div class="row2"><input class="obs" placeholder="Observación / comentario…" value="${esc(r.observacion)}" onchange="setObs(${a.id},this.value)"></div>
      <label class="obsrow ${r.obs_informe!==false?'on':''}"><input type="checkbox" ${r.obs_informe!==false?'checked':''} onchange="toggleObs(${a.id},this.checked)"> Mostrar esta observación en el informe</label>
      <div class="evid">
        ${thumbs}
        <label class="foto">＋ Foto<input type="file" accept="image/*" capture="environment" onchange="attachFoto(${a.id},this.files)"></label>
      </div>
      ${thumbs?'<div class="evhint">Tocá la foto para verla · tocá el círculo ✓ para incluirla o sacarla del informe.</div>':''}
      <label class="inc-l ${r.aprobado?'on':''}"><input type="checkbox" ${r.aprobado?'checked':''} onchange="toggleInc(${a.id},this.checked)"> Incluir esta actividad en el informe</label>
    </div>`;
  }).join('');
}
async function upsertRes(actId){
  const key=uniActual+'_'+actId; const r=res[key]||{};
  const row={empresa_id:me.empresa_id,unidad_id:uniActual,actividad_id:actId,
    resultado:r.resultado||'pendiente',observacion:r.observacion||null,
    obs_informe:(r.obs_informe!==false),aprobado:!!r.aprobado,updated_at:new Date().toISOString()};
  const {error}=await sb.from('qaqc_resultado').upsert(row,{onConflict:'unidad_id,actividad_id'});
  if(error){toast('No se pudo guardar');console.error(error);}
}
async function setRes(actId,val){const k=uniActual+'_'+actId;res[k]=res[k]||{};res[k].resultado=val;await upsertRes(actId);renderCheck();}
async function setObs(actId,val){const k=uniActual+'_'+actId;res[k]=res[k]||{};res[k].observacion=val;if(!res[k].resultado)res[k].resultado='pendiente';await upsertRes(actId);toast('Observación guardada');}
async function toggleObs(actId,val){const k=uniActual+'_'+actId;res[k]=res[k]||{};res[k].obs_informe=val;if(!res[k].resultado)res[k].resultado='pendiente';await upsertRes(actId);renderCheck();}
async function toggleInc(actId,val){const k=uniActual+'_'+actId;res[k]=res[k]||{};res[k].aprobado=val;if(!res[k].resultado)res[k].resultado='pendiente';await upsertRes(actId);renderCheck();toast(val?'Incluida en el informe ✓':'Quitada del informe');}
async function togglePhoto(capId,actId){
  const list=evid[actId]||[]; const ph=list.find(p=>p.id===capId); if(!ph)return;
  ph.en_informe=!ph.en_informe;
  const {error}=await sb.from('qaqc_captura').update({en_informe:ph.en_informe}).eq('id',capId);
  if(error){toast('No se pudo guardar');ph.en_informe=!ph.en_informe;}
  renderCheck();
}
async function attachFoto(actId,files){
  const f=files&&files[0];if(!f)return;
  const path='qaqc/'+me.empresa_id+'/'+uniActual+'/'+uuid()+'.jpg';
  toast('Subiendo foto…');
  const up=await sb.storage.from('capturas').upload(path,f,{upsert:false,contentType:f.type||'image/jpeg'});
  if(up.error){toast('Error subiendo foto');console.error(up.error);return;}
  const {data:ins,error}=await sb.from('qaqc_captura').insert({empresa_id:me.empresa_id,unidad_id:uniActual,actividad_id:actId,tipo:'foto',storage_path:path,hash:fnv(path),en_informe:true}).select('id').single();
  if(error){toast('Foto subida, error al registrar');console.error(error);return;}
  const {data:signed}=await sb.storage.from('capturas').createSignedUrl(path,3600);
  (evid[actId]=evid[actId]||[]).push({id:ins&&ins.id,url:signed&&signed.signedUrl,en_informe:true});
  renderCheck();toast('Foto agregada ✓');
}
function verFoto(u){if(!u)return;$('lbimg').src=u;$('lb').classList.add('on');}
sb.auth.getSession().then(({data})=>{if(data.session)iniciar();});
</script>
</body>
</html>
