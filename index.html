<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KALU HSE — Dinamho Intelligence</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --negro:      #0A0C0F;
      --negro-2:    #111318;
      --negro-3:    #1A1D24;
      --negro-4:    #22262F;
      --naranja:    #F28C00;
      --naranja-2:  #FF9F1C;
      --naranja-dim: rgba(242,140,0,0.15);
      --naranja-glow: rgba(242,140,0,0.35);
      --azul-ciborg: #00D4FF;
      --azul-dim:   rgba(0,212,255,0.1);
      --blanco:     #FFFFFF;
      --gris-1:     #F0F0F0;
      --gris-2:     #A0A4AD;
      --gris-3:     #4A4E5A;
      --verde-ok:   #00C896;
      --rojo-alerta: #FF3B30;
    }

    html, body {
      height: 100%;
      font-family: 'Space Grotesk', sans-serif;
      background: var(--negro);
      color: var(--blanco);
      overflow: hidden;
    }

    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      height: 60px;
      background: rgba(10,12,15,0.95);
      border-bottom: 1px solid rgba(242,140,0,0.2);
      backdrop-filter: blur(12px);
      display: flex; align-items: center;
      padding: 0 24px; gap: 16px;
    }

    .logo-dnm { display: flex; align-items: center; gap: 10px; }
    .logo-hex { width: 36px; height: 36px; position: relative; display: flex; align-items: center; justify-content: center; }
    .logo-hex svg { width: 36px; height: 36px; }
    .logo-text { display: flex; flex-direction: column; line-height: 1.1; }
    .logo-text .brand { font-size: 13px; font-weight: 700; color: var(--naranja); letter-spacing: 1px; }
    .logo-text .sub   { font-size: 10px; font-weight: 400; color: var(--gris-2); letter-spacing: 0.5px; font-family: 'JetBrains Mono', monospace; }
    .header-divider { width: 1px; height: 24px; background: var(--gris-3); margin: 0 4px; }
    .kalu-label { font-size: 15px; font-weight: 600; color: var(--blanco); }

    .status-pill {
      margin-left: auto;
      display: flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 20px;
      font-size: 11px; font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
      border: 1px solid;
    }
    .status-pill.online  { background: rgba(0,200,150,0.1); border-color: rgba(0,200,150,0.3); color: var(--verde-ok); }
    .status-pill.offline { background: rgba(255,59,48,0.1);  border-color: rgba(255,59,48,0.3);  color: var(--rojo-alerta); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulso 2s infinite; }

    @keyframes pulso { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* PANTALLA INICIO */
    #pantalla-inicio {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 24px 32px;
      background: var(--negro);
      z-index: 10;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #pantalla-inicio.saliendo { opacity: 0; transform: translateY(-20px); pointer-events: none; }

    .kalu-avatar-inicio { width: 280px; height: 280px; margin-bottom: 24px; position: relative; flex-shrink: 0; }
    .kalu-avatar-inicio svg { width: 100%; height: 100%; }
    .kalu-avatar-inicio .ring-1 { animation: girar 8s linear infinite; transform-origin: 140px 140px; }
    .kalu-avatar-inicio .ring-2 { animation: girar 12s linear infinite reverse; transform-origin: 140px 140px; }
    .kalu-avatar-inicio .ring-3 { animation: girar 20s linear infinite; transform-origin: 140px 140px; }
    .kalu-avatar-inicio .core-pulse { animation: corePulse 3s ease-in-out infinite; transform-origin: 140px 140px; }
    .kalu-avatar-inicio .float-wrap { animation: flotar 4s ease-in-out infinite; }

    @keyframes girar { to { transform: rotate(360deg); } }
    @keyframes flotar { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    @keyframes corePulse { 0%,100%{opacity:0.85;transform:scale(1)} 50%{opacity:1;transform:scale(1.04)} }

    .inicio-form {
      width: 100%; max-width: 440px;
      background: var(--negro-2);
      border: 1px solid rgba(242,140,0,0.25);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 0 40px rgba(242,140,0,0.08), 0 20px 60px rgba(0,0,0,0.5);
    }
    .inicio-form h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; color: var(--blanco); }
    .inicio-form p { font-size: 13px; color: var(--gris-2); margin-bottom: 28px; font-family: 'JetBrains Mono', monospace; }

    .campo { margin-bottom: 20px; }
    .campo label {
      display: block; font-size: 11px; font-weight: 600;
      color: var(--naranja); text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 8px;
      font-family: 'JetBrains Mono', monospace;
    }
    .campo input {
      width: 100%; padding: 12px 16px;
      background: var(--negro-3); border: 1px solid var(--gris-3);
      border-radius: 10px; color: var(--blanco);
      font-size: 14px; font-family: 'Space Grotesk', sans-serif;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .campo input:focus { border-color: var(--naranja); box-shadow: 0 0 0 3px var(--naranja-dim); }
    .campo input::placeholder { color: var(--gris-3); }

    .agregar-fila { display: flex; gap: 8px; }
    .agregar-fila input { flex: 1; }
    .btn-agregar {
      padding: 12px 16px;
      background: var(--negro-4); border: 1px solid var(--gris-3);
      border-radius: 10px; color: var(--naranja);
      font-size: 20px; cursor: pointer; transition: all 0.2s;
    }
    .btn-agregar:hover { background: var(--naranja-dim); border-color: var(--naranja); }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 20px;
      background: var(--naranja-dim); border: 1px solid rgba(242,140,0,0.3);
      font-size: 12px; font-weight: 500; color: var(--naranja-2);
    }
    .chip button { background: none; border: none; cursor: pointer; color: var(--naranja); font-size: 14px; line-height: 1; padding: 0; }

    .btn-iniciar {
      width: 100%; padding: 15px;
      background: var(--naranja); border: none; border-radius: 12px;
      color: var(--negro); font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 8px;
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.5px; transition: all 0.2s;
      position: relative; overflow: hidden;
    }
    .btn-iniciar::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent); }
    .btn-iniciar:hover { background: var(--naranja-2); transform: translateY(-1px); box-shadow: 0 8px 24px var(--naranja-glow); }
    .btn-iniciar:disabled { background: var(--gris-3); cursor: not-allowed; transform: none; box-shadow: none; color: var(--gris-2); }

    /* PANTALLA CHAT */
    #pantalla-chat { display: none; position: fixed; inset: 0; flex-direction: column; padding-top: 60px; }
    #pantalla-chat.visible { display: flex; }

    .chat-layout { display: flex; flex: 1; overflow: hidden; }

    .kalu-panel {
      width: 200px; flex-shrink: 0;
      background: var(--negro-2);
      border-right: 1px solid rgba(242,140,0,0.15);
      display: flex; flex-direction: column;
      align-items: center; padding: 24px 16px; gap: 16px;
    }

    .kalu-cara-wrap {
      width: 140px; height: 140px; position: relative;
      border-radius: 50%;
      border: 2px solid rgba(0,212,255,0.4);
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,212,255,0.2), 0 0 40px rgba(0,212,255,0.1);
    }
    .kalu-cara-wrap svg { width: 100%; height: 100%; animation: parpadeo 6s ease-in-out infinite; }

    @keyframes parpadeo {
      0%,90%,100% { transform: scaleY(1); }
      92%,98%     { transform: scaleY(0.05); }
    }

    .kalu-nombre { font-size: 13px; font-weight: 700; color: var(--naranja); text-align: center; letter-spacing: 1px; }
    .kalu-modo { font-size: 10px; color: var(--gris-2); text-align: center; font-family: 'JetBrains Mono', monospace; background: var(--negro-3); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--gris-3); }

    .kalu-stats { width: 100%; margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
    .stat-item { display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-family: 'JetBrains Mono', monospace; }
    .stat-item .label { color: var(--gris-2); }
    .stat-item .value { color: var(--naranja); font-weight: 600; }

    .chat-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .chat-topbar {
      padding: 12px 20px;
      background: var(--negro-2);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .tag-tarea { padding: 4px 12px; border-radius: 6px; background: var(--naranja-dim); border: 1px solid rgba(242,140,0,0.3); color: var(--naranja-2); font-size: 12px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
    .tag-empleado { padding: 4px 10px; border-radius: 6px; background: var(--negro-3); border: 1px solid var(--gris-3); color: var(--gris-2); font-size: 11px; }

    .ats-banner {
      margin: 0; padding: 12px 20px;
      background: rgba(0,200,150,0.1);
      border-bottom: 1px solid rgba(0,200,150,0.3);
      color: var(--verde-ok); font-size: 13px; font-weight: 500;
      display: none; align-items: center; justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
    }
    .ats-banner.visible { display: flex; }
    .btn-nueva-sesion {
      padding: 6px 16px; border-radius: 8px;
      background: var(--verde-ok); border: none;
      color: var(--negro); font-size: 12px; font-weight: 700;
      cursor: pointer; font-family: 'Space Grotesk', sans-serif;
      letter-spacing: 0.5px; white-space: nowrap; transition: all 0.2s;
    }
    .btn-nueva-sesion:hover { opacity: 0.85; transform: translateY(-1px); }

    .mensajes {
      flex: 1; overflow-y: auto;
      padding: 20px; display: flex; flex-direction: column; gap: 14px;
      scroll-behavior: smooth;
    }
    .mensajes::-webkit-scrollbar { width: 4px; }
    .mensajes::-webkit-scrollbar-track { background: transparent; }
    .mensajes::-webkit-scrollbar-thumb { background: var(--gris-3); border-radius: 2px; }

    .burbuja { max-width: 78%; display: flex; flex-direction: column; gap: 4px; }
    .burbuja.kalu { align-self: flex-start; }
    .burbuja.usuario { align-self: flex-end; }

    .burbuja .remitente {
      font-size: 10px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; font-family: 'JetBrains Mono', monospace;
    }
    .burbuja.kalu .remitente    { color: var(--azul-ciborg); }
    .burbuja.usuario .remitente { color: var(--naranja); text-align: right; }

    .burbuja .contenido {
      padding: 12px 16px; border-radius: 16px;
      font-size: 14px; line-height: 1.6;
    }
    .burbuja.kalu .contenido {
      background: var(--negro-3);
      border: 1px solid rgba(0,212,255,0.15);
      border-bottom-left-radius: 4px;
      color: var(--gris-1);
    }
    .burbuja.usuario .contenido {
      background: var(--naranja);
      border-bottom-right-radius: 4px;
      color: var(--negro); font-weight: 500;
    }

    /* BOTÓN ESCUCHAR — fix del autoplay */
    .kalu-audio { margin-top: 6px; }
    .btn-escuchar {
      padding: 4px 14px; border-radius: 20px;
      border: 1px solid rgba(0,212,255,0.4);
      background: rgba(0,212,255,0.08);
      color: var(--azul-ciborg);
      font-size: 11px; font-weight: 600;
      cursor: pointer; font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.5px; transition: all 0.15s;
    }
    .btn-escuchar:hover { background: rgba(0,212,255,0.18); border-color: var(--azul-ciborg); }
    .btn-escuchar:disabled { opacity: 0.5; cursor: not-allowed; }

    .typewriter-cursor::after { content: '▋'; animation: cursor 0.8s infinite; color: var(--azul-ciborg); }
    @keyframes cursor { 0%,100%{opacity:1} 50%{opacity:0} }

    .subtitulos-bar {
      background: rgba(0,0,0,0.85);
      border-top: 1px solid rgba(0,212,255,0.2);
      padding: 10px 20px; min-height: 44px;
      display: flex; align-items: center;
      font-size: 13px; color: var(--azul-ciborg);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.3px; transition: opacity 0.3s;
    }
    .subtitulos-bar.vacia { opacity: 0.3; }

    .typing { display: none; align-self: flex-start; padding: 12px 16px; background: var(--negro-3); border: 1px solid rgba(0,212,255,0.15); border-radius: 16px; border-bottom-left-radius: 4px; }
    .typing.visible { display: block; }
    .typing-dots { display: flex; gap: 5px; align-items: center; }
    .typing-dots span { width: 7px; height: 7px; background: var(--azul-ciborg); border-radius: 50%; animation: bounce 1.2s infinite; opacity: 0.6; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

    .input-area { background: var(--negro-2); border-top: 1px solid rgba(255,255,255,0.06); padding: 12px 20px; }

    .selector-empleado { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 2px; }
    .btn-emp {
      padding: 5px 14px; border-radius: 20px; border: 1px solid var(--gris-3);
      background: var(--negro-3); font-size: 12px; font-weight: 500;
      cursor: pointer; white-space: nowrap; color: var(--gris-2);
      font-family: 'Space Grotesk', sans-serif; transition: all 0.15s;
    }
    .btn-emp.activo { background: var(--naranja-dim); border-color: var(--naranja); color: var(--naranja-2); }

    .input-row { display: flex; gap: 8px; align-items: flex-end; }
    .input-row textarea {
      flex: 1; padding: 12px 16px;
      background: var(--negro-3); border: 1px solid var(--gris-3); border-radius: 12px;
      color: var(--blanco); font-size: 14px; font-family: 'Space Grotesk', sans-serif;
      resize: none; outline: none; max-height: 120px; min-height: 46px; line-height: 1.4;
      transition: border-color 0.2s;
    }
    .input-row textarea:focus { border-color: var(--naranja); }
    .input-row textarea::placeholder { color: var(--gris-3); }

    .btn-accion {
      width: 46px; height: 46px; border-radius: 12px;
      border: 1px solid var(--gris-3); background: var(--negro-3);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
    }
    .btn-accion svg { width: 18px; height: 18px; fill: var(--gris-2); }
    .btn-accion:hover { border-color: var(--naranja); background: var(--naranja-dim); }
    .btn-accion:hover svg { fill: var(--naranja); }
    .btn-accion.grabando { background: var(--rojo-alerta); border-color: var(--rojo-alerta); animation: pulsoRed 1s infinite; }
    .btn-accion.grabando svg { fill: white; }
    @keyframes pulsoRed { 0%,100%{box-shadow:0 0 0 0 rgba(255,59,48,0.4)} 50%{box-shadow:0 0 0 8px rgba(255,59,48,0)} }

    .btn-enviar {
      width: 46px; height: 46px; border-radius: 12px;
      background: var(--naranja); border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; flex-shrink: 0;
    }
    .btn-enviar svg { width: 18px; height: 18px; fill: var(--negro); }
    .btn-enviar:hover { background: var(--naranja-2); box-shadow: 0 4px 16px var(--naranja-glow); }
    .btn-enviar:disabled { background: var(--gris-3); cursor: not-allowed; box-shadow: none; }

    .voz-ind {
      display: none; align-items: center; gap: 8px;
      padding: 5px 12px; margin-bottom: 8px;
      background: rgba(255,59,48,0.1); border-radius: 8px;
      border: 1px solid rgba(255,59,48,0.3);
      font-size: 12px; color: var(--rojo-alerta);
      font-family: 'JetBrains Mono', monospace;
    }
    .voz-ind.visible { display: flex; }
    .voz-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rojo-alerta); animation: pulso 1s infinite; }

    .error-msg {
      padding: 8px 16px; margin: 4px 0;
      background: rgba(255,59,48,0.1); border: 1px solid rgba(255,59,48,0.3);
      color: var(--rojo-alerta); border-radius: 8px; font-size: 12px;
      display: none; font-family: 'JetBrains Mono', monospace;
    }

    /* COUNTDOWN OVERLAY */
    #countdown-overlay {
      display: none; position: fixed; inset: 0; z-index: 500;
      background: rgba(10,12,15,0.92); backdrop-filter: blur(8px);
      flex-direction: column; align-items: center; justify-content: center; gap: 24px;
    }
    #countdown-overlay.visible { display: flex; }
    .countdown-check { font-size: 48px; color: var(--verde-ok); animation: checkPop 0.4s ease-out; }
    @keyframes checkPop { 0%{transform:scale(0);opacity:0} 70%{transform:scale(1.2)} 100%{transform:scale(1);opacity:1} }
    .countdown-msg { font-size: 16px; color: var(--gris-2); font-family: 'JetBrains Mono', monospace; letter-spacing: 1px; text-align: center; }
    .countdown-num { font-size: 120px; font-weight: 700; color: var(--naranja); font-family: 'Space Grotesk', sans-serif; line-height: 1; animation: numPulse 1s ease-in-out infinite; text-shadow: 0 0 60px rgba(242,140,0,0.4); }
    @keyframes numPulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.08);opacity:0.85} }
    .countdown-bar { width: 200px; height: 3px; background: var(--negro-4); border-radius: 2px; overflow: hidden; }
    .countdown-bar-fill { height: 100%; background: var(--naranja); border-radius: 2px; transition: width 1s linear; }


    /* ── BOTÓN ESCUCHAR — fix autoplay Chrome ── */
    .kalu-audio { margin-top: 6px; }
    .btn-escuchar {
      padding: 3px 12px; border-radius: 20px;
      border: 1px solid rgba(0,212,255,0.35);
      background: rgba(0,212,255,0.07);
      color: var(--azul-ciborg);
      font-size: 11px; font-weight: 600;
      cursor: pointer; font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.5px; transition: all 0.15s;
    }
    .btn-escuchar:hover { background: rgba(0,212,255,0.18); }
    .btn-escuchar:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 600px) { .kalu-panel { display: none; } .burbuja { max-width: 90%; } }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo-dnm">
    <div class="logo-hex">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="none" stroke="#F28C00" stroke-width="1.5"/>
        <polygon points="20,8 30,14 30,26 20,32 10,26 10,14" fill="rgba(242,140,0,0.1)" stroke="#F28C00" stroke-width="0.5"/>
        <text x="20" y="25" text-anchor="middle" fill="#F28C00" font-size="13" font-weight="700" font-family="Space Grotesk, sans-serif">DI</text>
      </svg>
    </div>
    <div class="logo-text">
      <span class="brand">DINAMHO</span>
      <span class="sub">INTELLIGENCE</span>
    </div>
  </div>
  <div class="header-divider"></div>
  <span class="kalu-label">KALU HSE</span>
  <div class="status-pill online" id="status-pill">
    <div class="status-dot"></div>
    EN LÍNEA
  </div>
</header>

<!-- COUNTDOWN OVERLAY -->
<div id="countdown-overlay">
  <div class="countdown-check">✓</div>
  <div class="countdown-msg">ATS generado — pendiente aprobación HSE<br>Nueva sesión en</div>
  <div class="countdown-num" id="countdown-num">5</div>
  <div class="countdown-bar"><div class="countdown-bar-fill" id="countdown-bar-fill" style="width:100%"></div></div>
</div>

<!-- PANTALLA INICIO -->

  <div class="kalu-avatar-inicio">

<script>
  // ── CONFIG ──
  const N8N_BASE = 'https://dnmintell.app.n8n.cloud/webhook';
  const WEBHOOK_INICIAR = `${N8N_BASE}/kalu-v3-iniciar`;
  const WEBHOOK_MENSAJE = `${N8N_BASE}/kalu-v3-mensaje`;
  const WEBHOOK_STT     = `${N8N_BASE}/kalu-hse-stt`;
  const WEBHOOK_TTS     = `${N8N_BASE}/kalu-hse-tts`;

  // ── ESTADO ──
  let empleados = [];
  let empleadoActivo = '';
  let sessionId = '';
  let atsItemId = '';
  let mensajesCount = 0;
  let mediaRecorder = null;
  let audioChunks = [];
  let grabando = false;
  let subtitulosTimeout = null;
  let pendingCountdown = false;
  let autoCountdownTimer = null;

  // ── INICIO ──
  function agregarEmpleado() {
    const inp = document.getElementById('input-nombre');
    const nombre = inp.value.trim();
    if (!nombre || empleados.includes(nombre)) { inp.value = ''; return; }
    empleados.push(nombre);
    renderChips();
    inp.value = ''; inp.focus();
  }

  document.getElementById('input-nombre').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); agregarEmpleado(); }
  });

  function renderChips() {
    document.getElementById('chips').innerHTML = empleados.map((e,i) => `
      <div class="chip">${e}<button onclick="quitarEmp(${i})">×</button></div>
    `).join('');
  }

  function quitarEmp(i) { empleados.splice(i,1); renderChips(); }

  async function iniciarSesion() {
    const tarea = document.getElementById('input-tarea').value.trim();
    if (!tarea) { alert('Ingresá la tarea del día'); return; }
    if (empleados.length === 0) { alert('Agregá al menos un empleado'); return; }

    const btn = document.getElementById('btn-iniciar');
    btn.disabled = true;
    btn.textContent = 'CONECTANDO CON KALU...';

    try {
      const res = await fetch(WEBHOOK_INICIAR, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ empleados, tarea })
      });
      const data = await res.json();

  if (data.bloqueado) {
      btn.disabled = false;
      btn.textContent = 'INICIAR SESIÓN CON KALU';
      alert(data.mensaje);
      return;
  }
      sessionId      = data.sessionId || '';
      atsItemId      = data.atsItemId || '';
      empleadoActivo = empleados[0];

      document.getElementById('kalu-modo-label').textContent = (data.descripcionModo || `Modo ${data.modo}`).toUpperCase();
      document.getElementById('kalu-stats').innerHTML = `
        <div class="stat-item"><span class="label">PELIGROS</span><span class="value">${data.totalPeligros || '—'}</span></div>
        <div class="stat-item"><span class="label">MODO</span><span class="value">${data.modo || '—'}</span></div>
        <div class="stat-item"><span class="label">APROB.</span><span class="value">${data.tipoAprobacion || '—'}</span></div>
      `;

      document.getElementById('chat-topbar').innerHTML = `
        <span class="tag-tarea">${tarea}</span>
        ${empleados.map(e => `<span class="tag-empleado">${e}</span>`).join('')}
      `;

      const inicio = document.getElementById('pantalla-inicio');
      inicio.classList.add('saliendo');
      setTimeout(() => {
        inicio.style.display = 'none';
        const chat = document.getElementById('pantalla-chat');
        chat.classList.add('visible');
        renderSelectorEmp();
        agregarMensajeKALU(data.mensaje, true);
      }, 500);

    } catch(e) {
      alert('Error al conectar con KALU. Verificá tu conexión.');
      btn.disabled = false;
      btn.textContent = 'INICIAR SESIÓN CON KALU';
    }
  }

  function renderSelectorEmp() {
    document.getElementById('selector-emp').innerHTML = empleados.map(e => `
      <button class="btn-emp ${e===empleadoActivo?'activo':''}" onclick="selecEmp('${e}')">${e}</button>
    `).join('');
  }

  function selecEmp(nombre) { empleadoActivo = nombre; renderSelectorEmp(); }

  // ── CHAT ──
  function agregarMensajeKALU(texto, reproducir = false) {
    const cont = document.getElementById('mensajes');
    const typing = document.getElementById('typing');
    mensajesCount++;

    const div = document.createElement('div');
    div.className = 'burbuja kalu';

    const contenido = document.createElement('div');
    contenido.className = 'contenido typewriter-cursor';

    // Botón ▶ Escuchar — solución al bloqueo de autoplay de Chrome
    // El autoplay falla cuando no hay interacción previa; el botón manual
    // siempre funciona porque es un evento de click directo del usuario.
    const audioWrap = document.createElement('div');
    audioWrap.className = 'kalu-audio';
    const btnEscuchar = document.createElement('button');
    btnEscuchar.className = 'btn-escuchar';
    btnEscuchar.textContent = '▶ Escuchar';
    btnEscuchar.onclick = () => reproducirVoz(btnEscuchar, texto);
    audioWrap.appendChild(btnEscuchar);

    div.innerHTML = '<div class="remitente">KALU IA</div>';
    div.appendChild(contenido);
    div.appendChild(audioWrap);
    cont.insertBefore(div, typing);
    cont.scrollTop = cont.scrollHeight;

    typewriterEffect(contenido, texto, () => {
      contenido.classList.remove('typewriter-cursor');
    });

    mostrarSubtitulos(texto);

    // Intentar autoplay; si Chrome lo bloquea, el botón queda como fallback
    if (reproducir) reproducirVozAuto(texto);
  }

  function typewriterEffect(el, texto, onDone) {
    let charIdx = 0;
    el.innerHTML = '';

    const interval = setInterval(() => {
      charIdx++;
      el.innerHTML = texto.substring(0, charIdx).replace(/\n/g, '<br>');
      document.getElementById('mensajes').scrollTop = 99999;

      if (charIdx >= texto.length) {
        clearInterval(interval);
        if (onDone) onDone();
        if (pendingCountdown) {
          pendingCountdown = false;
          setTimeout(() => iniciarCountdown(), 1200);
        }
      }
    }, 18);
  }

  function mostrarSubtitulos(texto) {
    const bar = document.getElementById('subtitulos');
    bar.classList.remove('vacia');
    const palabras = texto.split(' ');
    let idx = 0;

    if (subtitulosTimeout) clearInterval(subtitulosTimeout);

    subtitulosTimeout = setInterval(() => {
      const fin = Math.min(idx + 6, palabras.length);
      bar.textContent = palabras.slice(idx, fin).join(' ');
      idx = fin;
      if (idx >= palabras.length) {
        clearInterval(subtitulosTimeout);
        setTimeout(() => {
          bar.classList.add('vacia');
          bar.textContent = '// esperando respuesta...';
        }, 2000);
      }
    }, 400);
  }

  function agregarMensajeUsuario(texto, remitente) {
    const cont = document.getElementById('mensajes');
    const typing = document.getElementById('typing');
    const div = document.createElement('div');
    div.className = 'burbuja usuario';
    div.innerHTML = `
      <div class="remitente">${esc(remitente)}</div>
      <div class="contenido">${esc(texto)}</div>
    `;
    cont.insertBefore(div, typing);
    cont.scrollTop = cont.scrollHeight;
  }

  function esc(t) {
    return String(t)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\n/g,'<br>');
  }

  function mostrarTyping(show) {
    const t = document.getElementById('typing');
    t.classList.toggle('visible', show);
    if (show) document.getElementById('mensajes').scrollTop = 99999;
  }

  async function enviarMensaje() {
    const ta = document.getElementById('input-msg');
    const texto = ta.value.trim();
    if (!texto || !sessionId) return;

    const btnEnv = document.getElementById('btn-enviar');
    const btnMic = document.getElementById('btn-mic');
    btnEnv.disabled = true; btnMic.disabled = true; ta.disabled = true;

    agregarMensajeUsuario(texto, empleadoActivo);
    ta.value = ''; ta.style.height = 'auto';
    mostrarTyping(true);
    document.getElementById('error-msg').style.display = 'none';

    try {
      const res = await fetch(WEBHOOK_MENSAJE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, atsItemId, mensaje: texto, empleado: empleadoActivo })
      });
      const data = await res.json();
      mostrarTyping(false);
      agregarMensajeKALU(data.mensaje || 'Sin respuesta', true);

      if (data.atsDetectado) {
        document.getElementById('ats-banner').classList.add('visible');
        autoCountdownTimer = setTimeout(() => iniciarCountdown(), 90000);
      }
    } catch(e) {
      mostrarTyping(false);
      const err = document.getElementById('error-msg');
      err.textContent = 'Error de conexión. Intentá de nuevo.';
      err.style.display = 'block';
    } finally {
      btnEnv.disabled = false; btnMic.disabled = false;
      ta.disabled = false; ta.focus();
    }
  }

  // ── COUNTDOWN ──
  function iniciarCountdown() {
    if (autoCountdownTimer) { clearTimeout(autoCountdownTimer); autoCountdownTimer = null; }
    const overlay = document.getElementById('countdown-overlay');
    const numEl   = document.getElementById('countdown-num');
    const barEl   = document.getElementById('countdown-bar-fill');
    const total   = 5;
    let seg       = total;

    overlay.classList.add('visible');
    numEl.textContent = seg;
    barEl.style.width = '100%';

    const tick = setInterval(() => {
      seg--;
      numEl.textContent = seg;
      barEl.style.width = ((seg / total) * 100) + '%';
      if (seg <= 0) { clearInterval(tick); resetSesion(); }
    }, 1000);
  }

  function resetSesion() {
    sessionId = ''; atsItemId = ''; empleados = []; empleadoActivo = '';
    mensajesCount = 0; pendingCountdown = false;
    if (autoCountdownTimer) { clearTimeout(autoCountdownTimer); autoCountdownTimer = null; }

    document.getElementById('mensajes').innerHTML = `
      <div class="typing" id="typing">
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>`;
    document.getElementById('ats-banner').classList.remove('visible');
    document.getElementById('kalu-stats').innerHTML = '';
    document.getElementById('kalu-modo-label').textContent = 'MODO —';
    document.getElementById('chips').innerHTML = '';
    document.getElementById('input-tarea').value = '';
    document.getElementById('input-nombre').value = '';
    document.getElementById('subtitulos').textContent = '// esperando respuesta de KALU...';
    document.getElementById('subtitulos').classList.add('vacia');

    document.getElementById('countdown-overlay').classList.remove('visible');
    document.getElementById('pantalla-chat').classList.remove('visible');
    const inicio = document.getElementById('pantalla-inicio');
    inicio.style.display = 'flex';
    inicio.style.opacity = '0';
    inicio.style.transform = 'translateY(20px)';
    inicio.classList.remove('saliendo');
    setTimeout(() => {
      inicio.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
      inicio.style.opacity = '1';
      inicio.style.transform = 'translateY(0)';
    }, 50);

    const btn = document.getElementById('btn-iniciar');
    btn.disabled = false;
    btn.textContent = 'INICIAR SESIÓN CON KALU';
  }

  // ── GRABACIÓN DE VOZ ──
  async function toggleGrabacion() {
    if (grabando) detenerGrabacion();
    else await iniciarGrabacion();
  }

  async function iniciarGrabacion() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];
      const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';

      mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        await transcribirAudio(new Blob(audioChunks, { type: mime }), mime);
      };
      mediaRecorder.start(250);
      grabando = true;

      document.getElementById('btn-mic').classList.add('grabando');
      document.getElementById('voz-estado').textContent = 'Grabando... (tocá para detener)';
      document.getElementById('voz-ind').classList.add('visible');
    } catch(e) {
      alert('No se pudo acceder al micrófono.');
    }
  }

  function detenerGrabacion() {
    if (mediaRecorder && grabando) {
      mediaRecorder.stop(); grabando = false;
      document.getElementById('btn-mic').classList.remove('grabando');
      document.getElementById('voz-estado').textContent = 'Procesando...';
    }
  }

  async function transcribirAudio(blob, mime) {
    const ind = document.getElementById('voz-ind');
    try {
      const ext = mime.includes('mp4') ? 'mp4' : 'webm';
      const fd = new FormData();
      fd.append('audio', blob, `audio.${ext}`);
      fd.append('empleado', empleadoActivo);

      const res = await fetch(WEBHOOK_STT, { method: 'POST', body: fd });
      const data = await res.json();
      ind.classList.remove('visible');

      if (data.texto?.trim()) {
        const ta = document.getElementById('input-msg');
        ta.value = data.texto.trim();
        autoResize(ta);
        await enviarMensaje();
      } else {
        mostrarError('No se entendió el audio. Intentá de nuevo.');
      }
    } catch(e) {
      ind.classList.remove('visible');
      mostrarError('Error al procesar el audio.');
    }
  }

  // ── VOZ TTS ──

  // Autoplay silencioso — funciona si el usuario ya interactuó con la página.
  // Si Chrome lo bloquea, no pasa nada: el botón ▶ Escuchar queda visible.
  async function reproducirVozAuto(texto) {
    try {
      const res = await fetch(WEBHOOK_TTS, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texto })
      });
      if (!res.ok) return;
      const blob = await res.blob();
      const audio = new Audio(URL.createObjectURL(blob));
      audio.play().catch(() => {}); // silencioso si bloquea
    } catch(e) {}
  }

  // Reproducción manual desde el botón ▶ Escuchar — siempre funciona
  // porque es un evento directo de click del usuario (desbloquea autoplay).
  async function reproducirVoz(btn, texto) {
    btn.textContent = '⏳ Cargando...';
    btn.disabled = true;
    try {
      const res = await fetch(WEBHOOK_TTS, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texto })
      });
      if (!res.ok) throw new Error('TTS error');
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      audio.onended = () => {
        btn.textContent = '▶ Escuchar';
        btn.disabled = false;
        URL.revokeObjectURL(url);
      };
      audio.play();
      btn.textContent = '🔊 Reproduciendo...';
    } catch(e) {
      btn.textContent = '▶ Escuchar';
      btn.disabled = false;
    }
  }

  // ── VOZ TTS MANUAL — siempre funciona porque es click directo del usuario ──
  async function reproducirVoz(btn, texto) {
    btn.textContent = '⏳ Cargando...';
    btn.disabled = true;
    try {
      const res = await fetch(WEBHOOK_TTS, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texto })
      });
      if (!res.ok) throw new Error('TTS error');
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      audio.onended = () => {
        btn.textContent = '▶ Escuchar';
        btn.disabled = false;
        URL.revokeObjectURL(url);
      };
      audio.play();
      btn.textContent = '🔊 Reproduciendo...';
    } catch(e) {
      btn.textContent = '▶ Escuchar';
      btn.disabled = false;
    }
  }

  // ── UTILS ──
  function mostrarError(msg) {
    const err = document.getElementById('error-msg');
    err.textContent = msg; err.style.display = 'block';
    setTimeout(() => { err.style.display = 'none'; }, 4000);
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }
</script>
