<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KALU HSE — Dinamho T&T</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rojo: #C0392B;
      --rojo-oscuro: #922B21;
      --rojo-claro: #FADBD8;
      --gris-oscuro: #1C1C1E;
      --gris-medio: #3A3A3C;
      --gris-claro: #F2F2F7;
      --gris-borde: #E5E5EA;
      --blanco: #FFFFFF;
      --texto-principal: #1C1C1E;
      --texto-secundario: #6C6C70;
      --kalu-bg: #F2F2F7;
      --user-bg: #C0392B;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--gris-claro);
      color: var(--texto-principal);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: var(--gris-oscuro);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      width: 36px;
      height: 36px;
      background: var(--rojo);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: white;
      letter-spacing: 0.5px;
    }

    .header-info h1 {
      font-size: 15px;
      font-weight: 600;
      color: white;
    }

    .header-info p {
      font-size: 12px;
      color: #8E8E93;
    }

    .status-badge {
      margin-left: auto;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
    }

    .status-badge.activo { background: #1C3A2B; color: #30D158; }
    .status-badge.pendiente { background: #3A2C1C; color: #FF9F0A; }
    .status-badge.inactivo { background: #2C1C1C; color: #FF453A; }

    /* ── PANTALLA INICIO ── */
    #pantalla-inicio {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .inicio-card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .inicio-card h2 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .inicio-card .subtitulo {
      font-size: 14px;
      color: var(--texto-secundario);
      margin-bottom: 32px;
    }

    .campo-grupo {
      margin-bottom: 20px;
    }

    .campo-grupo label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--texto-secundario);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .campo-grupo input, .campo-grupo select {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--gris-borde);
      border-radius: 12px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: var(--texto-principal);
      background: var(--gris-claro);
      outline: none;
      transition: border-color 0.2s;
    }

    .campo-grupo input:focus, .campo-grupo select:focus {
      border-color: var(--rojo);
      background: white;
    }

    .empleados-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--rojo-claro);
      color: var(--rojo-oscuro);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }

    .chip button {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--rojo);
      font-size: 16px;
      line-height: 1;
      padding: 0;
    }

    .agregar-empleado {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .agregar-empleado input {
      flex: 1;
    }

    .btn-agregar {
      padding: 12px 16px;
      background: var(--gris-claro);
      border: 1.5px solid var(--gris-borde);
      border-radius: 12px;
      cursor: pointer;
      font-size: 20px;
      color: var(--rojo);
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-agregar:hover { background: var(--rojo-claro); border-color: var(--rojo); }

    .btn-iniciar {
      width: 100%;
      padding: 16px;
      background: var(--rojo);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .btn-iniciar:hover { background: var(--rojo-oscuro); }
    .btn-iniciar:disabled { background: #ccc; cursor: not-allowed; }

    /* ── PANTALLA CHAT ── */
    #pantalla-chat {
      display: none;
      flex-direction: column;
      flex: 1;
      height: calc(100vh - 68px);
    }

    .chat-info-bar {
      background: white;
      border-bottom: 1px solid var(--gris-borde);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .chat-info-bar .tag {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      background: var(--gris-claro);
      color: var(--texto-secundario);
    }

    .chat-info-bar .tag.tarea {
      background: var(--rojo-claro);
      color: var(--rojo-oscuro);
    }

    .mensajes {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .burbuja {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
    }

    .burbuja.kalu {
      background: white;
      color: var(--texto-principal);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .burbuja.kalu .remitente {
      font-size: 11px;
      font-weight: 600;
      color: var(--rojo);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .burbuja.usuario {
      background: var(--rojo);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .burbuja.usuario .remitente {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .typing-indicator {
      display: none;
      align-self: flex-start;
      padding: 12px 16px;
      background: white;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .typing-dots {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      background: var(--rojo);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── INPUT ── */
    .input-area {
      background: white;
      border-top: 1px solid var(--gris-borde);
      padding: 12px 16px;
    }

    .selector-empleado {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .btn-empleado {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--gris-borde);
      background: var(--gris-claro);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      color: var(--texto-secundario);
      font-family: 'Inter', sans-serif;
    }

    .btn-empleado.activo {
      background: var(--rojo);
      border-color: var(--rojo);
      color: white;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-row textarea {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid var(--gris-borde);
      border-radius: 14px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      resize: none;
      outline: none;
      max-height: 120px;
      min-height: 48px;
      line-height: 1.4;
      transition: border-color 0.2s;
    }

    .input-row textarea:focus { border-color: var(--rojo); }

    .btn-enviar {
      width: 48px;
      height: 48px;
      background: var(--rojo);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .btn-enviar:hover { background: var(--rojo-oscuro); }
    .btn-enviar:disabled { background: #ccc; cursor: not-allowed; }

    .btn-enviar svg { width: 20px; height: 20px; fill: white; }

    /* ── ATS GENERADO ── */
    .ats-banner {
      margin: 12px 16px;
      padding: 16px;
      background: #1C3A2B;
      border-radius: 14px;
      color: #30D158;
      font-size: 14px;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .ats-banner.visible { display: flex; }

    /* ── ERROR ── */
    .error-msg {
      padding: 10px 16px;
      background: var(--rojo-claro);
      color: var(--rojo-oscuro);
      border-radius: 10px;
      font-size: 13px;
      margin: 8px 16px;
      display: none;
    }

    @media (max-width: 480px) {
      .inicio-card { padding: 28px 20px; }
      .burbuja { max-width: 92%; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">K</div>
  <div class="header-info">
    <h1>KALU HSE</h1>
    <p>Dinamho T&T SAS — Sistema de Validación HSE</p>
  </div>
  <span class="status-badge activo" id="status-badge">En línea</span>
</header>

<!-- PANTALLA INICIO -->
<div id="pantalla-inicio">
  <div class="inicio-card">
    <h2>Nueva sesión HSE</h2>
    <p class="subtitulo">Completá los datos para iniciar la validación con KALU</p>

    <div class="campo-grupo">
      <label>Tarea del día</label>
      <input type="text" id="input-tarea" placeholder="Ej: Dimensionamiento DS, Mantenimiento mecánico..." />
    </div>

    <div class="campo-grupo">
      <label>Cuadrilla</label>
      <div class="agregar-empleado">
        <input type="text" id="input-nombre" placeholder="Nombre del empleado" />
        <button class="btn-agregar" onclick="agregarEmpleado()">+</button>
      </div>
      <div class="empleados-chips" id="chips-empleados"></div>
    </div>

    <button class="btn-iniciar" id="btn-iniciar" onclick="iniciarSesion()">
      Iniciar sesión con KALU
    </button>
  </div>
</div>

<!-- PANTALLA CHAT -->
<div id="pantalla-chat">
  <div class="chat-info-bar" id="chat-info-bar"></div>
  <div class="ats-banner" id="ats-banner">
    ✓ ATS generado — pendiente de aprobación del HSE
  </div>
  <div class="error-msg" id="error-msg"></div>
  <div class="mensajes" id="mensajes">
    <div class="typing-indicator" id="typing">
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>
  </div>
  <div class="input-area">
    <div class="selector-empleado" id="selector-empleado"></div>
    <div class="input-row">
      <textarea id="input-mensaje" placeholder="Escribí tu respuesta..." rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviarMensaje()}"
        oninput="autoResize(this)"></textarea>
      <button class="btn-enviar" id="btn-enviar" onclick="enviarMensaje()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
  const N8N_BASE = 'https://dnmintell.app.n8n.cloud/webhook';
  let empleados = [];
  let empleadoActivo = '';
  let sessionId = '';
  let atsItemId = '';

  // ── INICIO ──
  function agregarEmpleado() {
    const input = document.getElementById('input-nombre');
    const nombre = input.value.trim();
    if (!nombre || empleados.includes(nombre)) { input.value = ''; return; }
    empleados.push(nombre);
    renderChips();
    input.value = '';
    input.focus();
  }

  document.getElementById('input-nombre').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); agregarEmpleado(); }
  });

  function renderChips() {
    const cont = document.getElementById('chips-empleados');
    cont.innerHTML = empleados.map((e, i) => `
      <div class="chip">
        ${e}
        <button onclick="quitarEmpleado(${i})">×</button>
      </div>
    `).join('');
  }

  function quitarEmpleado(i) {
    empleados.splice(i, 1);
    renderChips();
  }

  async function iniciarSesion() {
    const tarea = document.getElementById('input-tarea').value.trim();
    if (!tarea) { alert('Ingresá la tarea del día'); return; }
    if (empleados.length === 0) { alert('Agregá al menos un empleado'); return; }

    const btn = document.getElementById('btn-iniciar');
    btn.disabled = true;
    btn.textContent = 'Iniciando...';

    try {
      const res = await fetch(`${N8N_BASE}/kalu-hse-iniciar`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ empleados, tarea })
      });
      const data = await res.json();

      sessionId = data.sessionId;
      atsItemId = data.atsItemId;
      empleadoActivo = empleados[0];

      mostrarChat(tarea, data.mensaje);
    } catch(e) {
      alert('Error al conectar con KALU. Verificá tu conexión.');
      btn.disabled = false;
      btn.textContent = 'Iniciar sesión con KALU';
    }
  }

  function mostrarChat(tarea, mensajeInicial) {
    document.getElementById('pantalla-inicio').style.display = 'none';
    const chat = document.getElementById('pantalla-chat');
    chat.style.display = 'flex';

    // Info bar
    const infoBar = document.getElementById('chat-info-bar');
    infoBar.innerHTML = `
      <span class="tag tarea">${tarea}</span>
      ${empleados.map(e => `<span class="tag">${e}</span>`).join('')}
    `;

    // Selector de empleado
    renderSelectorEmpleado();

    // Mensaje inicial de KALU
    agregarMensaje('kalu', mensajeInicial, 'KALU');
  }

  function renderSelectorEmpleado() {
    const cont = document.getElementById('selector-empleado');
    cont.innerHTML = empleados.map(e => `
      <button class="btn-empleado ${e === empleadoActivo ? 'activo' : ''}"
        onclick="seleccionarEmpleado('${e}')">${e}</button>
    `).join('');
  }

  function seleccionarEmpleado(nombre) {
    empleadoActivo = nombre;
    renderSelectorEmpleado();
  }

  // ── CHAT ──
  function agregarMensaje(tipo, texto, remitente) {
    const cont = document.getElementById('mensajes');
    const typing = document.getElementById('typing');

    const div = document.createElement('div');
    div.className = `burbuja ${tipo}`;
    div.innerHTML = `<div class="remitente">${remitente}</div>${escapeHtml(texto)}`;

    cont.insertBefore(div, typing);
    cont.scrollTop = cont.scrollHeight;
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\n/g, '<br>');
  }

  function mostrarTyping(show) {
    const t = document.getElementById('typing');
    t.style.display = show ? 'block' : 'none';
    if (show) document.getElementById('mensajes').scrollTop = 999999;
  }

  async function enviarMensaje() {
    const textarea = document.getElementById('input-mensaje');
    const texto = textarea.value.trim();
    if (!texto || !sessionId) return;

    const btn = document.getElementById('btn-enviar');
    btn.disabled = true;
    textarea.disabled = true;

    agregarMensaje('usuario', texto, empleadoActivo);
    textarea.value = '';
    textarea.style.height = 'auto';
    mostrarTyping(true);

    document.getElementById('error-msg').style.display = 'none';

    try {
      const res = await fetch(`${N8N_BASE}/kalu-hse-mensaje`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sessionId,
          atsItemId,
          mensaje: texto,
          empleado: empleadoActivo
        })
      });
      const data = await res.json();

      mostrarTyping(false);
      agregarMensaje('kalu', data.mensaje || 'Sin respuesta', 'KALU');

      if (data.atsGenerado) {
        document.getElementById('ats-banner').classList.add('visible');
      }
    } catch(e) {
      mostrarTyping(false);
      const err = document.getElementById('error-msg');
      err.textContent = 'Error de conexión. Intentá de nuevo.';
      err.style.display = 'block';
    } finally {
      btn.disabled = false;
      textarea.disabled = false;
      textarea.focus();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }
</script>
</body>
</html>
