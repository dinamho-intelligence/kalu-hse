<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ingreso — KALU | Dinamho Intelligence</title>
<meta name="description" content="Ingreso a la plataforma KALU de Dinamho Intelligence. Un solo acceso a todos tus módulos: HSE, Realidad Asistida, Consola." />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#080A0D;--bg2:#0F1218;--bg3:#161A22;--orange:#F28C00;--orange2:#FF9F1C;--cyan:#00D4FF;--text:#EDEFF2;--muted:#8A909C;--border:rgba(255,255,255,.08);--glow-o:rgba(242,140,0,.35);--glow-c:rgba(0,212,255,.25)}
  body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  .bg{position:fixed;inset:0;z-index:0;pointer-events:none}
  .bg .grid{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000 20%,transparent 75%);opacity:.5}
  .bg .glow1{position:absolute;top:-10%;right:-5%;width:640px;height:640px;background:radial-gradient(circle,var(--glow-o),transparent 62%);filter:blur(30px);opacity:.45}
  .bg .glow2{position:absolute;bottom:-20%;left:-10%;width:560px;height:560px;background:radial-gradient(circle,var(--glow-c),transparent 62%);filter:blur(30px);opacity:.4}
  .mono{font-family:'JetBrains Mono',monospace}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--orange)}
  .logo{display:inline-flex;align-items:center;gap:11px;margin-bottom:26px}
  .logo-txt{display:flex;flex-direction:column;line-height:1.05;text-align:left}
  .logo-txt .b{font-weight:700;font-size:15px;letter-spacing:1px}
  .logo-txt .s{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-weight:600;font-size:15px;padding:13px 24px;border-radius:12px;cursor:pointer;transition:all .25s;border:1px solid transparent}
  .btn-primary{background:linear-gradient(135deg,var(--orange),var(--orange2));color:#141414;box-shadow:0 8px 30px -8px var(--glow-o)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 40px -8px var(--glow-o)}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn-ghost:hover{border-color:var(--orange);color:var(--orange)}
  /* stage */
  .stage{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px}
  /* login card */
  .login{width:100%;max-width:410px;text-align:center}
  .card{background:linear-gradient(180deg,rgba(22,26,34,.9),rgba(15,18,24,.9));border:1px solid var(--border);border-radius:22px;padding:34px 30px;backdrop-filter:blur(8px);box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
  .card h1{font-size:24px;font-weight:700;letter-spacing:-.3px;margin-bottom:5px}
  .card .sub{color:var(--muted);font-size:14px;margin-bottom:24px}
  .fld{text-align:left;margin-bottom:14px}
  .fld label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .fld input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:11px;color:var(--text);font-family:inherit;font-size:15px;padding:12px 15px;outline:none;transition:border-color .2s}
  .fld input:focus{border-color:var(--orange)}
  .err{color:#ff6b6b;font-size:13px;margin-bottom:12px;display:none;text-align:left}
  .foot{margin-top:20px;font-size:12px;color:var(--muted)}
  .foot a{color:var(--cyan)}
  /* portal */
  .portal{width:100%;max-width:1000px;display:none}
  .phead{text-align:center;margin-bottom:36px}
  .phead h1{font-size:clamp(26px,3.4vw,38px);font-weight:700;letter-spacing:-.5px;margin:12px 0 8px}
  .phead .who{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted)}
  .phead .who b{color:var(--cyan)}
  .mods{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
  .mod{background:linear-gradient(180deg,var(--bg2),var(--bg));border:1px solid var(--border);border-radius:18px;padding:24px;display:flex;flex-direction:column;transition:transform .3s,border-color .3s}
  .mod:hover{transform:translateY(-5px);border-color:rgba(242,140,0,.45)}
  .mod.c:hover{border-color:rgba(0,212,255,.45)}
  .mod.g:hover{border-color:rgba(52,211,153,.45)}
  .mod .ic{width:52px;height:52px;border-radius:14px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:25px;margin-bottom:16px}
  .mod .st{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;padding:3px 9px;border-radius:20px;align-self:flex-start;margin-bottom:12px}
  .st-live{color:#34d399;border:1px solid rgba(52,211,153,.4);background:rgba(52,211,153,.1)}
  .st-soon{color:var(--muted);border:1px solid var(--border)}
  .mod h3{font-size:18px;font-weight:600;margin-bottom:7px}
  .mod p{color:var(--muted);font-size:13.5px;flex:1;margin-bottom:16px}
  .mod .go{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--orange);align-self:flex-start}
  .mod.c .go{color:var(--cyan)} .mod.g .go{color:#34d399}
  .mod.disabled{opacity:.5;pointer-events:none}
  .ptools{text-align:center;margin-top:32px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .spin{color:var(--muted);font-size:14px}
  @media(max-width:860px){.mods{grid-template-columns:1fr 1fr}}
  @media(max-width:520px){.mods{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bg"><div class="grid"></div><div class="glow1"></div><div class="glow2"></div></div>

<div class="stage">
  <!-- LOGIN -->
  <div class="login" id="loginView">
    <a class="logo" href="index.html" title="Volver al inicio">
      <svg viewBox="0 0 40 40" fill="none" style="width:36px;height:36px"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="none" stroke="#F28C00" stroke-width="1.6"/><polygon points="20,8 30,14 30,26 20,32 10,26 10,14" fill="rgba(242,140,0,0.12)" stroke="#F28C00" stroke-width="0.6"/><text x="20" y="26" text-anchor="middle" fill="#F28C00" font-size="13" font-weight="700" font-family="Space Grotesk">DI</text></svg>
      <div class="logo-txt"><span class="b">KALU</span><span class="s">DINAMHO INTELLIGENCE</span></div>
    </a>
    <div class="card">
      <span class="eyebrow">Plataforma KALU</span>
      <h1>Ingresá a tu cuenta</h1>
      <div class="sub">Un solo acceso a todos tus módulos.</div>
      <div class="fld"><label>Email</label><input id="g_email" type="email" placeholder="tu@empresa.com" autocomplete="username" /></div>
      <div class="fld"><label>Contraseña</label><input id="g_pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" /></div>
      <div class="err" id="g_err"></div>
      <button class="btn btn-primary" id="g_btn" style="width:100%" onclick="doLogin()">Ingresar →</button>
    </div>
    <div class="foot">¿Problemas para entrar? Escribinos a <a href="mailto:info@dinamho.co">info@dinamho.co</a></div>
  </div>

  <!-- PORTAL -->
  <div class="portal" id="portalView">
    <div class="phead">
      <a class="logo" href="index.html" style="justify-content:center">
        <svg viewBox="0 0 40 40" fill="none" style="width:34px;height:34px"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="none" stroke="#F28C00" stroke-width="1.6"/><polygon points="20,8 30,14 30,26 20,32 10,26 10,14" fill="rgba(242,140,0,0.12)" stroke="#F28C00" stroke-width="0.6"/><text x="20" y="26" text-anchor="middle" fill="#F28C00" font-size="13" font-weight="700" font-family="Space Grotesk">DI</text></svg>
        <div class="logo-txt"><span class="b">KALU</span><span class="s">DINAMHO INTELLIGENCE</span></div>
      </a>
      <h1 id="p_hola">Hola</h1>
      <div class="who" id="p_who"></div>
    </div>
    <div class="mods" id="mods"></div>
    <div class="ptools">
      <span class="mono" style="font-size:11px;color:var(--muted);align-self:center">Los módulos disponibles dependen de tu empresa</span>
      <button class="btn btn-ghost" onclick="salir()">⎋ Cerrar sesión</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const SB_URL  = "https://jwqgvlcktzhyddrofqqg.supabase.co";
const SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3cWd2bGNrdHpoeWRkcm9mcXFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NDM0NzYsImV4cCI6MjEwMDMxOTQ3Nn0.MJ-6sgJ72EaRQ_Z_ZznG9j5-FXbTDJPPXmog-_7fYH0";
let SB_TOKEN=null, SB_EMPRESA=null, SB_EMAIL=null, SB_NOMBRE=null, SB_ROL=null, SB_SUPER=false, SB_MODULOS=[];
/* Catálogo del portal: cada acceso pertenece a un módulo que la empresa debe tener */
const PORTAL=[
  {mod:"hse",  href:"app.html",              ic:"🛡️", cls:"g", nombre:"KALU HSE",           desc:"Validación, ATS e investigación de accidentes bajo norma."},
  {mod:"ra",   href:"editor.html",           ic:"🧩", cls:"",  nombre:"Editor de flujos",   desc:"Diseñá y publicá los procedimientos de Realidad Asistida."},
  {mod:"ra",   href:"consola.html",          ic:"📊", cls:"c", nombre:"Consola / Informes", desc:"Inspecciones, estadísticas y evidencia de tu empresa."},
  {mod:"ra",   href:"realidad-asistida.html",ic:"🥽", cls:"c", nombre:"App del lente",      desc:"Corré los flujos por voz en las gafas RealWear."},
  {mod:"qaqc", href:"#",                     ic:"📐", cls:"g", nombre:"QA/QC",              desc:"Aseguramiento de calidad.", soon:true},
  {mod:"ndt",  href:"#",                     ic:"🔬", cls:"c", nombre:"NDT",                desc:"Ensayos no destructivos.", soon:true}
];

async function sbFetch(path, opts){
  opts=opts||{}; opts.headers=Object.assign({ apikey:SB_ANON, "Content-Type":"application/json" }, opts.headers||{});
  if(SB_TOKEN) opts.headers["Authorization"]="Bearer "+SB_TOKEN;
  const res=await fetch(SB_URL+path, opts);
  const txt=await res.text(); let data=null; try{ data=txt?JSON.parse(txt):null; }catch(e){ data=txt; }
  if(!res.ok) throw new Error((data&&(data.message||data.error_description||data.msg))||("HTTP "+res.status));
  return data;
}
/* Sesión compartida entre módulos (mismo navegador, misma pestaña) */
function guardarSesion(){ try{ sessionStorage.setItem("kalu_ses", JSON.stringify({ token:SB_TOKEN, empresa:SB_EMPRESA, email:SB_EMAIL, nombre:SB_NOMBRE, ts:Date.now() })); }catch(e){} }
function leerSesion(){ try{ const s=JSON.parse(sessionStorage.getItem("kalu_ses")||"null"); if(s&&s.token&&(Date.now()-s.ts)<55*60*1000) return s; }catch(e){} return null; }
function borrarSesion(){ try{ sessionStorage.removeItem("kalu_ses"); }catch(e){} }

async function sbLoginPass(email,password){
  const d=await sbFetch("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:email,password:password})});
  SB_TOKEN=d.access_token; SB_EMAIL=email;
}
async function cargarPerfilYPortal(){
  const u=await sbFetch("/auth/v1/user",{});
  if(u&&u.email) SB_EMAIL=u.email;
  const perf=await sbFetch("/rest/v1/perfiles?id=eq."+u.id+"&select=empresa_id,nombre,rol,es_super,activo");
  if(!perf||!perf.length) throw new Error("Tu usuario no tiene perfil/empresa asignada.");
  if(perf[0].activo===false) throw new Error("Tu usuario está desactivado. Contactá a tu administrador.");
  SB_EMPRESA=perf[0].empresa_id; SB_NOMBRE=perf[0].nombre||""; SB_ROL=perf[0].rol||"supervisor"; SB_SUPER=!!perf[0].es_super;
  try{ const emp=await sbFetch("/rest/v1/empresas?id=eq."+SB_EMPRESA+"&select=modulos,activo"); SB_MODULOS=(emp&&emp[0]&&Array.isArray(emp[0].modulos))?emp[0].modulos:[]; }catch(e){ SB_MODULOS=[]; }
  guardarSesion(); mostrarPortal();
}
async function doLogin(){
  const email=$("#g_email").value.trim(), pass=$("#g_pass").value, err=$("#g_err"), btn=$("#g_btn");
  if(!email||!pass){ err.textContent="Completá email y contraseña."; err.style.display="block"; return; }
  btn.disabled=true; btn.textContent="Ingresando…"; err.style.display="none";
  try{ await sbLoginPass(email,pass); await cargarPerfilYPortal(); }
  catch(e){ err.textContent=(e&&e.message)||"Error de login"; err.style.display="block"; }
  finally{ btn.disabled=false; btn.textContent="Ingresar →"; }
}
function mostrarPortal(){
  $("#loginView").style.display="none";
  $("#portalView").style.display="block";
  $("#p_hola").textContent = "Hola" + (SB_NOMBRE ? ", "+SB_NOMBRE.split(" ")[0] : "");
  $("#p_who").innerHTML = "Ingresaste como <b>"+(SB_EMAIL||"")+"</b>";
  // Solo los accesos de los módulos que la empresa tiene
  let cards=PORTAL.filter(function(c){ return SB_MODULOS.indexOf(c.mod)>=0; }).map(function(c){
    const st=c.soon?'<span class="st st-soon">Próximo</span>':'<span class="st st-live">● En operación</span>';
    return '<a class="mod '+c.cls+(c.soon?' disabled':'')+'" href="'+c.href+'">'+
      '<div class="ic">'+c.ic+'</div>'+st+'<h3>'+c.nombre+'</h3><p>'+c.desc+'</p>'+
      (c.soon?'':'<span class="go">Entrar →</span>')+'</a>';
  });
  // Acceso a Administración para admin / super-admin
  if(SB_SUPER || SB_ROL==="admin"){
    cards.push('<a class="mod g" href="admin.html"><div class="ic">⚙️</div><span class="st st-live">'+(SB_SUPER?"super-admin":"admin")+'</span><h3>Administración</h3><p>'+(SB_SUPER?"Empresas, módulos, usuarios y operadores.":"Usuarios y operadores de tu empresa.")+'</p><span class="go">Abrir →</span></a>');
  }
  $("#mods").innerHTML = cards.length ? cards.join("") : '<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:30px">Tu empresa todavía no tiene módulos habilitados. Contactá a Dinamho.</div>';
}
function salir(){ borrarSesion(); SB_TOKEN=SB_EMPRESA=SB_EMAIL=SB_NOMBRE=null; $("#portalView").style.display="none"; $("#loginView").style.display="block"; }

/* Si ya hay sesión activa, re-leer perfil/módulos frescos y mostrar el portal */
(function(){
  const s=leerSesion();
  if(s){ SB_TOKEN=s.token; SB_EMAIL=s.email; cargarPerfilYPortal().catch(function(){ $("#loginView").style.display="block"; $("#portalView").style.display="none"; setTimeout(function(){var e=$("#g_email");if(e)e.focus();},60); }); }
  else { setTimeout(function(){ var e=$("#g_email"); if(e)e.focus(); },80); }
})();
</script>
</body>
</html>
