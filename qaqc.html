<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALU · Captura</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0b0d0a;--panel:#15181a;--panel2:#1b1f22;--border:#2a2f2c;--text:#f5f5f4;
    --muted:#a8a29e;--orange:#f5a623;--green:#34d399;--red:#f87171;--cyan:#4fc3f7;--violet:#a78bfa;--gray:#8a8f88}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:30px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
  .brand svg{width:28px;height:31px}
  .sub{color:var(--muted);font-size:14px;margin:4px 0 20px}
  label.f{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px;font-weight:600}
  input[type=email],input[type=password],input.obs{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px;font-size:15px}
  .btn{border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;background:var(--orange);color:#141414}
  .btn.full{width:100%;margin-top:18px}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 14px;font-size:13px}
  .err{color:var(--red);font-size:13px;margin-top:12px;min-height:16px}
  #app{display:none}
  header{position:sticky;top:0;z-index:10;background:rgba(11,13,10,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
    padding:11px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .who{color:var(--muted);font-size:13px;border-left:1px solid var(--border);padding-left:10px}
  .wrap{max-width:840px;margin:0 auto;padding:18px}
  h1{font-size:20px;font-weight:800;margin-bottom:14px}
  .back{color:var(--muted);font-size:14px;background:none;border:0;cursor:pointer;margin-bottom:10px;padding:6px 0}
  .otg{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin:16px 0 8px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:14px}
  .card:active{border-color:var(--orange)}
  .card .t{font-weight:700;font-size:16px} .card .m{color:var(--muted);font-size:12.5px;margin-top:2px}
  .prog{margin-left:auto;text-align:right;flex-shrink:0}
  .prog .n{font-weight:800;font-size:15px} .prog .l{color:var(--muted);font-size:11px}
  .bar{height:6px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:10px}
  .bar > i{display:block;height:100%;background:var(--green);transition:width .3s}
  .hhead{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
  .hhead .t{font-weight:800;font-size:18px} .hhead .m{color:var(--muted);font-size:13px;margin-top:2px}
  /* actividad */
  .act{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
  .act.done{border-color:rgba(52,211,153,.35)} .act.dev{border-color:rgba(248,113,113,.45)} .act.apr{box-shadow:inset 3px 0 0 var(--green)}
  .act .top{display:flex;gap:10px}
  .act .num{flex:0 0 auto;width:26px;height:26px;border-radius:7px;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
  .act .ti{font-weight:600;font-size:14.5px} .act .norma{color:var(--gray);font-size:11.5px;font-family:ui-monospace,monospace;margin-top:2px}
  .kalu{margin-top:7px;font-size:12.5px;border-radius:8px;padding:7px 10px;background:var(--panel2);border:1px solid var(--border);color:var(--muted)}
  .kalu.cumple{color:var(--green);border-color:rgba(52,211,153,.35)} .kalu.desv{color:var(--red);border-color:rgba(248,113,113,.4)}
  .kalu b{font-weight:700}
  .states{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0 0 36px}
  .st{font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--muted);cursor:pointer;user-select:none}
  .st.c.on{background:var(--green);color:#0c1a12;border-color:var(--green)}
  .st.d.on{background:var(--red);color:#1a0c0c;border-color:var(--red)}
  .st.n.on{background:var(--gray);color:#111;border-color:var(--gray)}
  .row2{margin:10px 0 0 36px}
  .evid{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 0 36px}
  .te{width:52px;height:52px;border-radius:8px;overflow:hidden;border:1px solid var(--border);cursor:pointer}
  .te img{width:100%;height:100%;object-fit:cover}
  .foto{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:10px;border:1px dashed var(--border);background:transparent;color:var(--muted);cursor:pointer}
  .foto input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .aprob{display:flex;align-items:center;gap:8px;margin:12px 0 0 36px;font-size:13.5px;font-weight:700;cursor:pointer;user-select:none;color:var(--muted)}
  .aprob input{width:18px;height:18px;accent-color:var(--green);cursor:pointer}
  .aprob.on{color:var(--green)}
  .efbadge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:20px;border:1px solid var(--border);margin-left:6px;vertical-align:middle}
  .efbadge.ef-no{color:var(--muted)} .efbadge.ef-cur{color:var(--cyan);border-color:rgba(79,195,247,.4)}
  .efbadge.ef-pau{color:var(--amber);border-color:rgba(245,166,35,.4)} .efbadge.ef-cer{color:var(--green);border-color:rgba(52,211,153,.4)}
  .flow{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0 0 36px}
  .fb{font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer}
  .fb.go{background:var(--green);color:#0c1a12;border-color:var(--green)} .fb.end{background:var(--red);color:#1a0c0c;border-color:var(--red)}
  /* acordeón de actividades */
  .acc{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .acc.b-azul{border-left-color:var(--cyan)} .acc.b-amar{border-left-color:var(--amber)}
  .acc.b-verde{border-left-color:var(--green)} .acc.b-rojo{border-left-color:var(--red)}
  .acc.open{border-color:var(--orange)}
  .acc-h{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
  .acc-sub{color:var(--muted);font-size:12px;margin-top:2px}
  .chev{color:var(--muted);font-size:13px;flex:0 0 auto}
  .acc-body{padding:2px 16px 16px;border-top:1px solid var(--border)}
  .acc-body .flow{margin:12px 0 0 0} .acc-body .kalu{margin:10px 0 0 0}
  .acc-body .states,.acc-body .evid{margin-left:0}
  .paso{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:10px}
  .paso-t{font-size:14px;font-weight:600;line-height:1.35}
  .paso-n{display:inline-flex;width:20px;height:20px;border-radius:6px;background:var(--panel2);border:1px solid var(--border);align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);margin-right:8px;vertical-align:middle}
  .paso-crit{color:var(--gray);font-size:11.5px;font-family:ui-monospace,monospace;margin:5px 0 0}
  .paso .obsrow{margin-top:8px}
  /* barras de lista + pantalla de actividad */
  .accbar{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;user-select:none}
  .accbar.b-azul,.acthead.b-azul{border-left-color:var(--cyan)} .accbar.b-amar,.acthead.b-amar{border-left-color:var(--amber)}
  .accbar.b-verde,.acthead.b-verde{border-left-color:var(--green)} .accbar.b-rojo,.acthead.b-rojo{border-left-color:var(--red)}
  .accbar:active{border-color:var(--orange)}
  .acthead{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:12px;padding:16px;margin:6px 0 12px}
  .ti.big{font-size:18px;font-weight:800}
  .chip{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:3px 9px;border-radius:20px;border:1px solid var(--border);white-space:nowrap}
  .ch-gris{color:var(--muted)} .ch-azul{color:var(--cyan);border-color:rgba(79,195,247,.4)}
  .ch-amar{color:var(--amber);border-color:rgba(245,166,35,.4)} .ch-verde{color:var(--green);border-color:rgba(52,211,153,.4)} .ch-rojo{color:var(--red);border-color:rgba(248,113,113,.4)}
  .ch-viol{color:#a78bfa;border-color:rgba(167,139,250,.45)}
  .accbar.b-viol,.acthead.b-viol{border-left-color:#a78bfa} .acc.b-viol{border-left-color:#a78bfa}
  /* devolución flotante de KALU (no bloqueante) */
  .kalunotif{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);width:calc(100% - 28px);max-width:460px;z-index:75;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
  .kalunotif.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .kn-body{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--cyan);border-radius:14px;padding:14px 16px;box-shadow:0 12px 34px rgba(0,0,0,.55)}
  .kn-body.cumple{border-left-color:var(--green)} .kn-body.desv{border-left-color:var(--red)}
  .kn-ttl{font-size:14px} .kn-txt{font-size:13px;color:var(--muted);line-height:1.5;max-height:120px;overflow-y:auto;margin-top:5px}
  .kn-acts{display:flex;gap:8px;margin-top:12px} .kn-acts .btn{flex:1;padding:10px}
  #filtros{margin:2px 0 6px} .acc-body{}
  .fchip{display:inline-block;font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;margin:0 6px 8px 0;user-select:none}
  .fchip.on{background:var(--orange);color:#141414;border-color:var(--orange)} .fchip b{font-weight:800}
  .hint2{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-size:13px}
  .card.desasig{opacity:.45;filter:grayscale(.3)}
  .desbadge{margin-left:auto;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--red);border:1px solid rgba(248,113,113,.4);border-radius:20px;padding:3px 10px}
  .paso.lock{opacity:.55} .states.lock{opacity:.5;pointer-events:none}
  .cap-box{margin:14px 0 0 36px} .cap-box.lock{opacity:.6}
  .cap-box .cl{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .cap-box .tagcli{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:20px;border:1px solid rgba(52,211,153,.4);color:var(--green)}
  .cap-box .tagint{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:20px;border:1px solid rgba(167,139,250,.45);color:#a78bfa}
  textarea.cap{width:100%;box-sizing:border-box;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;padding:10px;font-family:inherit;resize:vertical;min-height:52px}
  .cap-box.interno .cl{color:#a78bfa} .cap-box.interno textarea.cap{border-color:rgba(167,139,250,.35);background:rgba(167,139,250,.05)}
  /* modales flotantes de KALU */
  .modalk{position:fixed;inset:0;background:rgba(0,0,0,.74);display:none;align-items:center;justify-content:center;z-index:90;padding:22px}
  .modalk.on{display:flex}
  .mkcard{width:100%;max-width:460px;max-height:90vh;max-height:calc(100dvh - 44px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px;text-align:center}
  .mkw{font-size:15px;font-weight:600;color:var(--text)}
  .mkkalu{font-size:15px;line-height:1.55;text-align:left;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px;color:var(--text);overflow-y:auto;min-height:0;flex:0 1 auto;-webkit-overflow-scrolling:touch}
  .mkkalu.cumple{border-color:rgba(52,211,153,.45)} .mkkalu.desv{border-color:rgba(248,113,113,.45)}
  .mkacts{display:flex;gap:10px;flex:0 0 auto} .mkacts .btn{flex:1;padding:13px}
  .mkerr{color:var(--red);font-size:12.5px;margin:6px 0 0;min-height:16px;text-align:left}
  #mkpausa-motivo{width:100%;box-sizing:border-box;margin-top:2px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;padding:10px;font-family:inherit;resize:vertical}
  .spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--orange);border-radius:50%;margin:0 auto 16px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .obsrow{display:flex;gap:8px;align-items:center}
  .mic{flex:0 0 auto;width:42px;height:42px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);font-size:18px;cursor:pointer}
  .mic.on{background:var(--red);border-color:var(--red);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .empty{color:var(--muted);text-align:center;padding:50px 0}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px 16px;font-size:13px;z-index:60;opacity:0;transition:opacity .3s}
  .toast.on{opacity:1}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:70;padding:20px;cursor:zoom-out}
  .lb.on{display:flex} .lb img{max-width:100%;max-height:100%;border-radius:8px}
  /* lienzo de dibujo / notas a mano */
  .draw{position:fixed;inset:0;background:#0b0b0b;display:none;flex-direction:column;z-index:100}
  .draw.on{display:flex}
  .dtop{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
  .dtop .dtitle{flex:1;text-align:center;font-weight:700;font-size:14px}
  .dtop .btn{padding:9px 14px}
  .dstage{flex:1;position:relative;overflow:hidden;background:#111}
  #dcanvas{position:absolute;inset:0;touch-action:none;cursor:crosshair}
  .dtools{display:flex;align-items:center;gap:16px;padding:12px 14px;border-top:1px solid var(--border);flex-wrap:wrap;justify-content:center}
  .swatches{display:flex;gap:9px}
  .sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);cursor:pointer}
  .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--orange)}
  .sizes{display:flex;gap:8px}
  .szb{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--panel2)}
  .szb.on{border-color:var(--orange)} .szb i{background:#fff;border-radius:50%;display:block}
  .dtl{font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="center">
  <div class="login">
    <div class="brand">
      <svg viewBox="0 0 34 38"><polygon points="17,1.5 32.5,10.25 32.5,27.75 17,36.5 1.5,27.75 1.5,10.25" fill="none" stroke="#f5a623" stroke-width="2"/><text x="17" y="22.5" text-anchor="middle" fill="#f5a623" font-size="11" font-weight="700">DI</text></svg>
      KALU · Captura
    </div>
    <div class="sub">Ingresá con tu usuario para capturar tus trabajos.</div>
    <label class="f">Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="asegurador@totalqcsas.com">
    <label class="f">Contraseña</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')entrar()">
    <button class="btn full" onclick="entrar()">Ingresar</button>
    <div class="err" id="err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="brand" style="font-size:15px"><svg viewBox="0 0 34 38" style="width:24px;height:26px"><polygon points="17,1.5 32.5,10.25 32.5,27.75 17,36.5 1.5,27.75 1.5,10.25" fill="none" stroke="#f5a623" stroke-width="2"/></svg>Captura <span class="who" id="who"></span></div>
    <button class="btn ghost" onclick="salir()">Salir</button>
  </header>
  <div class="wrap">
    <div id="v-trabajos">
      <h1>Mis trabajos</h1>
      <div id="lista-trabajos"><div class="empty">Cargando…</div></div>
    </div>
    <div id="v-check" style="display:none">
      <button class="back" id="back-trabajos" onclick="volver()">← Mis trabajos</button>
      <div class="hhead" id="hhead">
        <div class="t" id="h-nombre"></div>
        <div class="m" id="h-meta"></div>
        <div class="bar"><i id="h-bar" style="width:0%"></i></div>
        <div class="m" id="h-prog" style="margin-top:8px"></div>
      </div>
      <div id="filtros"></div>
      <div id="lista-check"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="lb" id="lb" onclick="this.classList.remove('on')"><img id="lbimg"></div>

<!-- devolución flotante de KALU (no bloqueante) -->
<div class="kalunotif" id="kalunotif">
  <div class="kn-body" id="kn-body">
    <div class="kn-ttl" id="kn-ttl"></div>
    <div class="kn-txt" id="kn-txt"></div>
    <div class="kn-acts">
      <button class="btn ghost" onclick="salirNotif()">Salir</button>
      <button class="btn" onclick="verNotif()">Ver actividad</button>
    </div>
  </div>
</div>

<!-- esperando a KALU -->
<div class="modalk" id="mkespera"><div class="mkcard"><div class="spin"></div><div class="mkw">Esperando la devolución de KALU…</div></div></div>
<!-- motivo de desasignación -->
<div class="modalk" id="mkmot"><div class="mkcard">
  <div class="mkkalu" id="mkmot-txt"></div>
  <div class="mkacts"><button class="btn" onclick="$('mkmot').classList.remove('on')">Cerrar</button></div>
</div></div>
<!-- motivo de pausa al reanudar -->
<div class="modalk" id="mkpausa"><div class="mkcard">
  <div class="mkkalu" id="mkpausa-txt"></div>
  <textarea id="mkpausa-motivo" rows="3" placeholder="¿Por qué se pausa la actividad?"></textarea>
  <div class="mkerr" id="mkpausa-err"></div>
  <div class="mkacts"><button class="btn" onclick="confirmarPausa()">⏸ Pausar</button></div>
</div></div>
<!-- devolución de KALU -->
<div class="modalk" id="mkver"><div class="mkcard">
  <div class="mkkalu" id="mkver-txt"></div>
  <div class="mkacts">
    <button class="btn ghost" onclick="cerrarModalVer(false)">Volver a la actividad</button>
    <button class="btn" onclick="cerrarModalVer(true)">Salir de todas formas</button>
  </div>
</div></div>

<!-- lienzo de dibujo / notas a mano alzada -->
<div class="draw" id="draw">
  <div class="dtop">
    <button class="btn ghost" onclick="cerrarDibujo()">✕ Cancelar</button>
    <div class="dtitle" id="draw-title">Dibujo</div>
    <button class="btn" onclick="guardarDibujo()">Guardar</button>
  </div>
  <div class="dstage" id="dstage"><canvas id="dcanvas"></canvas></div>
  <div class="dtools">
    <div class="swatches" id="draw-sw"></div>
    <div class="sizes" id="draw-sz"></div>
    <button class="dtl" onclick="dibDeshacer()">↶ Deshacer</button>
    <button class="dtl" onclick="dibLimpiar()">Limpiar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://tytjurhxdwwytagcjxji.supabase.co';

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800);}
function esc(s){return (s==null?'':String(s)).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193);}return (h>>>0).toString(16);}
function uuid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);}

async function cargarDatos(){
  const [cat,herr,resu,pa]=await Promise.all([
    sb.from('catalogo_actividad').select('id, herramienta_tipo, orden, actividad, norma_ref').order('orden'),
    sb.from('herramienta').select('id, nombre, tipo, rol, orden_id, asegurador_id, desasignado_de, desasignado_motivo, orden_de_trabajo(codigo,pozo,cliente)'),
    sb.from('resultado_actividad').select('herramienta_id, actividad_id, resultado, observacion, hallazgo, memorias, kalu_veredicto, kalu_detalle, kalu_revisado, aprobado, estado_flujo, pasos'),
    sb.from('paso_actividad').select('id, actividad_id, orden, paso, tipo, criterio').order('orden')
  ]);
  catalogo=cat.data||[]; herramientas=herr.data||[]; res={}; pasosDef={};
  (pa.data||[]).forEach(p=>{(pasosDef[p.actividad_id]=pasosDef[p.actividad_id]||[]).push(p);});
  (resu.data||[]).forEach(r=>{res[r.herramienta_id+'_'+r.actividad_id]={resultado:r.resultado,observacion:r.observacion,hallazgo:r.hallazgo,memorias:r.memorias,kalu_veredicto:r.kalu_veredicto,kalu_detalle:r.kalu_detalle,kalu_revisado:r.kalu_revisado,aprobado:r.aprobado,estado_flujo:r.estado_flujo||'no_iniciada',pasos:r.pasos||{}};});
}

function actsDe(t){return catalogo.filter(a=>a.herramienta_tipo===t).sort((a,b)=>a.orden-b.orden);}
function progreso(h){
  const acts=actsDe(h.tipo); const total=acts.length||1;
  const aprob=acts.filter(a=>{const r=res[h.id+'_'+a.id];return r&&r.estado_flujo==='cerrada';}).length;
  return {aprob,total:acts.length,pct:Math.round(aprob/total*100)};
}

function estadoInfo(r){
  const ef=(r&&r.estado_flujo)||'no_iniciada'; const val=(r&&r.resultado)||'pendiente';
  if(ef==='pausada')  return {k:'pausada',  label:'en pausa',  col:'b-amar', chip:'ch-amar'};
  if(ef==='cerrada'){
    if(r&&!r.kalu_revisado&&!r.kalu_veredicto) return {k:'cerrada',label:'esperando KALU',col:'b-amar',chip:'ch-amar'};
    if(r&&!r.kalu_revisado&&r.kalu_veredicto)  return {k:'cerrada',label:'revisar KALU',  col:'b-viol',chip:'ch-viol'};
    return val==='desviacion'
      ? {k:'cerrada',label:'cerrada ✗',col:'b-rojo', chip:'ch-rojo'}
      : {k:'cerrada',label:'cerrada ✓',col:'b-verde',chip:'ch-verde'};
  }
  if(ef==='en_curso') return {k:'en_curso',   label:'en curso',  col:'b-azul', chip:'ch-azul'};
  return                     {k:'no_iniciada',label:'sin iniciar',col:'b-azul', chip:'ch-gris'};
}

function filtrarEstado(k){ filtroEstado=k; renderCheck(); }
function abrirActividad(actId){ expandedAct=actId; renderCheck(); }
async function cerrarActividad(){
  // auto-pausa: si estaba en curso y no se cerró, queda en pausa
  const k=herrActual+'_'+expandedAct; const r=res[k];
  if(r && r.estado_flujo==='en_curso'){ await evento(expandedAct,'pausa',{motivo:'Pausa automática (salió de la actividad)'}); }
  expandedAct=null; renderCheck(); window.scrollTo(0,0);
}
async function setPaso(actId,pasoId,valor){
  const k=herrActual+'_'+actId; res[k]=res[k]||{}; res[k].pasos=res[k].pasos||{};
  res[k].pasos[pasoId]={valor};
  if(!res[k].resultado)res[k].resultado='pendiente';
  await upsertRes(actId); renderCheck(); toast('Paso guardado');
}
function dictarPaso(actId,pasoId){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Tu navegador no soporta dictado');return;}
  if(recog){recog.stop();return;}
  recog=new SR();recog.lang='es-CO';recog.continuous=true;recog.interimResults=false;recAct='p'+pasoId;
  const k=herrActual+'_'+actId;
  recog.onresult=(e)=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)t+=e.results[i][0].transcript;
    res[k]=res[k]||{};res[k].pasos=res[k].pasos||{};
    const prev=(res[k].pasos[pasoId]&&res[k].pasos[pasoId].valor)||'';
    res[k].pasos[pasoId]={valor:(prev+' '+t).trim()};
    const inp=$('paso-'+pasoId);if(inp)inp.value=res[k].pasos[pasoId].valor;};
  recog.onend=()=>{recog=null;recAct=null;upsertRes(actId);renderCheck();};
  recog.start();renderCheck();toast('🎤 Dictando… tocá el micrófono para parar');
}

async function upsertRes(actId){
  const key=herrActual+'_'+actId; const r=res[key]||{};
  const row={empresa_id:me.empresa_id,herramienta_id:herrActual,actividad_id:actId,
    resultado:r.resultado||'pendiente',observacion:r.observacion||null,
    hallazgo:r.hallazgo||null,memorias:r.memorias||null,
    kalu_veredicto:r.kalu_veredicto||null,kalu_detalle:r.kalu_detalle||null,kalu_revisado:!!r.kalu_revisado,
    aprobado:!!r.aprobado,estado_flujo:r.estado_flujo||'no_iniciada',pasos:r.pasos||{},
    asegurador_id:me.id,updated_at:new Date().toISOString()};
  const {error}=await sb.from('resultado_actividad').upsert(row,{onConflict:'herramienta_id,actividad_id'});
  if(error){toast('No se pudo guardar');console.error(error);}
}
async function setRes(actId,val){const k=herrActual+'_'+actId;res[k]=res[k]||{};res[k].resultado=val;await upsertRes(actId);renderCheck();}
async function setObs(actId,val){const k=herrActual+'_'+actId;res[k]=res[k]||{};res[k].observacion=val;if(!res[k].resultado)res[k].resultado='pendiente';await upsertRes(actId);toast('Observaciones guardadas');}
async function setHallazgo(actId,val){const k=herrActual+'_'+actId;res[k]=res[k]||{};res[k].hallazgo=val;if(!res[k].resultado)res[k].resultado='pendiente';await upsertRes(actId);toast('Hallazgo guardado');}
async function setMemorias(actId,val){const k=herrActual+'_'+actId;res[k]=res[k]||{};res[k].memorias=val;if(!res[k].resultado)res[k].resultado='pendiente';await upsertRes(actId);toast('Memoria guardada (interno)');}
async function toggleAprob(actId,val){const k=herrActual+'_'+actId;res[k]=res[k]||{};res[k].aprobado=val;if(!res[k].resultado)res[k].resultado='pendiente';await upsertRes(actId);renderCheck();toast(val?'Aprobada para informe ✓':'Quitada del informe');}

async function subirCaptura(actId,blob,ext){
  const h=herramientas.find(x=>x.id===herrActual);
  const path=me.empresa_id+'/'+h.orden_id+'/'+uuid()+'.'+ext;
  toast('Subiendo…');
  const up=await sb.storage.from('capturas').upload(path,blob,{upsert:false,contentType:blob.type||'image/png'});
  if(up.error){toast('Error subiendo');console.error(up.error);return;}
  const {data:ins,error}=await sb.from('captura').insert({empresa_id:me.empresa_id,orden_id:h.orden_id,herramienta_id:herrActual,actividad_id:actId,tipo:'foto',storage_path:path,hash:fnv(path),estado:'clasificada',cedula_tecnico:me.nombre}).select('id').single();
  if(error){toast('Subida, error al registrar');console.error(error);return;}
  const {data:signed}=await sb.storage.from('capturas').createSignedUrl(path,3600);
  (evid[actId]=evid[actId]||[]).push({id:ins&&ins.id,url:signed&&signed.signedUrl});
  renderCheck();toast('Evidencia adjuntada ✓');
}

let dib={actId:null,ctx:null,canvas:null,drawing:false,color:'#1a1a1a',size:4,bg:'#f8f7f2',undo:[],img:null,W:0,H:0,lx:0,ly:0};

// block en blanco para dibujar / escribir a mano
function abrirDibujo(actId){
  dib.actId=actId; dib.img=null; dib.bg='#f8f7f2';
  $('draw-title').textContent='Nota / dibujo a mano';
  prepararTools(['#1a1a1a','#d21f1f','#1f6dd2','#f5a623']);
  mostrarDraw();
}
// tomó una foto -> abrir el lienzo para dibujar encima
function fotoElegida(actId,files){
  const f=files&&files[0]; if(!f)return;
  const inp=document.querySelector('.foto input'); if(inp) inp.value='';
  const img=new Image();
  img.onload=()=>{
    dib.actId=actId; dib.img=img; dib.bg='#111';
    $('draw-title').textContent='Dibujar sobre la foto';
    prepararTools(['#ff3b30','#f5a623','#ffffff','#111111']);
    mostrarDraw();
  };
  img.onerror=()=>toast('No se pudo abrir la foto');
  img.src=URL.createObjectURL(f);
}
function prepararTools(cols){
  $('draw-sw').innerHTML=cols.map((c,i)=>`<span class="sw ${i===0?'on':''}" style="background:${c}" onclick="dibColor('${c}',this)"></span>`).join('');
  $('draw-sz').innerHTML=[2,4,8].map((s,i)=>`<span class="szb ${i===1?'on':''}" onclick="dibSize(${s},this)"><i style="width:${s+3}px;height:${s+3}px"></i></span>`).join('');
  dib.color=cols[0]; dib.size=4;
}
function dibColor(c,el){ dib.color=c; document.querySelectorAll('#draw-sw .sw').forEach(x=>x.classList.remove('on')); el.classList.add('on'); }
function dibSize(s,el){ dib.size=s; document.querySelectorAll('#draw-sz .szb').forEach(x=>x.classList.remove('on')); el.classList.add('on'); }
function drawContain(ctx,img,W,H){
  const r=Math.min(W/img.width,H/img.height);
  const w=img.width*r,h=img.height*r,x=(W-w)/2,y=(H-h)/2;
  ctx.drawImage(img,x,y,w,h);
}
function mostrarDraw(){
  $('draw').classList.add('on'); document.body.style.overflow='hidden';
  setTimeout(()=>{
    const c=$('dcanvas'), stage=$('dstage'), rect=stage.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    c.width=Math.round(rect.width*dpr); c.height=Math.round(rect.height*dpr);
    c.style.width=rect.width+'px'; c.style.height=rect.height+'px';
    const ctx=c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineCap='round'; ctx.lineJoin='round';
    dib.ctx=ctx; dib.canvas=c; dib.W=rect.width; dib.H=rect.height; dib.undo=[];
    ctx.fillStyle=dib.bg; ctx.fillRect(0,0,rect.width,rect.height);
    if(dib.img) drawContain(ctx,dib.img,rect.width,rect.height);
    dibSnapshot();
  },30);
}
function dibSnapshot(){
  try{ dib.undo.push(dib.ctx.getImageData(0,0,dib.canvas.width,dib.canvas.height));
       if(dib.undo.length>8) dib.undo.shift(); }catch(e){}
}
function dibDeshacer(){
  if(dib.undo.length>1) dib.undo.pop();
  if(dib.undo.length) dib.ctx.putImageData(dib.undo[dib.undo.length-1],0,0);
}
function dibLimpiar(){
  const ctx=dib.ctx; ctx.fillStyle=dib.bg; ctx.fillRect(0,0,dib.W,dib.H);
  if(dib.img) drawContain(ctx,dib.img,dib.W,dib.H);
  dib.undo=[]; dibSnapshot();
}
function dibPos(e){ const r=dib.canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
function dibStart(e){
  if(!$('draw').classList.contains('on'))return;
  e.preventDefault(); dib.drawing=true;
  const p=dibPos(e); dib.lx=p.x; dib.ly=p.y;
  try{dib.canvas.setPointerCapture(e.pointerId);}catch(_){}
  const ctx=dib.ctx; ctx.strokeStyle=dib.color; ctx.lineWidth=dib.size;
  ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x+0.1,p.y+0.1); ctx.stroke();
}
function dibMove(e){
  if(!dib.drawing)return; e.preventDefault();
  const p=dibPos(e), ctx=dib.ctx;
  ctx.strokeStyle=dib.color; ctx.lineWidth=dib.size;
  ctx.beginPath(); ctx.moveTo(dib.lx,dib.ly); ctx.lineTo(p.x,p.y); ctx.stroke();
  dib.lx=p.x; dib.ly=p.y;
}
function dibEnd(){ if(!dib.drawing)return; dib.drawing=false; dibSnapshot(); }
function cerrarDibujo(){ $('draw').classList.remove('on'); document.body.style.overflow=''; }
function guardarDibujo(){
  const actId=dib.actId;
  dib.canvas.toBlob(async(blob)=>{
    cerrarDibujo();
    if(blob) await subirCaptura(actId,blob,'png');
  },'image/png');
}
(function(){
  const c=$('dcanvas');
  c.addEventListener('pointerdown',dibStart);
  c.addEventListener('pointermove',dibMove);
  window.addEventListener('pointerup',dibEnd);
  window.addEventListener('pointercancel',dibEnd);
})();
function verFoto(u){if(!u)return;$('lbimg').src=u;$('lb').classList.add('on');}
function verMotivo(hid){
  const h=herramientas.find(x=>x.id===hid); if(!h)return;
  $('mkmot-txt').innerHTML='<b>Herramienta desasignada</b><br><br>'+esc(h.desasignado_motivo||'Sin motivo registrado.');
  $('mkmot').classList.add('on');
}

// ---- flujo de la actividad: botones según estado ----
function flowBtns(actId,ef){
  const b=(txt,ev,cls)=>`<button class="fb ${cls||''}" onclick="evento(${actId},'${ev}')">${txt}</button>`;
  if(ef==='no_iniciada') return b('▶ Iniciar','inicio','go');
  if(ef==='en_curso')    return `<button class="fb" onclick="pausar(${actId})">⏸ Pausar</button>`+b('■ Cerrar','cierre','end');
  if(ef==='pausada')     return b('▶ Reanudar','reinicio','go')+b('■ Cerrar','cierre','end');
  // cerrada
  const rc=res[herrActual+'_'+actId]||{};
  const reabrir=b('↻ Reabrir','reinicio');
  if(rc.kalu_veredicto && !rc.kalu_revisado) return `<button class="fb go" onclick="marcarRevisado(${actId})">✓ Revisado</button>`+reabrir;
  return reabrir;
}
async function evento(actId,ev,extra){
  const map={inicio:'en_curso',reinicio:'en_curso',pausa:'pausada',cierre:'cerrada'};
  const k=herrActual+'_'+actId; res[k]=res[k]||{}; res[k].estado_flujo=map[ev];
  if(!res[k].resultado) res[k].resultado='pendiente';
  // al cerrar: nueva devolución de KALU pendiente (no bloquea)
  if(ev==='cierre'){ res[k].kalu_veredicto=null; res[k].kalu_detalle=null; res[k].kalu_revisado=false; }
  const row={empresa_id:me.empresa_id,herramienta_id:herrActual,actividad_id:actId,asegurador_id:me.id,evento:ev};
  if(extra&&extra.motivo) row.motivo=extra.motivo;
  if(extra&&extra.detenido_seg!=null) row.detenido_seg=extra.detenido_seg;
  await sb.from('actividad_evento').insert(row);
  await upsertRes(actId);
  renderCheck();
  const t={inicio:'Actividad iniciada',reinicio:'Actividad reanudada',pausa:'En pausa',cierre:'Cerrada — KALU analiza en segundo plano, seguí tranquilo'};
  toast(t[ev]);
  if(ev==='cierre') analizarKalu(actId);
}
// ---- pausar: pedir el motivo de la pausa (queda visible para el coordinador) ----
let pausaCtx=null;
async function pausar(actId){
  pausaCtx={actId};
  $('mkpausa-txt').innerHTML='<b>Pausar actividad</b><br><br>Especificá el motivo de la pausa:';
  $('mkpausa-motivo').value=''; $('mkpausa-err').textContent='';
  $('mkpausa').classList.add('on');
  setTimeout(()=>$('mkpausa-motivo').focus(),60);
}
async function confirmarPausa(){
  const m=$('mkpausa-motivo').value.trim();
  if(!m){$('mkpausa-err').textContent='El motivo es obligatorio.';return;}
  if(!pausaCtx)return;
  $('mkpausa').classList.remove('on');
  const {actId}=pausaCtx; pausaCtx=null;
  await evento(actId,'pausa',{motivo:m});
}

// ---- dictado por voz (es-CO) ----
function dictar(actId){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Tu navegador no soporta dictado');return;}
  if(recog){recog.stop();return;}   // segundo toque = parar
  recog=new SR(); recog.lang='es-CO'; recog.continuous=true; recog.interimResults=false; recAct=actId;
  const k=herrActual+'_'+actId;
  recog.onresult=(e)=>{
    let t='';for(let i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript;}
    res[k]=res[k]||{}; res[k].observacion=((res[k].observacion||'')+' '+t).trim();
    const inp=$('obs-'+actId); if(inp) inp.value=res[k].observacion;
  };
  recog.onend=()=>{const a=recAct;recog=null;recAct=null;if(res[k].observacion){upsertRes(a);}renderCheck();};
  recog.start(); renderCheck(); toast('🎤 Dictando… tocá el micrófono para parar');
}

// KALU corre EN SEGUNDO PLANO: no bloquea, el asegurador puede esperar o irse.
async function analizarKalu(actId){
  if(!herrActual||!actId)return;
  const hid=herrActual;
  try{
    const resp=await fetch(KALU_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({herramienta_id:hid,actividad_id:actId})});
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    // traigo solo el veredicto de esa actividad (sin recargar todo ni interrumpir lo que esté haciendo)
    const {data}=await sb.from('resultado_actividad').select('kalu_veredicto,kalu_detalle')
      .eq('herramienta_id',hid).eq('actividad_id',actId).maybeSingle();
    if(data){ const k=hid+'_'+actId; res[k]=res[k]||{}; res[k].kalu_veredicto=data.kalu_veredicto; res[k].kalu_detalle=data.kalu_detalle; }
    // refresco la vista solo si estoy en la lista o en esa misma actividad (no molesto si estoy capturando otra)
    if(herrActual===hid && (!expandedAct || expandedAct===actId)) renderCheck();
    notifKalu(hid,actId);
  }catch(e){ console.error(e); toast('KALU no pudo analizar esa actividad'); }
}
// devolución flotante (no bloqueante): Ver o Salir. La actividad queda pendiente de revisión.
function notifKalu(hid,actId){
  const h=herramientas.find(x=>x.id===hid); const a=(catalogo.find(c=>c.id===actId)||{});
  const r=res[hid+'_'+actId]||{};
  let cls='',ico='🤖',resumen='sin devolución';
  if(r.kalu_veredicto==='cumple'){cls='cumple';ico='✓';resumen='Cumple los criterios';}
  else if(r.kalu_veredicto==='desviacion'){cls='desv';ico='⚠';resumen=(r.kalu_detalle||'Desviación / incompleto');}
  notifCtx={hid,actId};
  $('kn-body').className='kn-body '+cls;
  $('kn-ttl').innerHTML=`${ico} <b>KALU · ${esc(a.actividad||'actividad')}</b>`;
  $('kn-txt').textContent=resumen;
  $('kalunotif').classList.add('on');
}
let notifCtx=null;
function salirNotif(){ $('kalunotif').classList.remove('on'); notifCtx=null; }   // solo cierra la devolución; queda pendiente de revisar
function verNotif(){
  if(!notifCtx)return; const {hid,actId}=notifCtx; salirNotif();
  if(herrActual!==hid){ abrir(hid).then(()=>{ expandedAct=actId; renderCheck(); window.scrollTo(0,0); }); return; }
  expandedAct=actId; renderCheck(); window.scrollTo(0,0);
}
// el asegurador revisó la devolución -> la actividad queda cerrada-lista
async function marcarRevisado(actId){
  const k=herrActual+'_'+actId; res[k]=res[k]||{}; res[k].kalu_revisado=true;
  await upsertRes(actId); renderCheck(); toast('KALU revisado ✓');
}

sb.auth.getSession().then(({data})=>{if(data.session)iniciar();});
</script>
