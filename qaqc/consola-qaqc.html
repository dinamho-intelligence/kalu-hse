<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KALU QA/QC · Consola</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0b0d0a;--panel:#15181a;--panel2:#1b1f22;--border:#2a2f2c;--text:#f5f5f4;
    --muted:#a8a29e;--orange:#f5a623;--green:#34d399;--amber:#f5a623;--red:#f87171;--cyan:#4fc3f7;--violet:#a78bfa}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .login{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:32px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin-bottom:4px}
  .brand svg{width:30px;height:33px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:22px}
  label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px;font-weight:600}
  input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:13px;font-size:15px}
  .btn{border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;background:var(--orange);color:#141414}
  .btn.full{width:100%;margin-top:18px}
  .btn:active{transform:scale(.99)} .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);padding:9px 16px;font-size:13px}
  .err{color:var(--red);font-size:13px;margin-top:12px;min-height:18px}
  #app{display:none}
  header{position:sticky;top:0;z-index:10;background:rgba(11,13,10,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);
    padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .hleft{display:flex;align-items:center;gap:12px}
  .emp{color:var(--muted);font-size:13px;border-left:1px solid var(--border);padding-left:12px}
  .wrap{max-width:1100px;margin:0 auto;padding:22px}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  h1{font-size:20px;font-weight:800}
  .filtros{display:flex;gap:6px;flex-wrap:wrap}
  .fbtn{font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;user-select:none}
  .fbtn.on{background:var(--orange);color:#141414;border-color:var(--orange)}
  .ot{border:1px solid var(--border);border-radius:14px;background:var(--panel);margin-bottom:16px;overflow:hidden}
  .ot-h{padding:14px 18px;background:var(--panel2);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .ot-h .cod{font-weight:800;font-size:16px}
  .ot-h .m{color:var(--muted);font-size:13px}
  .ot-h .count{margin-left:auto;font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:3px 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:16px}
  .cap{border:1px solid var(--border);border-radius:12px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
  .cap .img{aspect-ratio:4/3;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;overflow:hidden}
  .cap .img img{width:100%;height:100%;object-fit:cover;cursor:pointer}
  .cap .body{padding:11px 12px}
  .cap .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .badge{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:20px}
  .b-pend{color:var(--amber);background:rgba(245,166,35,.13);border:1px solid rgba(245,166,35,.4)}
  .b-clas{color:var(--green);background:rgba(52,211,153,.13);border:1px solid rgba(52,211,153,.4)}
  .b-stby{color:var(--cyan);background:rgba(79,195,247,.13);border:1px solid rgba(79,195,247,.4)}
  .b-desc{color:var(--red);background:rgba(248,113,113,.13);border:1px solid rgba(248,113,113,.4)}
  .htag{font-size:11px;font-weight:700;color:var(--orange);border:1px solid rgba(245,166,35,.4);border-radius:20px;padding:2px 8px}
  .cap .txt{color:var(--muted);font-size:12.5px;margin-top:2px}
  .cap .meta{color:var(--muted);font-size:11px;margin-top:7px}
  .empty{color:var(--muted);text-align:center;padding:50px 0}
  .lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;cursor:zoom-out}
  .lb.on{display:flex} .lb img{max-width:100%;max-height:100%;border-radius:8px}
  .lb .x{position:absolute;top:16px;right:20px;color:#fff;font-size:30px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="center">
  <div class="login">
    <div class="brand">
      <svg viewBox="0 0 34 38"><polygon points="17,1.5 32.5,10.25 32.5,27.75 17,36.5 1.5,27.75 1.5,10.25" fill="none" stroke="#f5a623" stroke-width="2"/><text x="17" y="22.5" text-anchor="middle" fill="#f5a623" font-size="11" font-weight="700">DI</text></svg>
      KALU QA/QC · Consola
    </div>
    <div class="sub">Acceso del coordinador.</div>
    <label>Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="coordinador@totalqc.com">
    <label>Contraseña</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')entrar()">
    <button class="btn full" onclick="entrar()">Ingresar</button>
    <div class="err" id="err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="hleft">
      <div class="brand" style="font-size:16px"><svg viewBox="0 0 34 38"><polygon points="17,1.5 32.5,10.25 32.5,27.75 17,36.5 1.5,27.75 1.5,10.25" fill="none" stroke="#f5a623" stroke-width="2"/></svg>KALU QA/QC</div>
      <span class="emp" id="emp"></span>
    </div>
    <button class="btn ghost" onclick="salir()">Salir</button>
  </header>
  <div class="wrap">
    <div class="toolbar">
      <h1>Capturas</h1>
      <div class="filtros" id="filtros">
        <span class="fbtn on" data-f="todas" onclick="filtrar(this)">Todas</span>
        <span class="fbtn" data-f="pendiente" onclick="filtrar(this)">Pendientes</span>
        <span class="fbtn" data-f="clasificada" onclick="filtrar(this)">Clasificadas</span>
        <span class="fbtn" data-f="standby" onclick="filtrar(this)">Standby</span>
        <span class="fbtn" onclick="cargar()">↻ Actualizar</span>
      </div>
    </div>
    <div id="lista"><div class="empty">Cargando…</div></div>
  </div>
</div>

<div class="lb" id="lb" onclick="cerrarFoto()"><span class="x">✕</span><img id="lbimg"></div>

<!-- Supabase como script CLÁSICO (UMD) -> expone el global `supabase` -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SB_URL = 'https://tytjurhxdwwytagcjxji.supabase.co';
  const SB_KEY = 'sb_publishable_vMJSHRPHEI-LU7A5GG6EUg_8Q69q5x0';
  const sb = supabase.createClient(SB_URL, SB_KEY);
  const $ = (id) => document.getElementById(id);

  let capturas = [], filtro = 'todas';

  async function entrar(){
    const email = $('email').value.trim();
    const password = $('pass').value;
    $('err').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error){ $('err').textContent = 'Credenciales inválidas o usuario sin perfil.'; return; }
    iniciar();
  }
  async function salir(){ await sb.auth.signOut(); location.reload(); }

  async function iniciar(){
    const { data: { user } } = await sb.auth.getUser();
    const { data: perfil } = await sb.from('perfil').select('nombre, empresa(nombre)').eq('id', user.id).maybeSingle();
    $('emp').textContent = (perfil && perfil.empresa && perfil.empresa.nombre) || 'Mi empresa';
    $('login').style.display = 'none';
    $('app').style.display = 'block';
    cargar();
  }

  async function cargar(){
    const cont = $('lista');
    cont.innerHTML = '<div class="empty">Cargando…</div>';
    const { data, error } = await sb.from('captura')
      .select('id, tipo, estado, storage_path, transcripcion, texto, created_at, orden_id, orden_de_trabajo(codigo,pozo,cliente), herramienta(nombre,rol)')
      .order('created_at', { ascending:false });
    if (error){ cont.innerHTML = '<div class="empty">Error al cargar.</div>'; return; }
    capturas = data || [];
    const paths = capturas.filter(c=>c.storage_path).map(c=>c.storage_path);
    if (paths.length){
      const { data: signed } = await sb.storage.from('capturas').createSignedUrls(paths, 3600);
      const map = {}; (signed||[]).forEach(s=>{ if(s.path) map[s.path]=s.signedUrl; });
      capturas.forEach(c=>{ c._url = c.storage_path ? map[c.storage_path] : null; });
    }
    render();
  }

  function filtrar(el){
    document.querySelectorAll('#filtros .fbtn[data-f]').forEach(b=>b.classList.remove('on'));
    el.classList.add('on'); filtro = el.dataset.f; render();
  }

  const B = { pendiente:'b-pend', clasificada:'b-clas', standby:'b-stby', descartada:'b-desc' };
  function esc(s){ return (s==null?'':String(s)).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

  function render(){
    const cont = $('lista');
    let items = capturas;
    if (filtro !== 'todas') items = items.filter(c=>c.estado===filtro);
    if (!items.length){ cont.innerHTML = '<div class="empty">No hay capturas'+(filtro!=='todas'?' '+filtro:'')+'.</div>'; return; }
    const grupos = {};
    items.forEach(c=>{ const k=c.orden_id; (grupos[k]=grupos[k]||{ot:c.orden_de_trabajo, list:[]}).list.push(c); });
    cont.innerHTML = Object.values(grupos).map(g=>`
      <div class="ot">
        <div class="ot-h">
          <span class="cod">${esc(g.ot && g.ot.codigo)||'OT'}</span>
          <span class="m">${esc(g.ot && g.ot.pozo)} ${g.ot && g.ot.cliente?'· '+esc(g.ot.cliente):''}</span>
          <span class="count">${g.list.length} captura${g.list.length>1?'s':''}</span>
        </div>
        <div class="grid">
          ${g.list.map(c=>`
            <div class="cap">
              <div class="img">${c._url?`<img src="${c._url}" data-url="${esc(c._url)}">`:(c.tipo==='foto'?'(sin imagen)':'🎙️ '+esc(c.tipo))}</div>
              <div class="body">
                <div class="row">
                  <span class="badge ${B[c.estado]||''}">${esc(c.estado)}</span>
                  ${c.herramienta?`<span class="htag">${esc(c.herramienta.nombre)} · ${esc(c.herramienta.rol)}</span>`:'<span class="badge b-pend">sin herramienta</span>'}
                </div>
                ${c.transcripcion?`<div class="txt">${esc(c.transcripcion)}</div>`:''}
                <div class="meta">#${c.id} · ${new Date(c.created_at).toLocaleString('es-CO')}</div>
              </div>
            </div>`).join('')}
        </div>
      </div>`).join('');
  }

  function verFoto(u){ $('lbimg').src=u; $('lb').classList.add('on'); }
  function cerrarFoto(){ $('lb').classList.remove('on'); }

  // clic en cualquier foto (delegación)
  document.getElementById('lista').addEventListener('click', (e)=>{
    const img = e.target.closest('img[data-url]'); if (img) verFoto(img.dataset.url);
  });

  // sesión persistente al abrir
  sb.auth.getSession().then(({ data }) => { if (data.session) iniciar(); });
</script>
</body>
</html>
