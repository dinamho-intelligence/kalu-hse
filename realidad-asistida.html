  Nivel 2 · Etapa 1: HUB + Flujos ONLINE/OFFLINE desde Supabase.
   - Después del login, HUB de módulos (Flujos activo; Asistencia y Kalu próximamente).
   - Flujos: baja los PUBLICADOS de la base (rol anon), marca en línea/offline (cache IndexedDB).
   - Motor GENÉRICO: corre cualquier flujo (instruccion, confirmacion multi-opción,
     foto, dato, escaneo) con ramas, bucles y terminar. Mismo modelo que el editor.
   - Login de operador sigue quemado (lista OPERADORES) — el login real y multi-empresa

async function sbFetch(path, opts){
  opts=opts||{};
  opts.headers=Object.assign({ apikey:SB_ANON, Authorization:"Bearer "+SB_ANON }, opts.headers||{});
  if(opts.body && !opts.headers["Content-Type"]) opts.headers["Content-Type"]="application/json";
  const res=await fetch(SB_URL+path, opts);
  const txt=await res.text(); let data=null; try{ data=txt?JSON.parse(txt):null; }catch(e){ data=txt; }
  if(!res.ok) throw new Error((data&&(data.message||data.msg))||("HTTP "+res.status));
  return data;
}

/* WearML: comando explícito por control */
function wm(cmd){ return (cmd?String(cmd).toUpperCase().replace(/"/g,"")+"|":"")+"hf_make_clickable|hf_show_text"; }
function btn(cls,label,onclick){ return '<button class="opt '+cls+'" title="'+wm(label)+'" onclick="'+onclick+'">'+label+'</button>'; }

/* Recrea la pantalla ENTERA para forzar el re-scan de WearHF */
function setScreen(cls, html){
  const old=$("#screen");
  const neo=document.createElement("div");
  neo.id="screen"; neo.className=cls||""; neo.innerHTML=html;
  old.parentNode.replaceChild(neo, old);
  try{ window.dispatchEvent(new Event("resize")); }catch(e){}
}
function chips(list){ $("#chips").innerHTML = (list||[]).filter(Boolean).map(function(c){return '<span class="chip">'+c+'</span>';}).join(""); }

/* ---------- Estado ---------- */
let ejec=null, F=[], i=0, cedBuf="", pinBuf="", datoBuf="", stage="";

const OPERADORES = [

  // ,{ cedula:"CEDULA_REAL", pin:"PIN_REAL", nombre:"Carla Seguel" }
];

/* ---------- Inicio / login ---------- */
function showInicio(){

}

function keypadScreen(kick,title,instr,display,enterFn,errMsg){

function showCedula(err){ stage="ced"; keypadScreen("Operador · Paso 1","Tu cédula","Tocá los números o decí cada número. Después «Entrar».", cedBuf, "cedListo()", err||""); }
function showPin(err){ stage="pin"; keypadScreen("Operador · Paso 2","Tu PIN","Ingresá tu PIN y decí «Entrar».", pinMask(), "pinListo()", err||""); }
function pinMask(){ return pinBuf.replace(/./g,"•"); }
function keyPress(n){ const buf=(stage==="pin"?pinBuf:cedBuf); if(buf.length<12){ if(stage==="pin") pinBuf+=n; else cedBuf+=n; paintKey(); } }
function keyDel(){ if(stage==="pin") pinBuf=pinBuf.slice(0,-1); else cedBuf=cedBuf.slice(0,-1); paintKey(); }
function paintKey(){ const b=$("#idbox"); if(!b)return; const v=(stage==="pin"?pinMask():cedBuf); b.textContent=v||"— — — —"; if(v) b.classList.remove("empty"); else b.classList.add("empty"); }
function cedListo(){ if(!cedBuf){ showCedula("Ingresá tu cédula."); return; } showPin(""); }
function pinListo(){
  const op=OPERADORES.find(function(o){ return o.cedula===cedBuf && o.pin===pinBuf; });
  if(op){ ejec.operador_cedula=cedBuf; ejec.operador_nombre=op.nombre||""; showHub(); }
  else { cedBuf=""; pinBuf=""; showCedula("❌ Cédula o PIN incorrecto. Volvé a intentar."); }

/* ---------- Módulo Flujos: listar (online + offline) ---------- */
async function showFlujos(){
  setScreen("", '<div class="kick">Módulo · Flujos</div><div class="title">Buscando flujos…</div><p class="instr">Un momento.</p>');
  chips([]);
  const cache=await listFlujosCache(); const cids={}; cache.forEach(function(c){ cids[c.id]=true; });
  let online=[];
  if(navigator.onLine){
    try{ online=await sbFetch("/rest/v1/flujos?estado=eq.publicado"+(EMPRESA_ID?"&empresa_id=eq."+EMPRESA_ID:"")+"&select=id,nombre,tipo&order=actualizado_en.desc"); }
    catch(e){ online=[]; }
  }
  const map={};
  online.forEach(function(f){ map[f.id]={id:f.id,nombre:f.nombre,tipo:f.tipo,online:true,offline:!!cids[f.id]}; });
  cache.forEach(function(c){ if(!map[c.id]) map[c.id]={id:c.id,nombre:c.nombre,tipo:c.tipo,online:false,offline:true}; });
  const list=Object.keys(map).map(function(k){ return map[k]; });

  let body='<div class="kick">Módulo · Flujos</div><div class="title">Elegí un flujo</div>';
  if(!list.length){
    body+='<p class="instr">'+(navigator.onLine?'No hay flujos publicados todavía. Publicá uno desde el editor.':'No tenés flujos offline. Conectate para descargarlos.')+'</p>';
  } else {
    body+='<div style="display:flex;flex-direction:column;gap:9px;max-width:580px;width:100%">'+
      list.map(function(f){
        const tags=(f.offline?'<span style="color:#7ee2ab">● offline</span>':'')+(f.online?(f.offline?' · ':'')+'<span style="color:#8bc0f5">● en línea</span>':'');
        return '<button class="opt" style="justify-content:space-between;text-align:left;font-size:17px" title="'+wm(f.nombre)+'" onclick="abrirFlujoLente(\''+f.id+'\')">'+
          '<span>'+esc(f.nombre||"(sin nombre)")+'</span>'+
          '<span style="font-size:11px;font-weight:800;white-space:nowrap">'+tags+'</span></button>';
      }).join('')+'</div>';
  }
  body+='<div class="opts" style="margin-top:12px;max-width:240px">'+btn("","Volver","showHub()")+'</div>';
  setScreen("",body);
  chips(list.length?["número del flujo","“<b>Volver</b>”"]:["“<b>Volver</b>”"]);
}

/* Convierte los pasos de la base al modelo del motor (dest por índice) */
function normalizar(pasos){
  const F2=(pasos||[]).map(function(row){
    const cfg=row.config||{};
    const p={ orden:row.orden, tipo:row.tipo_paso, titulo:row.titulo||"", instr:row.instruccion||"",
      campo:cfg.campo||"", formato:cfg.formato||"", imagen:cfg.imagen||null, dest:null,
      opciones:(row.tipo_paso==="confirmacion"?(cfg.opciones||[]).map(function(o){return {label:o.label||"",dest:null};}):null) };
    return p;
  });
  const byOrden={}; F2.forEach(function(p,ix){ byOrden[p.orden]=ix; });
  function resolve(rm){ return rm.fin ? "fin" : (byOrden[rm.ir_a_orden]!=null ? byOrden[rm.ir_a_orden] : null); }
  (pasos||[]).forEach(function(row,ix){
    const p=F2[ix]; if(!row.rama) return;
    row.rama.forEach(function(rm){
      const dest=resolve(rm);
      if(row.tipo_paso==="confirmacion"){ const op=(p.opciones||[]).find(function(o){return o.label===rm.cuando;}); if(op) op.dest=dest; }
      else { p.dest=dest; }
    });
  });
  return F2;
}

async function abrirFlujoLente(id){
  setScreen("", '<div class="kick">Flujo</div><div class="title">Abriendo…</div><p class="instr">Un momento.</p>');
  chips([]);
  let fo=null;
  if(navigator.onLine){
    try{
      const rf=await sbFetch("/rest/v1/flujos?id=eq."+id+"&select=id,nombre,tipo,empresa_id,version");
      const meta=rf&&rf[0];
      const pasos=await sbFetch("/rest/v1/flujo_pasos?flujo_id=eq."+id+"&select=orden,tipo_paso,titulo,instruccion,config,rama&order=orden.asc");
      fo={ id:id, nombre:meta?meta.nombre:"Flujo", tipo:meta?meta.tipo:"", empresa_id:meta?meta.empresa_id:null, version:meta?meta.version:1, pasos:normalizar(pasos), cached_at:new Date().toISOString() };
      cacheFlujo(fo);           // queda disponible offline
    }catch(e){ fo=await getFlujoCache(id); }
  } else {
    fo=await getFlujoCache(id);
  }
  if(!fo || !fo.pasos || !fo.pasos.length){
    setScreen("", '<div class="kick">Flujo</div><div class="title">No se pudo abrir</div><p class="instr">'+(navigator.onLine?'El flujo no tiene pasos.':'No está disponible offline.')+'</p><div class="opts" style="max-width:240px">'+btn("","Volver","showFlujos()")+'</div>');
    chips(["“<b>Volver</b>”"]); return;
  }
  F=fo.pasos; i=0; ejec.flujo=fo.nombre; ejec.flujo_id=fo.id; ejec.empresa_id=fo.empresa_id||""; ejec.flujo_version=fo.version||1;
  ejec.equipo_id=""; ejec.respuestas={}; ejec.resultado="pendiente";
  render();
}

/* ---------- Motor genérico ---------- */
function head(t){ return '<div class="kick">Paso '+(i+1)+' · '+t+'</div>'; }
function titleH(p){ return '<div class="title">'+esc(p.titulo||"(sin título)")+'</div>'; }
function instrH(p){ return p.instr?'<p class="instr">'+esc(p.instr)+'</p>':''; }
function imgBlock(src){ return '<div class="cam"><span class="tag">REFERENCIA</span><img src="'+src+'" /></div>'; }
function imgH(p){ return p.imagen?imgBlock(p.imagen):''; }
function opCls(n,ix){ return n===2?(ix===0?"ok":"no"):"primary"; }

function render(){
  if(i>=F.length){ showResultado(); return; }
  const p=F[i];
  if(p.tipo==="escaneo"){
    setScreen("", head("Escaneo")+titleH(p)+instrH(p)+imgH(p)+
      (ejec.equipo_id?'<div class="equipo">🔧 '+esc(ejec.equipo_id)+'</div>':'')+
      '<div class="opts">'+btn("primary","Escanear","escanear()")+(ejec.equipo_id?btn("","Siguiente","avanzar()"):'')+'</div>');
    chips(["“<b>Escanear</b>”", ejec.equipo_id?"“<b>Siguiente</b>”":""]);
  }
  else if(p.tipo==="confirmacion"){
    const os=(p.opciones&&p.opciones.length)?p.opciones:[{label:"Sí",dest:null},{label:"No",dest:null}];
    setScreen("", head("Verificación")+titleH(p)+instrH(p)+imgH(p)+
      '<div class="opts">'+os.map(function(o,ix){ return btn(opCls(os.length,ix),esc(o.label||"Opción"),"responderOp("+ix+")"); }).join('')+'</div>');
    chips(os.map(function(o){ return "“<b>"+esc(o.label)+"</b>”"; }));
  }
  else if(p.tipo==="foto"){
    const campo=p.campo||("foto_"+(i+1));
    const tiene=!!ejec.respuestas[campo];
    setScreen("", head("Evidencia")+titleH(p)+
      (tiene?'<div class="cam"><span class="tag">FOTO TOMADA</span><img src="'+ejec.respuestas[campo]+'" /></div>'
            :'<div class="cam"><span class="tag">CÁMARA</span><div class="ph">'+esc(p.instr||"Encuadrá y tomá la foto")+'</div></div>')+
      '<input type="file" id="cap" accept="image/*" capture="environment" style="display:none" onchange="onFoto(\''+campo+'\')" />'+
      '<div class="opts">'+(tiene?btn("ok","Siguiente","avanzar()")+btn("","Repetir","repetir('"+campo+"')")
                                 :btn("primary","Tomar foto","tomarFoto()")+btn("","Omitir","avanzar()"))+'</div>');
    chips(tiene?["“<b>Siguiente</b>”","“<b>Repetir</b>”"]:["“<b>Tomar foto</b>”","“<b>Omitir</b>”"]);
  }
  else if(p.tipo==="dato"){ datoScreen(p); }
  else { /* instruccion (y cualquier otro) */
    setScreen("", head("Instrucción")+titleH(p)+instrH(p)+imgH(p)+
      '<div class="opts">'+btn("primary","Siguiente","avanzar()")+'</div>');
    chips(["“<b>Siguiente</b>”"]);
  }
}

/* Navegación por ruteo (dest: índice · "fin" · null=siguiente) */
function irA(dest){
  if(dest==="fin"){ i=F.length; render(); return; }
  if(dest==null){ if(i<F.length-1){ i++; } else { i=F.length; } render(); return; }
  i=dest; render();
}
function avanzar(){ irA(F[i].dest); }
function responderOp(ix){ const p=F[i]; const o=(p.opciones||[])[ix]||{}; ejec.respuestas[p.campo||("resp_"+(i+1))]=o.label||""; irA(o.dest); }
function escanear(){ const p=F[i]; ejec.equipo_id="EQ-"+(100+Math.floor(Math.abs(Math.sin(Date.now()))*899)); if(p.campo) ejec.respuestas[p.campo]=ejec.equipo_id; render(); }

/* Dato: teclado numérico */
function datoScreen(p){
  let keys="";
  ["1","2","3","4","5","6","7","8","9"].forEach(function(n){ keys+='<button class="key" title="'+wm("")+'" onclick="datoKey(\''+n+'\')">'+n+'</button>'; });
  keys+='<button class="key wide act" title="'+wm("Borrar")+'" onclick="datoDel()">Borrar</button>';
  keys+='<button class="key" title="'+wm("")+'" onclick="datoKey(\'0\')">0</button>';
  keys+='<button class="key wide go" title="'+wm("Entrar")+'" onclick="datoListo()">Entrar</button>';
  datoBuf="";
  setScreen("", head("Dato")+titleH(p)+instrH(p)+imgH(p)+
    '<div class="idwrap"><div class="iddisplay"><div class="idbox empty" id="idbox">— — — —</div>'+(p.campo?'<p class="note">Campo: '+esc(p.campo)+'</p>':'')+'</div>'+
    '<div class="keys">'+keys+'</div></div>');
  chips(["números","“<b>Borrar</b>”","“<b>Entrar</b>”"]);
}
function datoKey(n){ if(datoBuf.length<12){ datoBuf+=n; const b=$("#idbox"); if(b){ b.textContent=datoBuf; b.classList.remove("empty"); } } }
function datoDel(){ datoBuf=datoBuf.slice(0,-1); const b=$("#idbox"); if(b){ b.textContent=datoBuf||"— — — —"; if(!datoBuf)b.classList.add("empty"); } }
function datoListo(){ const p=F[i]; ejec.respuestas[p.campo||("dato_"+(i+1))]=datoBuf||"—"; datoBuf=""; irA(p.dest); }

/* Foto: cámara nativa del RealWear (input capture) */
function tomarFoto(){ const c=$("#cap"); if(c) c.click(); }
function repetir(campo){ delete ejec.respuestas[campo]; render(); tomarFoto(); }
function onFoto(campo){
  const inp=$("#cap"); const f=inp && inp.files && inp.files[0];
  if(!f){ return; }
  const rd=new FileReader();
  rd.onload=function(){ ejec.respuestas[campo]=rd.result; render(); };
  rd.onerror=function(){ render(); };
  rd.readAsDataURL(f);
}

/* ---------- Cierre ---------- */
function showResultado(){
  setScreen("", '<div class="kick">Cierre</div><div class="title">Resultado</div>'+
    '<p class="instr">Confirmá el estado del equipo.</p>'+
    '<div class="opts">'+btn("ok","Apto","resultado('apto')")+btn("no","No apto","resultado('no_apto')")+'</div>');
  chips(["“<b>Apto</b>”","“<b>No apto</b>”"]);
}
function resultado(v){ ejec.resultado=v; ejec.fin=new Date().toISOString(); showFin(); }
function showFin(){
  const r=ejec.respuestas, apto=ejec.resultado==="apto";
  let fotos=0, datos=0; for(const k in r){ const v=r[k]; if(typeof v==="string" && v.indexOf("data:")===0) fotos++; else datos++; }
  setScreen("", '<div class="kick">✔ Registro en cola local</div><div class="title" style="font-size:20px">'+esc(ejec.flujo||"Inspección")+' — completada</div>'+
    '<div class="sum">'+
      '<div class="row"><span>Equipo</span><span>'+esc(ejec.equipo_id||"—")+'</span></div>'+
      '<div class="row"><span>Operador</span><span>'+esc((ejec.operador_nombre?ejec.operador_nombre+" · ":"")+(ejec.operador_cedula||"—"))+'</span></div>'+
      '<div class="row"><span>Respuestas</span><span>'+datos+' dato(s) · '+fotos+' foto(s)</span></div>'+
      '<div class="row"><span>Resultado</span><span><span class="badge '+(apto?'apto':'noapto')+'">'+(apto?'APTO':'NO APTO')+'</span></span></div>'+
    '</div>'+
    '<div class="opts">'+btn("amber","Volver al menú","finalizar()")+'</div>'+
    '<p class="note">Al volver al menú se guarda y <b>sube a la base</b> (con evidencia). Sin señal queda en cola y sincroniza solo al reconectar. El PDF firmado va en la próxima etapa.</p>');
  chips(["“<b>Volver al menú</b>”"]);
}
function finalizar(){
  ejec.fin=ejec.fin||new Date().toISOString(); ejec.estado="completada";
  armarItems();
  ejec.hash=fnv(JSON.stringify({ eq:ejec.equipo_id, op:ejec.operador_cedula, res:ejec.resultado,
    it:(ejec.items||[]).map(function(x){ return { c:x.campo, v:x.valor, f:!!x.foto }; }) }));
  try{ guardarLocal(ejec).then(function(){ refrescarPend(); sincronizar(); }).catch(function(){}); }catch(e){}
  const c=ejec.operador_cedula, n=ejec.operador_nombre;
  nuevaEjecucion(); ejec.operador_cedula=c; ejec.operador_nombre=n;
  showHub();
}

/* ---------- Offline (IndexedDB): ejecuciones en cola + cache de flujos ---------- */
let db=null;
function abrirDB(){ return new Promise(function(res){ try{
  const q=indexedDB.open("realwear_ra",2);
  q.onupgradeneeded=function(e){ const d=e.target.result;
    if(!d.objectStoreNames.contains("pendientes")) d.createObjectStore("pendientes",{keyPath:"id"});
    if(!d.objectStoreNames.contains("flujos")) d.createObjectStore("flujos",{keyPath:"id"});
  };
  q.onsuccess=function(e){ db=e.target.result; res(true); };
  q.onerror=function(){ res(false); };
}catch(e){ res(false); } }); }
function guardarLocal(o){ return new Promise(function(res){ if(!db){res();return;} try{ const tx=db.transaction("pendientes","readwrite"); tx.objectStore("pendientes").put(o); tx.oncomplete=function(){res()}; tx.onerror=function(){res()}; }catch(e){ res(); } }); }
function refrescarPend(){ return new Promise(function(res){ const el=$("#pend"); if(!el){res();return;} if(!db){ el.style.display="none"; res(); return; }
  try{ const q=db.transaction("pendientes","readonly").objectStore("pendientes").count();
    q.onsuccess=function(){ const n=q.result; if(n>0){ el.style.display="inline-block"; el.textContent="⏳ "+n; } else el.style.display="none"; res(); };
    q.onerror=function(){ res(); }; }catch(e){ res(); } }); }
function cacheFlujo(o){ return new Promise(function(res){ if(!db){res();return;} try{ const tx=db.transaction("flujos","readwrite"); tx.objectStore("flujos").put(o); tx.oncomplete=function(){res()}; tx.onerror=function(){res()}; }catch(e){ res(); } }); }
function getFlujoCache(id){ return new Promise(function(res){ if(!db){res(null);return;} try{ const q=db.transaction("flujos","readonly").objectStore("flujos").get(id); q.onsuccess=function(){ res(q.result||null); }; q.onerror=function(){ res(null); }; }catch(e){ res(null); } }); }
function listFlujosCache(){ return new Promise(function(res){ if(!db){res([]);return;} try{ const q=db.transaction("flujos","readonly").objectStore("flujos").getAll(); q.onsuccess=function(){ res(q.result||[]); }; q.onerror=function(){ res([]); }; }catch(e){ res([]); } }); }

/* =====================================================================
   ETAPA 2 · Subir la ejecución a la base (anon) + evidencia al Storage
   con cola offline y sincronización al volver la señal.
   ===================================================================== */
function fnv(str){ let h=0x811c9dc5; for(let k=0;k<str.length;k++){ h^=str.charCodeAt(k); h=(h*0x01000193)>>>0; } return ("0000000"+h.toString(16)).slice(-8); }
function dataURLtoBlob(d){ const c=d.split(','); const mime=((c[0]||"").match(/data:(.*?);/)||[])[1]||"image/jpeg"; const bin=atob(c[1]||""); const u=new Uint8Array(bin.length); for(let k=0;k<bin.length;k++) u[k]=bin.charCodeAt(k); return new Blob([u],{type:mime}); }

/* Congela las respuestas del recorrido en una lista lista para subir (usa F actual) */
function armarItems(){
  const items=[];
  F.forEach(function(p,ix){
    let key = p.tipo==="confirmacion" ? (p.campo||("resp_"+(ix+1)))
            : p.tipo==="foto"        ? (p.campo||("foto_"+(ix+1)))
            : p.tipo==="dato"        ? (p.campo||("dato_"+(ix+1)))
            : p.tipo==="escaneo"     ? (p.campo||"equipo") : null;
    if(!key) return;
    const val=ejec.respuestas[key];
    if(val===undefined || val===null) return;
    const esFoto = (typeof val==="string" && val.indexOf("data:")===0);
    items.push({ paso_orden:p.orden, tipo_paso:p.tipo, campo:key, foto: esFoto?val:null, valor: esFoto?null:val });
  });
  ejec.items=items;
}

async function subirFoto(path, dataUrl){
  const blob=dataURLtoBlob(dataUrl);
  const res=await fetch(SB_URL+"/storage/v1/object/evidencias/"+path, {
    method:"POST", headers:{ apikey:SB_ANON, Authorization:"Bearer "+SB_ANON, "Content-Type":blob.type||"image/jpeg" }, body:blob
  });
  if(!res.ok){ let t=""; try{ t=await res.text(); }catch(e){} throw new Error("Storage "+res.status+" "+t); }
  return path;
}

async function subirEjecucion(ej){
  // Reponer empresa_id/version si faltan (ejecuciones encoladas por una versión anterior)
  if(!ej.empresa_id && ej.flujo_id && navigator.onLine){
    try{ const r=await sbFetch("/rest/v1/flujos?id=eq."+ej.flujo_id+"&select=empresa_id,version");
      if(r&&r[0]){ ej.empresa_id=r[0].empresa_id; if(!ej.flujo_version) ej.flujo_version=r[0].version||1; } }catch(e){}
  }
  if(!ej.empresa_id || !ej.flujo_id) throw new Error("Faltan empresa/flujo en la ejecución.");
  // Reponer items desde respuestas si faltan (ejecuciones viejas)
  let items=ej.items;
  if(!items){ items=[]; const r=ej.respuestas||{}; for(const key in r){ const val=r[key];
    if(val===undefined||val===null) continue; const esFoto=(typeof val==="string"&&val.indexOf("data:")===0);
    items.push({ paso_orden:null, tipo_paso:esFoto?"foto":null, campo:key, foto:esFoto?val:null, valor:esFoto?null:val }); } }
  // 1) Ejecución
  const body={ empresa_id:ej.empresa_id, flujo_id:ej.flujo_id, flujo_version:ej.flujo_version||1,
    operador_cedula:ej.operador_cedula||null, operador_nombre:ej.operador_nombre||null, equipo_id:ej.equipo_id||null,
    inicio:ej.inicio, fin:ej.fin||new Date().toISOString(), estado:"completada", resultado:ej.resultado||"pendiente",
    dispositivo:ej.dispositivo||"RealWear", hash:ej.hash||null };
  const ins=await sbFetch("/rest/v1/ejecuciones",{ method:"POST", headers:{ Prefer:"return=representation" }, body:JSON.stringify(body) });
  const ejecId=ins[0].id;
  // 2) Respuestas (+ fotos al Storage). Ruta: evidencia/<empresa_id>/<ejecucion_id>/<archivo>
  const rows=[];
  for(let k=0;k<items.length;k++){
    const it=items[k]; let evidencia_path=null;
    if(it.foto){
      const path="evidencia/"+ej.empresa_id+"/"+ejecId+"/"+(it.campo||("p"+it.paso_orden))+"_"+Date.now()+"_"+k+".jpg";
      await subirFoto(path, it.foto);
      evidencia_path=path;
    }
    rows.push({ ejecucion_id:ejecId, paso_orden:(it.paso_orden||null), tipo_paso:(it.tipo_paso||null),
      valor:(it.valor!==undefined&&it.valor!==null)?it.valor:null, evidencia_path:evidencia_path });
  }
  if(rows.length) await sbFetch("/rest/v1/ejecucion_respuestas",{ method:"POST", body:JSON.stringify(rows) });
  return ejecId;
}

let sincronizando=false;
function sincronizar(){
  if(sincronizando || !navigator.onLine || !db) return;
  sincronizando=true;
  let store;
  try{ store=db.transaction("pendientes","readonly").objectStore("pendientes").getAll(); }
  catch(e){ sincronizando=false; return; }
  store.onsuccess=function(){
    const lista=store.result||[];
    (async function(){
      for(let k=0;k<lista.length;k++){
        try{ await subirEjecucion(lista[k]); await borrarLocal(lista[k].id); }
        catch(e){ /* si falla, queda en cola para el próximo intento */ }
      }
      sincronizando=false; refrescarPend();
    })();
  };
  store.onerror=function(){ sincronizando=false; };
}
function borrarLocal(id){ return new Promise(function(res){ if(!db){res();return;} try{ const tx=db.transaction("pendientes","readwrite"); tx.objectStore("pendientes").delete(id); tx.oncomplete=function(){res()}; tx.onerror=function(){res()}; }catch(e){ res(); } }); }

/* ---------- Conexión ---------- */
function pintarNet(){ const el=$("#net"); if(!el)return; if(navigator.onLine){ el.className="pill on"; el.textContent="● En línea"; } else { el.className="pill off"; el.textContent="● Sin conexión"; } }
addEventListener("online", function(){ pintarNet(); sincronizar(); });
addEventListener("offline", pintarNet);

/* ---------- Init ---------- */
function boot(){
  try{ nuevaEjecucion(); showInicio(); }
  catch(e){ $("#screen").innerHTML='<div style="margin:auto;text-align:center;color:#f2a6a3;padding:20px;font-size:15px">No se pudo iniciar.<br><small style="color:#9fb0c9">'+((e&&e.message)||e)+'</small><br><br><button class="opt primary" style="max-width:240px" onclick="location.reload()">Reintentar</button></div>'; }
  try{ pintarNet(); }catch(e){}
  try{ abrirDB().then(function(){ refrescarPend(); sincronizar(); }).catch(function(){}); }catch(e){}
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();

/* PWA: registra el service worker con SCOPE PROPIO (solo esta página),
   para convivir con el sw.js de la app principal. Solo activa por HTTPS. */
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw-ra.js', { scope: 'realidad-asistida.html' }).catch(function(){}); });
}
