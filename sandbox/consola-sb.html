<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KALU · Consola</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#0f1218;--amber:#F28C00;--amber2:#FF9F1C;--bg:#eef0f4;--panel:#fff;--line:#e2e5ec;--line2:#d7dbe4;--tx:#1c2230;--mut:#6b7385;--pri:#2e75b6;--ok:#2fa36b;--no:#d9534f}
  html,body{height:100%}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:11px 20px;flex-shrink:0}
  header .txt b{display:block;font-size:16px;font-weight:800;letter-spacing:.4px;line-height:1}
  header .sp{flex:1}
  .btn{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:all .15s}
  .btn-amber{background:linear-gradient(180deg,var(--amber2),var(--amber));color:#1a1200}
  .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff}
  .btn-ghost:hover{border-color:var(--amber);color:var(--amber)}
  /* KPI */
  .kpis{display:flex;gap:12px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap}
  .kpi{flex:1;min-width:140px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 15px;position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--amber)}
  .kpi.g::before{background:var(--ok)}.kpi.r::before{background:var(--no)}.kpi.m::before{background:#8a93a3}
  .kpi .n{font-size:26px;font-weight:900;line-height:1}
  .kpi .l{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin-top:4px}
  /* Body */
  .body{flex:1;display:grid;grid-template-columns:380px 1fr;overflow:hidden}
  .col{overflow-y:auto;padding:14px}
  .col.left{border-right:1px solid var(--line);background:#f7f8fb}
  .filters{display:flex;gap:6px;margin-bottom:12px}
  .fchip{font-size:12px;font-weight:700;background:#fff;border:1.5px solid var(--line2);color:var(--tx);border-radius:20px;padding:5px 12px;cursor:pointer}
  .fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .ecard{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .ecard:hover{border-color:var(--line2)}
  .ecard.sel{border-color:var(--amber);box-shadow:0 0 0 3px rgba(242,140,0,.12)}
  .ecard .r1{display:flex;align-items:center;gap:8px}
  .ecard .fl{font-size:14px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ecard .r2{font-size:12px;color:var(--mut);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
  .bdg{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px}
  .bdg.apto{background:#e4f4ec;color:#1c6b47}.bdg.noapto{background:#fde7e6;color:#b23b34}.bdg.pend{background:#eef0f4;color:#6b7385}
  .empty{color:var(--mut);font-size:13px;text-align:center;padding:34px 12px;border:2px dashed var(--line2);border-radius:12px}
  /* Detalle */
  .det{max-width:820px}
  .det .dh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .det .dh .t{flex:1}
  .det .dh .t b{font-size:20px;font-weight:800;display:block}
  .det .dh .t span{font-size:13px;color:var(--mut)}
  .meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .mtile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:13px}
  .mtile b{display:block;font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
  h3.sec{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:18px 0 10px}
  table.resp{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}
  table.resp th,table.resp td{text-align:left;padding:9px 13px;font-size:13.5px;border-bottom:1px solid var(--line)}
  table.resp th{background:#f7f8fb;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:800}
  table.resp tr:last-child td{border-bottom:none}
  table.resp td.v{font-weight:700}
  .gallery{display:flex;gap:10px;flex-wrap:wrap}
  .gcell{width:150px}
  .gcell img{width:150px;height:110px;object-fit:cover;border-radius:9px;border:1px solid var(--line);background:#f0f0f0;display:block}
  .gcell .cap{font-size:11px;color:var(--mut);margin-top:4px}
  .gcell .ph{width:150px;height:110px;border-radius:9px;border:1px solid var(--line);background:#f0f0f0;display:flex;align-items:center;justify-content:center;color:#bbb;font-size:22px}
  .hash{margin-top:16px;font-family:ui-monospace,monospace;font-size:11px;color:#9aa3b2}
  /* Gate */
  #gate{position:fixed;inset:0;z-index:300;background:radial-gradient(1000px 520px at 50% -12%,#141a24,#0b0e13);display:flex;align-items:center;justify-content:center;padding:20px}
  #gate .gbox{width:100%;max-width:380px;text-align:center}
  #gate h1{font-size:24px;font-weight:900;color:#fff;margin-bottom:4px}
  #gate .gsub{color:#9aa3b2;font-size:13px;margin-bottom:22px}
  #gate .gfld{text-align:left;margin-bottom:12px}
  #gate .gfld label{display:block;font-size:11px;font-weight:700;color:#9aa3b2;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
  #gate input{width:100%;background:#141a24;border:1.5px solid #2a3340;border-radius:10px;color:#fff;font-size:15px;padding:11px 14px;font-family:inherit;outline:none}
  #gate input:focus{border-color:var(--amber)}
  #gate .gerr{color:#e0574a;font-size:13px;margin-bottom:10px;display:none}
  .spin{color:var(--mut);font-size:14px;padding:30px;text-align:center}
</style>
</head>
<body>

<div id="gate">
  <div class="gbox">
    <svg width="42" height="46" viewBox="0 0 46 50" style="margin-bottom:12px"><polygon points="23,2 44,13.5 44,36.5 23,48 2,36.5 2,13.5" fill="#1a140a" stroke="#F28C00" stroke-width="2.5"/><text x="23" y="31" text-anchor="middle" fill="#F28C00" font-size="15" font-weight="900" font-family="Inter">DI</text></svg>
    <h1>KALU · Consola</h1>
    <div class="gsub">Informes y estadísticas de tus inspecciones</div>
    <div class="gfld"><label>Email</label><input id="g_email" type="email" placeholder="tu@empresa.com" /></div>
    <div class="gfld"><label>Contraseña</label><input id="g_pass" type="password" onkeydown="if(event.key==='Enter')doLoginGate()" /></div>
    <div class="gerr" id="g_err"></div>
    <button class="btn btn-amber" id="g_btn" style="width:100%;justify-content:center" onclick="doLoginGate()">Ingresar →</button>
    <div style="margin-top:16px"><a href="/index.html" style="color:#8a93a3;font-size:12px;text-decoration:none">← Volver al inicio</a></div>
  </div>
</div>

<header>
  <svg width="30" height="33" viewBox="0 0 46 50"><polygon points="23,2 44,13.5 44,36.5 23,48 2,36.5 2,13.5" fill="#1a140a" stroke="#F28C00" stroke-width="3"/><text x="23" y="31" text-anchor="middle" fill="#F28C00" font-size="15" font-weight="900" font-family="Inter">DI</text></svg>
  <div class="txt"><b>KALU · Consola</b></div>
  <div class="sp"></div>
  <button class="btn btn-ghost" onclick="cargar()">↻ Actualizar</button>
  <span id="userChip" style="font-size:12px;color:#cfd4dd;font-weight:600"></span>
  <button class="btn btn-ghost" onclick="salir()">⎋ Salir</button>
</header>

<div class="kpis" id="kpis"></div>

<div class="body">
  <div class="col left">
    <div class="filters" id="filters">
      <button class="fchip on" data-f="todas" onclick="setFiltro('todas')">Todas</button>
      <button class="fchip" data-f="apto" onclick="setFiltro('apto')">Aptas</button>
      <button class="fchip" data-f="no_apto" onclick="setFiltro('no_apto')">No aptas</button>
    </div>
    <div id="lista"><div class="spin">Cargando…</div></div>
  </div>
  <div class="col"><div class="det" id="det"><div class="empty" style="margin-top:20px">Elegí una inspección de la izquierda para ver el detalle y la evidencia.</div></div></div>
</div>

<script>
const $ = s => document.querySelector(s);
/* SANDBOX (kalu plataforma) — copia de prueba */
const SB_URL  = "https://nignqeipzlemwfrwmpip.supabase.co";
const SB_ANON = "sb_publishable_7ni9tHH8H180SiFTEmXB_w_Qzmw_cXl";
let SB_TOKEN=null, SB_EMPRESA=null, SB_EMAIL=null;
let EJECS=[], filtro="todas", selId=null;

async function sbFetch(path, opts){
  opts=opts||{}; opts.headers=Object.assign({ apikey:SB_ANON, "Content-Type":"application/json" }, opts.headers||{});
  if(SB_TOKEN) opts.headers["Authorization"]="Bearer "+SB_TOKEN;
  const res=await fetch(SB_URL+path, opts);
  const txt=await res.text(); let data=null; try{ data=txt?JSON.parse(txt):null; }catch(e){ data=txt; }
  if(!res.ok) throw new Error((data&&(data.message||data.error_description||data.msg))||("HTTP "+res.status));
  return data;
}
async function sbLogin(email,password){
  const d=await sbFetch("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:email,password:password})});
  SB_TOKEN=d.access_token; SB_EMAIL=email;
  const u=await sbFetch("/auth/v1/user",{});
  const perf=await sbFetch("/rest/v1/perfiles?id=eq."+u.id+"&select=empresa_id,tiene_consola,nombre");
  if(!perf||!perf.length) throw new Error("Tu usuario no tiene perfil/empresa asignada.");
  if(!perf[0].tiene_consola) throw new Error("Tu usuario no tiene acceso a consola.");
  SB_EMPRESA=perf[0].empresa_id;
}
async function doLoginGate(){
  const email=$("#g_email").value.trim(), pass=$("#g_pass").value, err=$("#g_err"), btn=$("#g_btn");
  if(!email||!pass){ err.textContent="Completá email y contraseña."; err.style.display="block"; return; }
  btn.disabled=true; btn.textContent="Ingresando…"; err.style.display="none";
  try{ await sbLogin(email,pass); $("#gate").style.display="none"; $("#userChip").textContent="👤 "+SB_EMAIL; cargar(); }
  catch(e){ err.textContent=(e&&e.message)||"Error de login"; err.style.display="block"; }
  finally{ btn.disabled=false; btn.textContent="Ingresar →"; }
}
function salir(){ if(!confirm("¿Cerrar sesión?"))return; SB_TOKEN=null;SB_EMPRESA=null;SB_EMAIL=null; try{ sessionStorage.removeItem("kalu_ses"); }catch(e){} window.location.href="/nucleo/ingreso.html"; }

function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fFecha(s){ if(!s)return "—"; try{ const d=new Date(s); return d.toLocaleDateString()+" "+d.toLocaleTimeString().slice(0,5); }catch(e){ return "—"; } }
function badge(r){ if(r==="apto")return '<span class="bdg apto">APTO</span>'; if(r==="no_apto")return '<span class="bdg noapto">NO APTO</span>'; return '<span class="bdg pend">Pendiente</span>'; }

async function cargar(){
  $("#lista").innerHTML='<div class="spin">Cargando…</div>';
  try{
    EJECS=await sbFetch("/rest/v1/ejecuciones?empresa_id=eq."+SB_EMPRESA+"&select=id,operador_nombre,operador_cedula,equipo_id,inicio,fin,estado,resultado,dispositivo,hash,creado_en,flujos(nombre,tipo)&order=creado_en.desc");
    renderKpis(); renderLista();
  }catch(e){ $("#lista").innerHTML='<div class="empty" style="color:var(--no)">Error: '+esc((e&&e.message)||e)+'</div>'; }
}
function renderKpis(){
  const t=EJECS.length, a=EJECS.filter(function(e){return e.resultado==="apto";}).length,
        n=EJECS.filter(function(e){return e.resultado==="no_apto";}).length, p=t-a-n;
  $("#kpis").innerHTML=
    '<div class="kpi"><div class="n">'+t+'</div><div class="l">Inspecciones</div></div>'+
    '<div class="kpi g"><div class="n">'+a+'</div><div class="l">Aptas</div></div>'+
    '<div class="kpi r"><div class="n">'+n+'</div><div class="l">No aptas</div></div>'+
    '<div class="kpi m"><div class="n">'+p+'</div><div class="l">Pendientes</div></div>';
}
function setFiltro(f){ filtro=f; document.querySelectorAll(".fchip").forEach(function(c){ c.classList.toggle("on", c.getAttribute("data-f")===f); }); renderLista(); }
function renderLista(){
  const c=$("#lista");
  const list=EJECS.filter(function(e){ return filtro==="todas"||e.resultado===filtro; });
  if(!list.length){ c.innerHTML='<div class="empty">'+(EJECS.length?"No hay inspecciones con ese filtro.":"Todavía no hay inspecciones. Cuando el lente complete una, aparece acá.")+'</div>'; return; }
  c.innerHTML=list.map(function(e){
    const fl=(e.flujos&&e.flujos.nombre)||"(flujo)";
    return '<div class="ecard '+(e.id===selId?"sel":"")+'" onclick="verDetalle(\''+e.id+'\')">'+
      '<div class="r1"><span class="fl">'+esc(fl)+'</span>'+badge(e.resultado)+'</div>'+
      '<div class="r2"><span>🔧 '+esc(e.equipo_id||"—")+'</span><span>👤 '+esc(e.operador_nombre||e.operador_cedula||"—")+'</span><span>🕒 '+fFecha(e.creado_en||e.inicio)+'</span></div>'+
    '</div>';
  }).join("");
}

async function signedUrl(path){
  try{ const d=await sbFetch("/storage/v1/object/sign/evidencias/"+path,{method:"POST",body:JSON.stringify({expiresIn:3600})}); if(d&&d.signedURL) return SB_URL+"/storage/v1"+d.signedURL; }catch(e){}
  return null;
}
async function verDetalle(id){
  selId=id; renderLista();
  const e=EJECS.find(function(x){return x.id===id;}); if(!e)return;
  const d=$("#det"); d.innerHTML='<div class="spin">Cargando detalle…</div>';
  let resp=[];
  try{ resp=await sbFetch("/rest/v1/ejecucion_respuestas?ejecucion_id=eq."+id+"&select=paso_orden,tipo_paso,valor,evidencia_path,observacion&order=paso_orden.asc"); }catch(err){}
  const fl=(e.flujos&&e.flujos.nombre)||"(flujo)";
  let html='<div class="dh"><div class="t"><b>'+esc(fl)+'</b><span>Inspección · '+fFecha(e.creado_en||e.inicio)+'</span></div>'+badge(e.resultado)+'</div>';
  html+='<div class="meta">'+
    '<div class="mtile"><b>Equipo</b>'+esc(e.equipo_id||"—")+'</div>'+
    '<div class="mtile"><b>Operador</b>'+esc((e.operador_nombre||"")+(e.operador_cedula?" · "+e.operador_cedula:"")||"—")+'</div>'+
    '<div class="mtile"><b>Dispositivo</b>'+esc(e.dispositivo||"—")+'</div>'+
    '<div class="mtile"><b>Estado</b>'+esc(e.estado||"—")+'</div>'+
  '</div>';
  // Respuestas (no-foto)
  const filas=resp.filter(function(r){ return !r.evidencia_path; });
  html+='<h3 class="sec">Respuestas</h3>';
  if(filas.length){
    html+='<table class="resp"><tr><th style="width:60px">Paso</th><th>Tipo</th><th>Respuesta</th></tr>'+
      filas.map(function(r){ return '<tr><td>'+(r.paso_orden!=null?r.paso_orden:"—")+'</td><td>'+esc(r.tipo_paso||"—")+'</td><td class="v">'+esc(fmtVal(r.valor))+'</td></tr>'; }).join("")+'</table>';
  } else { html+='<div class="empty">Sin respuestas registradas.</div>'; }
  // Evidencia
  const fotos=resp.filter(function(r){ return r.evidencia_path; });
  html+='<h3 class="sec">Evidencia ('+fotos.length+')</h3>';
  if(fotos.length){
    html+='<div class="gallery" id="gallery">'+fotos.map(function(r,ix){ return '<div class="gcell"><div class="ph" id="g'+ix+'">📷</div><div class="cap">Paso '+(r.paso_orden!=null?r.paso_orden:"—")+'</div></div>'; }).join("")+'</div>';
  } else { html+='<div class="empty">Sin fotos.</div>'; }
  if(e.hash) html+='<div class="hash">Hash de integridad: '+esc(e.hash)+' (FNV-1a)</div>';
  html+='<div style="margin-top:18px"><button class="btn btn-amber" onclick="alert(\'El PDF firmado del informe lo activamos en la Parte 2 (con tu plantilla de la pestaña Informe).\')">🖨 Generar PDF del informe</button></div>';
  d.innerHTML=html;
  // cargar imágenes firmadas
  for(let ix=0; ix<fotos.length; ix++){
    const url=await signedUrl(fotos[ix].evidencia_path);
    const cell=$("#g"+ix);
    if(url && cell){ const img=new Image(); img.src=url; img.onload=function(){ cell.outerHTML='<img id="g'+ix+'" src="'+url+'" />'; }; img.onerror=function(){ cell.textContent="⚠"; }; }
  }
}
function fmtVal(v){ if(v==null)return "—"; if(typeof v==="object")return JSON.stringify(v); return String(v); }
/* SSO: si venís del ingreso con sesión activa, entrar directo */
function ssoAuto(){ try{ var s=JSON.parse(sessionStorage.getItem("kalu_ses")||"null");
  if(s&&s.token&&(Date.now()-s.ts)<55*60*1000){ SB_TOKEN=s.token; SB_EMPRESA=s.empresa; SB_EMAIL=s.email;
    document.getElementById("gate").style.display="none"; $("#userChip").textContent="👤 "+SB_EMAIL; cargar(); } }catch(e){} }
ssoAuto();
</script>

<div style="position:fixed;bottom:14px;left:14px;z-index:99999;background:linear-gradient(135deg,#F28C00,#FF9F1C);color:#141414;font:800 12px/1 monospace;padding:9px 14px;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.5);letter-spacing:1px;pointer-events:none;border:2px solid #141414">🧪 SANDBOX · base de pruebas</div>
</body>
</html>
