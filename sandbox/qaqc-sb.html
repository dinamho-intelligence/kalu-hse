<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KALU QA/QC · Aseguramiento · SANDBOX</title>
<!-- PWA desactivada en el sandbox (evita que un service worker cachee/secuestre otras páginas) -->
<!-- <link rel="manifest" href="/qaqc/manifest-qaqc.json"> -->
<meta name="theme-color" content="#0b0d0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="KALU QA/QC SB">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{--bg:#0b0d0a;--panel:#15181a;--panel2:#1b1f22;--border:#2a2f2c;--text:#f5f5f4;
    --muted:#a8a29e;--orange:#f5a623;--green:#34d399;--red:#f87171;--cyan:#4fc3f7}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);
    color:var(--text);min-height:100vh;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  header{position:sticky;top:0;z-index:10;background:rgba(11,13,10,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.02em}
  .hex{width:26px;height:28px}
  .status{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  .dot.off{background:var(--red);box-shadow:0 0 8px var(--red)}
  .pend{background:var(--panel2);border:1px solid var(--border);border-radius:20px;padding:3px 9px;font-weight:700;color:var(--orange)}
  main{flex:1;padding:18px 16px 40px}
  .view{display:none;animation:fade .2s}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  h1{font-size:22px;font-weight:800;margin-bottom:4px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
  label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px;font-weight:600}
  input,textarea,select{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:12px;
    color:var(--text);padding:14px;font-size:16px;font-family:inherit}
  textarea{min-height:70px;resize:vertical}
  .btn{width:100%;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px;
    display:flex;align-items:center;justify-content:center;gap:8px}
  .btn.primary{background:var(--orange);color:#141414}
  .btn.big{background:var(--orange);color:#141414;font-size:18px;padding:20px}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn:active{transform:scale(.99)}
  .btn:disabled{opacity:.5}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer}
  .card:active{border-color:var(--orange)}
  .card .t{font-weight:700;font-size:16px}
  .card .m{color:var(--muted);font-size:13px;margin-top:3px}
  .chip{display:inline-block;font-size:13px;font-weight:700;padding:9px 15px;border-radius:20px;border:1px solid var(--border);color:var(--muted);margin:5px 6px 0 0;cursor:pointer}
  .chip.main{color:var(--orange);border-color:rgba(245,166,35,.4)}
  .chip.backup{color:var(--cyan);border-color:rgba(79,195,247,.4)}
  .chip.sel{background:var(--orange);color:#141414;border-color:var(--orange)}
  .chip.static{cursor:default}
  .back{color:var(--muted);font-size:14px;background:none;border:0;cursor:pointer;margin-bottom:12px;padding:0}
  .galeria{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
  .thumb{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--panel)}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer}
  .thumb.add{display:flex;align-items:center;justify-content:center;border-style:dashed;cursor:pointer;color:var(--muted);font-size:30px}
  .thumb.add input{position:absolute;inset:0;opacity:0}
  .mic{margin-top:8px;display:flex;gap:10px;align-items:center}
  .mic button{flex:0 0 auto;width:56px;height:56px;border-radius:50%;border:0;background:var(--panel2);border:1px solid var(--border);font-size:22px;cursor:pointer}
  .mic button.rec{background:var(--red);border-color:var(--red);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.6}}
  .mic .hint{color:var(--muted);font-size:13px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--border);
    border-radius:12px;padding:12px 18px;font-size:14px;z-index:50;opacity:0;transition:opacity .3s;max-width:90%}
  .toast.on{opacity:1}
  .toast.ok{border-color:rgba(52,211,153,.5)}.toast.err{border-color:rgba(248,113,113,.5)}
  .empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
  .sbadge{position:fixed;left:10px;bottom:10px;z-index:9999;background:rgba(245,166,35,.15);border:1px solid rgba(245,166,35,.5);
    color:#f5a623;font:700 11px/1 -apple-system,BlinkMacSystemFont,sans-serif;padding:6px 10px;border-radius:20px;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="hex" viewBox="0 0 34 38"><polygon points="17,1.5 32.5,10.25 32.5,27.75 17,36.5 1.5,27.75 1.5,10.25" fill="none" stroke="#f5a623" stroke-width="2"/><text x="17" y="22.5" text-anchor="middle" fill="#f5a623" font-size="11" font-weight="700">DI</text></svg>
      KALU QA/QC
    </div>
    <div class="status">
      <span id="pend" class="pend" style="display:none">0</span>
      <span><span id="dot" class="dot"></span></span>
    </div>
  </header>
  <main>
    <!-- LOGIN -->
    <section id="v-login" class="view on">
      <h1>Aseguramiento en taller</h1>
      <p class="sub">Ingresá con tu cédula para empezar a registrar.</p>
      <label>Cédula</label>
      <input id="cedula" type="tel" inputmode="numeric" placeholder="Número de cédula" autocomplete="off">
      <button class="btn primary" onclick="login()">Entrar →</button>
    </section>
    <!-- ÓRDENES -->
    <section id="v-ordenes" class="view">
      <h1 id="hola">Hola</h1>
      <p class="sub">Elegí una orden de trabajo.</p>
      <div id="lista-ordenes"></div>
      <button class="btn ghost" onclick="salir()">Salir</button>
    </section>
    <!-- CAPTURA -->
    <section id="v-captura" class="view">
      <button class="back" onclick="show('v-ordenes')">← Órdenes</button>
      <h1 id="ot-titulo">OT</h1>
      <p class="sub" id="ot-sub"></p>
      <label>Herramienta <span style="text-transform:none;color:var(--muted);font-weight:400">— tocá para etiquetar (opcional)</span></label>
      <div id="herr-chips"></div>
      <label>Fotos <span style="text-transform:none;color:var(--muted);font-weight:400">— podés tomar varias</span></label>
      <div id="galeria" class="galeria"></div>
      <label>Dictado por voz</label>
      <div class="mic">
        <button id="micBtn" onclick="toggleMic()">🎙️</button>
        <span class="hint" id="micHint">Tocá el micrófono y dictá (herramienta, componente, medidas…)</span>
      </div>
      <textarea id="transcripcion" placeholder="Lo que dictes aparece acá; podés corregirlo."></textarea>
      <label>Nota (opcional)</label>
      <textarea id="texto" placeholder="Texto extra si querés."></textarea>
      <button class="btn big" onclick="guardar()">💾 Guardar registro</button>
    </section>
  </main>
</div>
<div id="toast" class="toast"></div>
<div class="sbadge">🧪 SANDBOX · base de pruebas</div>
<script>
// ====== CONFIG · SANDBOX UNIFICADO (kalu-plataforma) ======
const SB_URL = 'https://nignqeipzlemwfrwmpip.supabase.co';
const SB_KEY = 'sb_publishable_7ni9tHH8H180SiFTEmXB_w_Qzmw_cXl';
const H = {'apikey':SB_KEY};   // publishable: solo apikey (sin Authorization Bearer)
// ====== ESTADO ======
let tec = null;         // {tecnico_id, nombre, empresa_id, cedula}
let ordenActual = null; // {id, codigo, pozo, ...}
let herrSel = null;     // herramienta_id etiquetada (opcional)
let fotos = [];         // varias fotos por captura: [{id, blob, url}]
let rec = null, grabando = false;
// ====== HELPERS SUPABASE ======
async function rpc(fn, args){
  const r = await fetch(SB_URL+'/rest/v1/rpc/'+fn, {method:'POST',
    headers:{...H,'Content-Type':'application/json'}, body:JSON.stringify(args)});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function subirFoto(path, blob){
  const r = await fetch(SB_URL+'/storage/v1/object/capturas/'+path, {method:'POST',
    headers:{...H,'Content-Type':blob.type||'image/jpeg'}, body:blob});   // sin x-upsert
  if(!r.ok) throw new Error('storage '+r.status+' '+await r.text());
  return true;
}
function fnv1a(str){ let h=0x811c9dc5; for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193);} return (h>>>0).toString(16); }
function uuid(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random().toString(16).slice(2)); }
// ====== INDEXEDDB (cola offline) ======
let db;
function openDB(){ return new Promise((res,rej)=>{ const q=indexedDB.open('kalu_qaqc_sb',1);
  q.onupgradeneeded=e=>{ e.target.result.createObjectStore('cola',{keyPath:'offline_id'}); };
  q.onsuccess=e=>{db=e.target.result;res();}; q.onerror=e=>rej(e); }); }
function tx(store,mode){ return db.transaction(store,mode).objectStore(store); }
function encolar(item){ return new Promise(r=>{ tx('cola','readwrite').put(item).onsuccess=()=>r(); }); }
function listaCola(){ return new Promise(r=>{ tx('cola','readonly').getAll().onsuccess=e=>r(e.target.result||[]); }); }
function borrarCola(id){ return new Promise(r=>{ tx('cola','readwrite').delete(id).onsuccess=()=>r(); }); }
// ====== UI ======
function show(id){ document.querySelectorAll('.view').forEach(v=>v.classList.remove('on')); document.getElementById(id).classList.add('on'); }
function toast(msg,tipo){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast on '+(tipo||''); setTimeout(()=>t.className='toast',2600); }
async function updatePend(){ const n=(await listaCola()).length; const el=document.getElementById('pend'); el.style.display=n?'inline-block':'none'; el.textContent=n; }
// ====== FLUJO ======
async function login(){
  const c=document.getElementById('cedula').value.trim();
  if(!c){ toast('Escribí tu cédula'); return; }
  try{
    const rows=await rpc('tec_login',{p_cedula:c});
    if(!rows.length){ toast('Cédula no encontrada o inactiva','err'); return; }
    tec={...rows[0], cedula:c};
    document.getElementById('hola').textContent='Hola, '+(tec.nombre||'técnico');
    await cargarOrdenes();
    show('v-ordenes');
  }catch(e){ toast('Error de conexión','err'); console.error(e); }
}
function salir(){ tec=null; document.getElementById('cedula').value=''; show('v-login'); }
async function cargarOrdenes(){
  const cont=document.getElementById('lista-ordenes');
  try{
    const ots=await rpc('tec_ordenes',{p_cedula:tec.cedula});
    if(!ots.length){ cont.innerHTML='<div class="empty">No hay órdenes asignadas.</div>'; return; }
    cont.innerHTML=ots.map(o=>`<div class="card" onclick='abrirOrden(${JSON.stringify(o).replace(/'/g,"&#39;")})'>
      <div class="t">${o.codigo}</div>
      <div class="m">${o.pozo||'—'} · ${o.cliente||''} · ${o.estado}</div></div>`).join('');
  }catch(e){ cont.innerHTML='<div class="empty">No se pudieron cargar (offline).</div>'; }
}
async function abrirOrden(o){
  ordenActual=o; fotos.forEach(f=>URL.revokeObjectURL(f.url)); fotos=[]; renderGaleria();
  document.getElementById('ot-titulo').textContent=o.codigo;
  document.getElementById('ot-sub').textContent=(o.pozo||'')+' · '+(o.cliente||'');
  document.getElementById('transcripcion').value='';
  document.getElementById('texto').value='';
  // herramientas (seleccionables para etiquetar)
  herrSel=null;
  const chips=document.getElementById('herr-chips'); chips.innerHTML='';
  try{
    const hs=await rpc('tec_herramientas',{p_cedula:tec.cedula,p_orden_id:o.id});
    if(hs.length){
      chips.innerHTML=hs.map(h=>`<span class="chip ${h.rol}" data-id="${h.id}" onclick="selHerr(${h.id},this)">${h.nombre} · ${h.rol}</span>`).join('');
    } else {
      chips.innerHTML='<span class="chip static">sin herramientas cargadas</span>';
    }
  }catch(e){}
  show('v-captura');
}
function selHerr(id, el){
  if(herrSel===id){ herrSel=null; el.classList.remove('sel'); return; }  // toca de nuevo = deselecciona
  herrSel=id;
  document.querySelectorAll('#herr-chips .chip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
}
function onFoto(e){
  const files=e.target.files; if(!files||!files.length) return;
  for(const f of files){ fotos.push({id:uuid(), blob:f, url:URL.createObjectURL(f)}); }
  e.target.value='';        // permite volver a agregar más
  renderGaleria();
}
function removeFoto(id){
  const i=fotos.findIndex(f=>f.id===id);
  if(i>=0){ URL.revokeObjectURL(fotos[i].url); fotos.splice(i,1); renderGaleria(); }
}
function renderGaleria(){
  const g=document.getElementById('galeria');
  const thumbs=fotos.map(f=>`<div class="thumb"><img src="${f.url}"><span class="x" onclick="removeFoto('${f.id}')">✕</span></div>`).join('');
  const add=`<label class="thumb add"><input type="file" accept="image/*" capture="environment" onchange="onFoto(event)"><span>＋</span></label>`;
  g.innerHTML=thumbs+add;
}
// ====== VOZ ======
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('Este navegador no soporta dictado; escribí a mano','err'); return; }
  if(grabando){ rec && rec.stop(); return; }
  rec=new SR(); rec.lang='es-CO'; rec.continuous=true; rec.interimResults=true;
  let base=document.getElementById('transcripcion').value;
  rec.onstart=()=>{ grabando=true; document.getElementById('micBtn').classList.add('rec'); document.getElementById('micHint').textContent='Escuchando… tocá de nuevo para parar'; };
  rec.onresult=ev=>{ let txt=''; for(let i=ev.resultIndex;i<ev.results.length;i++) txt+=ev.results[i][0].transcript;
    document.getElementById('transcripcion').value=(base?base+' ':'')+txt; };
  rec.onend=()=>{ grabando=false; document.getElementById('micBtn').classList.remove('rec'); document.getElementById('micHint').textContent='Tocá el micrófono y dictá'; };
  rec.onerror=()=>{ grabando=false; document.getElementById('micBtn').classList.remove('rec'); };
  rec.start();
}
// ====== GUARDAR (registro primero, sync después) ======
async function guardar(){
  const transcripcion=document.getElementById('transcripcion').value.trim();
  const texto=document.getElementById('texto').value.trim();
  if(!fotos.length && !transcripcion && !texto){ toast('Tomá una foto o dictá algo'); return; }
  const base={ empresa_id:tec.empresa_id, orden_id:ordenActual.id, herramienta_id:herrSel,
    cedula:tec.cedula, transcripcion, texto };
  let cuenta=0;
  if(fotos.length){
    // cada foto = un registro (después se elige cuál va al informe)
    for(const f of fotos){
      const oid=uuid();
      await encolar({ ...base, offline_id:oid, tipo:'foto',
        hash:fnv1a(transcripcion+'|'+texto+'|'+oid), blob:f.blob, created:Date.now() });
      cuenta++;
    }
  } else {
    const oid=uuid();
    await encolar({ ...base, offline_id:oid, tipo:(transcripcion?'voz':'texto'),
      hash:fnv1a(transcripcion+'|'+texto+'|'+oid), blob:null, created:Date.now() });
    cuenta=1;
  }
  await updatePend();
  toast((cuenta>1 ? cuenta+' registros guardados' : 'Registro guardado')+'. Sincronizando…','ok');
  // limpiar para la próxima
  fotos.forEach(f=>URL.revokeObjectURL(f.url)); fotos=[]; renderGaleria();
  document.getElementById('transcripcion').value=''; document.getElementById('texto').value='';
  herrSel=null; document.querySelectorAll('#herr-chips .chip').forEach(c=>c.classList.remove('sel'));
  sync();
}
// ====== SYNC ======
let sincronizando=false;
async function sync(){
  if(sincronizando || !navigator.onLine) return;
  sincronizando=true;
  const items=await listaCola();
  for(const it of items){
    try{
      let path=null;
      if(it.blob){ path=it.empresa_id+'/'+it.orden_id+'/'+it.offline_id+'.jpg'; await subirFoto(path,it.blob); }
      await rpc('tec_guardar_captura',{ p_cedula:it.cedula, p_orden_id:it.orden_id,
        p_herramienta_id: it.herramienta_id||null, p_tipo:it.tipo,
        p_storage_path:path, p_transcripcion:it.transcripcion||null, p_texto:it.texto||null,
        p_hash:it.hash, p_offline_id:it.offline_id });
      await borrarCola(it.offline_id);
    }catch(e){ console.warn('pendiente',it.offline_id,e); /* queda en cola */ }
  }
  sincronizando=false;
  await updatePend();
  const n=(await listaCola()).length;
  if(n===0 && items.length) toast('Todo sincronizado ✓','ok');
}
// ====== RED ======
function setNet(){ document.getElementById('dot').className='dot'+(navigator.onLine?'':' off'); if(navigator.onLine) sync(); }
window.addEventListener('online',setNet); window.addEventListener('offline',setNet);
// ====== PWA DESACTIVADA + limpieza de service workers viejos ======
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }).catch(function(){});
  if(window.caches && caches.keys){ caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }).catch(function(){}); }
}
// ====== INIT ======
openDB().then(()=>{ updatePend(); setNet(); setInterval(sync,20000); });
</script>
</body>
</html>
